<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<style>html:not(.gate-ok) body>*:not(#kgate){display:none!important}html:not(.gate-ok){background:#000}</style>
<script src="/gate.js"></script>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<title>Konfirmasi Pesanan</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@500;600;700;800&family=JetBrains+Mono:wght@600;700&display=swap" rel="stylesheet">
<style>
:root{color-scheme:light;--bg:#f2f2f7;--ink:#000;--muted:#636366;--g1:rgba(255,255,255,.78);--g2:rgba(255,255,255,.5);--edge:rgba(255,255,255,.9);--hair:rgba(60,60,67,.14);--ctl:rgba(118,118,128,.12);--shadow:0 0 0 .5px rgba(0,0,0,.05),0 8px 24px -10px rgba(0,0,0,.18);--accent:#007aff;--btn-a:#1a8aff;--btn-b:#007aff;--green:#1c8a38;--green-bg:rgba(52,199,89,.16);--amber:#9a5a00;--amber-bg:rgba(255,159,10,.16);--red:#d70015;--red-bg:rgba(255,59,48,.12);--info:#0a5fd0;--info-bg:rgba(0,122,255,.12);--blob1:#5ac8fa;--blob2:#0a84ff;--blob3:#5e5ce6;--blob4:#30d5c8;--blob-o:.5;--blur:18px;--sat:170%;--ease:cubic-bezier(.2,.8,.2,1);--font:'Plus Jakarta Sans',-apple-system,BlinkMacSystemFont,'SF Pro Display',system-ui,sans-serif;--mono:'JetBrains Mono',ui-monospace,Menlo,monospace}
:root[data-theme="dark"]{color-scheme:dark;--bg:#000;--ink:#fff;--muted:#9a9aa0;--g1:rgba(255,255,255,.11);--g2:rgba(255,255,255,.04);--edge:rgba(255,255,255,.14);--hair:rgba(255,255,255,.12);--ctl:rgba(118,118,128,.24);--shadow:0 1px 0 rgba(255,255,255,.08) inset,0 16px 36px -16px rgba(0,0,0,.8);--accent:#0a84ff;--btn-a:#2e94ff;--btn-b:#0a84ff;--green:#30d158;--green-bg:rgba(48,209,88,.16);--amber:#ffd60a;--amber-bg:rgba(255,214,10,.14);--red:#ff453a;--red-bg:rgba(255,69,58,.16);--info:#64b0ff;--info-bg:rgba(10,132,255,.2);--blob1:#64d2ff;--blob2:#0a84ff;--blob3:#5e5ce6;--blob4:#40c8e0;--blob-o:.42}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important}}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html{background:var(--bg);-webkit-text-size-adjust:100%}
body{font-family:var(--font);background:transparent;color:var(--ink);min-height:100dvh;padding:calc(14px + env(safe-area-inset-top)) 16px calc(96px + env(safe-area-inset-bottom));-webkit-font-smoothing:antialiased;overflow-x:hidden}
button{font:inherit;color:inherit;border:0;background:none;cursor:pointer}
.aurora{position:fixed;inset:0;z-index:-1;overflow:hidden;background:var(--bg)}
.aurora i{position:absolute;width:62vmax;height:62vmax;border-radius:50%;filter:blur(70px);opacity:var(--blob-o);animation:drift 26s ease-in-out infinite alternate}
.aurora i:nth-child(1){background:var(--blob1);top:-22vmax;left:-18vmax}
.aurora i:nth-child(2){background:var(--blob2);top:10vmax;right:-30vmax;animation-delay:-6s;animation-duration:32s}
.aurora i:nth-child(3){background:var(--blob3);bottom:-30vmax;left:-12vmax;animation-delay:-12s;opacity:calc(var(--blob-o)*.55)}
.aurora i:nth-child(4){background:var(--blob4);bottom:-24vmax;right:-20vmax;animation-delay:-3s;animation-duration:38s;opacity:calc(var(--blob-o)*.7)}
@keyframes drift{to{transform:translate3d(6vmax,4vmax,0) scale(1.12)}}
.wrap{max-width:720px;margin:0 auto}
.glass{background:linear-gradient(180deg,var(--g1),var(--g2));border:.5px solid var(--edge);border-radius:24px;box-shadow:var(--shadow);backdrop-filter:blur(var(--blur)) saturate(var(--sat));-webkit-backdrop-filter:blur(var(--blur)) saturate(var(--sat))}
.top{display:flex;align-items:center;gap:12px;padding:14px 14px 14px 18px;margin-bottom:14px}
.top h1{font-size:21px;font-weight:800;letter-spacing:-.03em;line-height:1.15}
.top p{font-size:12.5px;color:var(--muted);font-weight:600;margin-top:2px}
.top .grow{flex:1;min-width:0}
.ibtn{width:42px;height:42px;border-radius:50%;display:grid;place-items:center;background:var(--ctl);transition:transform .25s var(--ease)}
.ibtn:active{transform:scale(.92)}
.ibtn svg{width:19px;height:19px}
.ibtn.spin svg{animation:spin .8s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-bottom:14px}
.stat{padding:14px 8px;text-align:center;border-radius:20px}
.stat b{display:block;font-size:26px;font-weight:800;letter-spacing:-.03em;line-height:1.1;font-variant-numeric:tabular-nums}
.stat span{display:block;margin-top:3px;font-size:11.5px;color:var(--muted);font-weight:700}
.stat.warn b{color:var(--amber)} .stat.good b{color:var(--green)}
.chips{display:flex;gap:8px;overflow-x:auto;scrollbar-width:none;margin:0 -16px 14px;padding:2px 16px}
.chips::-webkit-scrollbar{display:none}
.chip{flex:0 0 auto;padding:9px 15px;border-radius:999px;font-size:13px;font-weight:700;background:var(--ctl);color:var(--muted);transition:all .25s var(--ease)}
.chip.on{color:#fff;background:linear-gradient(180deg,var(--btn-a),var(--btn-b));box-shadow:0 6px 16px -6px rgba(0,122,255,.55)}
.list{display:grid;gap:12px}
.order{padding:16px;animation:rise .45s var(--ease) both}
@keyframes rise{from{opacity:0;transform:translateY(10px) scale(.985)}}
.o-top{display:flex;align-items:center;justify-content:space-between;gap:10px}
.code{font-family:var(--mono);font-size:15px;font-weight:700;letter-spacing:.04em}
.pill{display:inline-flex;align-items:center;gap:6px;padding:6px 11px;border-radius:999px;font-size:11.5px;font-weight:800;line-height:1;white-space:nowrap}
.pill::before{content:"";width:6px;height:6px;border-radius:50%;background:currentColor}
.pill.wait{color:var(--amber);background:var(--amber-bg)} .pill.info{color:var(--info);background:var(--info-bg)}
.pill.ok{color:var(--green);background:var(--green-bg)} .pill.bad{color:var(--red);background:var(--red-bg)}
.o-pkg{display:flex;align-items:baseline;justify-content:space-between;gap:10px;margin-top:10px;font-size:15px;font-weight:800;letter-spacing:-.02em}
.o-pkg small{font-size:12px;color:var(--muted);font-weight:600;letter-spacing:0}
.o-buyer{margin-top:10px;padding:10px 12px;border-radius:14px;background:var(--ctl);font-size:13px;font-weight:700;display:flex;flex-direction:column;gap:2px;word-break:break-word}
.o-buyer span{color:var(--muted);font-weight:600;font-size:12.5px}.o-buyer .o-mail b{color:var(--ink);font-size:13px}.copy-mini{margin-left:6px;border:1px solid var(--ctl-edge,#ffffff30);background:var(--ctl);color:var(--ink);border-radius:999px;padding:3px 10px;font-size:11.5px;font-weight:700;cursor:pointer}
.proof{margin-top:10px}
.proof-btn{width:100%;min-height:42px;border-radius:14px;background:var(--ctl);font-size:13px;font-weight:700;display:flex;align-items:center;justify-content:center;gap:8px}
.proof img{display:block;width:100%;max-height:220px;object-fit:contain;border-radius:14px;background:var(--ctl);cursor:zoom-in}
.proof small{display:block;margin-top:6px;font-size:12px;color:var(--muted);font-weight:600}
.acts{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:12px}
.act{min-height:42px;border-radius:999px;font-size:12.5px;font-weight:800;background:var(--ctl);transition:transform .2s var(--ease)}
.act:active{transform:scale(.95)}
.act.go{color:#fff;background:linear-gradient(180deg,var(--btn-a),var(--btn-b));box-shadow:0 6px 16px -6px rgba(0,122,255,.55)}
.act:disabled{opacity:.5}
.empty{padding:44px 20px;text-align:center;color:var(--muted);font-weight:700;font-size:14px}
.err{margin-bottom:14px;padding:12px 14px;border-radius:16px;font-size:13px;font-weight:700;color:var(--red);background:var(--red-bg)}
.zoom{position:fixed;inset:0;z-index:50;display:grid;place-items:center;padding:16px;background:rgba(0,0,0,.82);cursor:zoom-out;animation:fade .25s}
.zoom img{max-width:100%;max-height:100%;object-fit:contain;border-radius:12px}
@keyframes fade{from{opacity:0}}
.toast{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom));transform:translateX(-50%);z-index:60;padding:12px 18px;border-radius:999px;font-size:13px;font-weight:800;white-space:nowrap;animation:rise .35s var(--ease)}
@media(max-width:360px){.acts{grid-template-columns:1fr 1fr}}
</style>
</head>
<body>
<div class="aurora"><i></i><i></i><i></i><i></i></div>
<div class="wrap">
  <header class="glass top">
    <div class="grow"><h1>Konfirmasi Pesanan</h1><p>AM Premium · cek bukti, lalu konfirmasi</p></div>
    <button class="ibtn" id="theme" aria-label="Ganti tema"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg></button>
    <button class="ibtn" id="refresh" aria-label="Muat ulang"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12a9 9 0 1 1-3-6.7L21 8"/><path d="M21 3v5h-5"/></svg></button>
  </header>
  <section class="stats">
    <div class="glass stat"><b id="sTotal">0</b><span>Total</span></div>
    <div class="glass stat warn"><b id="sWait">0</b><span>Perlu dicek</span></div>
    <div class="glass stat good"><b id="sDone">0</b><span>Selesai</span></div>
  </section>
  <nav class="chips" id="chips"></nav>
  <div class="glass" style="padding:10px 14px;margin-bottom:14px;border-radius:16px">
    <input type="text" id="searchCode" placeholder="Cari kode pesanan..." style="width:100%;border:none;background:transparent;font-size:14px;font-weight:600;outline:none;color:var(--ink)" oninput="filterByCode(this.value)" />
  </div>
  <div id="msg"></div>
  <main class="list" id="list"><div class="glass empty">Memuat...</div></main>
</div>
<script>
const DB='https://kenzie-preset-default-rtdb.firebaseio.com';
const ST={pending:['Menunggu bayar','wait'],review:['Perlu dicek','info'],paid:['Dibayar','info'],done:['Selesai','ok'],cancel:['Dibatalkan','bad']};
const FILTERS=[['all','Semua'],['review','Perlu dicek'],['pending','Menunggu bayar'],['paid','Dibayar'],['done','Selesai'],['cancel','Batal']];
let orders=[],buyers={},filter='review',proofs={},searchQ='';
function filterByCode(q){searchQ=q.toLowerCase().trim();render()}
const $=id=>document.getElementById(id);
const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&','<':'<','>':'>','"':'"',"'":'&#39;'}[c]));
const rp=n=>'Rp '+(Number(n)||0).toLocaleString('id-ID');
const when=t=>{try{return new Date(t).toLocaleString('id-ID',{day:'2-digit',month:'short',hour:'2-digit',minute:'2-digit'})}catch{return''}};
const norm=s=>s==='confirmed'?'done':(ST[s]?s:'pending');
async function api(path,method,body){const r=await fetch(DB+'/'+path+'.json',{method:method||'GET',body:body===undefined?undefined:JSON.stringify(body)});if(!r.ok)throw new Error('HTTP '+r.status);return r.json()}
function toast(t,ok){const e=document.createElement('div');e.className='glass toast';e.style.color=ok===false?'var(--red)':'var(--green)';e.textContent=t;document.body.appendChild(e);setTimeout(()=>e.remove(),2200)}
async function load(){$('refresh').classList.add('spin');$('msg').innerHTML='';try{const v=await api('orders');orders=v?Object.entries(v).map(([id,o])=>Object.assign({id},o,{status:norm(o.status),t:o.t||o.time||0})).sort((a,b)=>b.t-a.t):[];try{buyers=(await api('buyers'))||{}}catch{buyers={}}}catch(e){$('msg').innerHTML='<div class="err">Gagal memuat pesanan. Cek aturan Firebase untuk "orders".</div>';orders=[]}$('refresh').classList.remove('spin');render()}
function render(){const cnt=k=>k==='all'?orders.filter(o=>o.status!=='done'&&o.status!=='cancel').length:orders.filter(o=>o.status===k).length;$('sTotal').textContent=orders.filter(o=>o.status!=='done'&&o.status!=='cancel').length;$('sWait').textContent=orders.filter(o=>o.status==='review'||o.status==='paid').length;$('sDone').textContent=cnt('done');$('chips').innerHTML=FILTERS.map(([k,l])=>'<button class="chip'+(filter===k?' on':'')+'" data-f="'+k+'">'+l+' '+cnt(k)+'</button>').join('');let rows=filter==='all'?orders.filter(o=>o.status!=='done'&&o.status!=='cancel'):orders.filter(o=>o.status===filter);if(searchQ)rows=rows.filter(o=>o.id.toLowerCase().includes(searchQ));if(!rows.length){$('list').innerHTML='<div class="glass empty">Tidak ada pesanan di sini</div>';return}$('list').innerHTML=rows.map((o,i)=>{const b=buyers[o.id]||(o.wa||o.name?{name:o.name,wa:o.wa}:{});const s=ST[o.status],p=proofs[o.id];return '<article class="glass order" style="animation-delay:'+Math.min(i,8)*45+'ms"><div class="o-top"><span class="code">'+esc(o.id)+'</span><span class="pill '+s[1]+'">'+s[0]+'</span></div><div class="o-pkg"><span>'+esc(o.pkg||'Premium')+' <small>'+rp(o.price)+'</small></span><small>'+when(o.t)+'</small></div>'+(b.name||b.wa||b.email?'<div class="o-buyer"><b>'+esc(b.name||'-')+'</b>'+(b.wa?'<span>WhatsApp: '+esc(b.wa)+'</span>':'')+(b.email?'<span class="o-mail">Email AM: <b>'+esc(b.email)+'</b> <button class="copy-mini" type="button" data-copy="'+esc(b.email)+'">Salin</button></span>':'<span>Email AM: (tidak diisi)</span>')+'</div>':'')+'<div class="proof" id="pf-'+esc(o.id)+'">'+(p?proofHtml(p):'<button class="proof-btn" data-proof="'+esc(o.id)+'">Lihat bukti pembayaran</button>')+'</div><div class="acts"><button class="act" data-set="paid" data-id="'+esc(o.id)+'">Dibayar</button><button class="act go" data-set="done" data-id="'+esc(o.id)+'">Uang masuk & AM Prem dikirim</button><button class="act" data-set="cancel" data-id="'+esc(o.id)+'">Ditolak, cek WA</button></div></article>'}).join('')}
function proofHtml(p){if(p==='none')return '<small>Belum ada bukti diupload</small>';return '<img src="'+esc(p.img)+'" alt="Bukti bayar" data-zoom />'+(p.note?'<small>Catatan: '+esc(p.note)+'</small>':'')}
async function showProof(id){const box=$('pf-'+id);box.innerHTML='<small>Memuat...</small>';try{let p=await api('proofs/'+id);if(!p){const o=orders.find(x=>x.id===id);if(o&&o.proof)p={img:o.proof}}proofs[id]=p&&p.img?p:'none'}catch{proofs[id]='none'}box.innerHTML=proofHtml(proofs[id])}
async function setStatus(id,st,btn){btn.disabled=true;try{await api('orders/'+id+'/status','PUT',st);const o=orders.find(x=>x.id===id);if(o)o.status=st;toast(st==='done'?'Pesanan dikonfirmasi':'Status diperbarui');render()}catch{toast('Gagal memperbarui',false);btn.disabled=false}}
document.addEventListener('click',e=>{const t=e.target.closest('[data-f],[data-proof],[data-set],[data-zoom],[data-copy]');if(!t)return;if(t.dataset.copy){const v=t.dataset.copy;(navigator.clipboard?navigator.clipboard.writeText(v):Promise.reject()).then(()=>toast('Email disalin')).catch(()=>{const x=document.createElement('textarea');x.value=v;document.body.appendChild(x);x.select();try{document.execCommand('copy');toast('Email disalin')}catch(_){toast('Gagal menyalin',false)}x.remove()})}else if(t.dataset.f){filter=t.dataset.f;render()}else if(t.dataset.proof)showProof(t.dataset.proof);else if(t.dataset.set)setStatus(t.dataset.id,t.dataset.set,t);else if(t.hasAttribute('data-zoom')){const z=document.createElement('div');z.className='zoom';z.innerHTML='<img alt="">';z.firstChild.src=t.src;z.onclick=()=>z.remove();document.body.appendChild(z)}});
$('refresh').onclick=load;
(function(){let th=null;try{th=localStorage.getItem('kenzie_theme')}catch{}if(!th)th=matchMedia('(prefers-color-scheme: dark)').matches?'dark':'light';const apply=v=>{if(v==='dark')document.documentElement.dataset.theme='dark';else document.documentElement.removeAttribute('data-theme')};apply(th);$('theme').onclick=()=>{th=th==='dark'?'light':'dark';apply(th);try{localStorage.setItem('kenzie_theme',th)}catch{}}})();
load();setInterval(()=>{if(!document.hidden)load()},60000);
</script>
</body>
</html>
