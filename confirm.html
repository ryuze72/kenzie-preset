<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Konfirmasi Pesanan</title>
<style>
:root { --bg:#000; --surface:#1c1c1e; --ink:#f5f5f7; --muted:#98989d; --accent:#0a84ff; --green:#30d158; --amber:#ff9f0a; --red:#ff453a; --line:rgba(255,255,255,.08); }
* { box-sizing:border-box; margin:0; padding:0; }
body { font-family:-apple-system,BlinkMacSystemFont,sans-serif; background:var(--bg); color:var(--ink); min-height:100dvh; padding:16px; }
h1 { font-size:22px; font-weight:700; margin-bottom:4px; }
.sub { color:var(--muted); font-size:13px; margin-bottom:16px; }
.stats { display:grid; grid-template-columns:1fr 1fr 1fr; gap:8px; margin-bottom:16px; }
.stat { background:var(--surface); border-radius:14px; padding:12px; text-align:center; border:1px solid var(--line); }
.stat b { display:block; font-size:20px; font-weight:700; }
.stat span { font-size:10px; color:var(--muted); }
.list { display:flex; flex-direction:column; gap:10px; }
.order { background:var(--surface); border-radius:16px; padding:14px; border:1px solid var(--line); }
.order-top { display:flex; justify-content:space-between; align-items:center; margin-bottom:8px; }
.order-id { font-weight:700; font-size:14px; }
.badge { font-size:11px; font-weight:700; padding:4px 10px; border-radius:999px; }
.badge.pending { background:rgba(255,159,10,.15); color:var(--amber); }
.badge.confirmed { background:rgba(48,209,88,.15); color:var(--green); }
.order-wa { font-size:13px; color:var(--muted); margin-bottom:8px; }
.order-time { font-size:11px; color:var(--muted); }
.actions { display:flex; gap:8px; margin-top:10px; }
.btn { flex:1; padding:10px; border-radius:10px; border:none; font-weight:600; font-size:13px; cursor:pointer; }
.btn-ok { background:var(--green); color:#fff; }
.btn-wa { background:rgba(255,255,255,.1); color:var(--ink); }
.empty { text-align:center; color:var(--muted); padding:40px; }
.refresh { position:fixed; bottom:20px; right:20px; width:50px; height:50px; border-radius:50%; background:var(--accent); border:none; color:#fff; font-size:20px; cursor:pointer; }
</style>
</head>
<body>
<h1>Konfirmasi Pesanan</h1>
<p class="sub">AM Premium — cek dan konfirmasi pembayaran</p>
<div class="stats">
  <div class="stat"><b id="totalOrders">0</b><span>Total</span></div>
  <div class="stat"><b id="pendingOrders">0</b><span>Menunggu</span></div>
  <div class="stat"><b id="confirmedOrders">0</b><span>Dikonfirmasi</span></div>
</div>
<div class="list" id="orderList"><div class="empty">Memuat...</div></div>
<button class="refresh" onclick="loadOrders()">↻</button>
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-database-compat.js"></script>
<script>
const firebaseConfig = {
  apiKey: "AIzaSyDuRmnuZ0XMqwdh7X4ITutmwTgA3YL-5bc",
  authDomain: "kenzie-preset.firebaseapp.com",
  databaseURL: "https://kenzie-preset-default-rtdb.firebaseio.com",
  projectId: "kenzie-preset"
};
firebase.initializeApp(firebaseConfig);
const db = firebase.database();

async function loadOrders() {
  document.getElementById('orderList').innerHTML = '<div class="empty">Memuat...</div>';
  try {
    const snap = await db.ref('orders').once('value');
    const val = snap.val();
    const orders = val ? Object.entries(val).map(([k,v]) => ({id:k, ...v})).reverse() : [];
    // Also check localStorage
    const local = JSON.parse(localStorage.getItem('kenzie_orders') || '[]');
    const all = [...orders];
    local.forEach(l => { if (!all.find(o => o.id === l.id)) all.push(l); });
    updateStats(all);
    renderOrders(all);
  } catch(e) {
    // Fallback to localStorage
    const local = JSON.parse(localStorage.getItem('kenzie_orders') || '[]');
    updateStats(local);
    renderOrders(local);
  }
}
function updateStats(orders) {
  document.getElementById('totalOrders').textContent = orders.length;
  document.getElementById('pendingOrders').textContent = orders.filter(o => o.status !== 'confirmed').length;
  document.getElementById('confirmedOrders').textContent = orders.filter(o => o.status === 'confirmed').length;
}
function renderOrders(orders) {
  const el = document.getElementById('orderList');
  if (!orders.length) { el.innerHTML = '<div class="empty">Belum ada pesanan</div>'; return; }
  el.innerHTML = orders.map(o => {
    const t = new Date(o.time);
    const timeStr = t.toLocaleString('id-ID', {day:'2-digit',month:'short',hour:'2-digit',minute:'2-digit'});
    const isConfirmed = o.status === 'confirmed';
    return `<div class="order">
      <div class="order-top">
        <span class="order-id">${o.id}</span>
        <span class="badge ${isConfirmed?'confirmed':'pending'}">${isConfirmed?'Dikonfirmasi':'Menunggu'}</span>
      </div>
      <div class="order-wa">WA: ${o.wa}</div>
      <div class="order-time">${timeStr}</div>
      <div class="actions">
        ${!isConfirmed ? `<button class="btn btn-ok" onclick="confirmOrder('${o.id}')">Konfirmasi</button>` : ''}
        <a class="btn btn-wa" href="https://wa.me/${o.wa.replace(/^0/,'62')}" target="_blank">Chat WA</a>
      </div>
    </div>`;
  }).join('');
}
async function confirmOrder(id) {
  try {
    await db.ref('orders/' + id + '/status').set('confirmed');
    const local = JSON.parse(localStorage.getItem('kenzie_orders') || '[]');
    const idx = local.findIndex(o => o.id === id);
    if (idx >= 0) { local[idx].status = 'confirmed'; localStorage.setItem('kenzie_orders', JSON.stringify(local)); }
    loadOrders();
  } catch(e) { alert('Gagal konfirmasi'); }
}
loadOrders();
</script>
</body>
</html>
