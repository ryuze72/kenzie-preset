<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>KENZIE Monitor</title>
<style>
:root { --bg:#000; --surface:#1c1c1e; --ink:#f5f5f7; --muted:#98989d; --accent:#0a84ff; --green:#30d158; --red:#ff453a; --line:rgba(255,255,255,.08); }
* { box-sizing:border-box; margin:0; padding:0; }
body { font-family:-apple-system,BlinkMacSystemFont,sans-serif; background:var(--bg); color:var(--ink); min-height:100dvh; padding:16px; }
h1 { font-size:22px; font-weight:700; margin-bottom:4px; }
.sub { color:var(--muted); font-size:13px; margin-bottom:16px; }
.stats { display:grid; grid-template-columns:1fr 1fr 1fr 1fr; gap:8px; margin-bottom:16px; }
.stat { background:var(--surface); border-radius:14px; padding:12px; text-align:center; border:1px solid var(--line); }
.stat b { display:block; font-size:20px; font-weight:700; }
.stat span { font-size:10px; color:var(--muted); }
.tabs { display:flex; gap:6px; margin-bottom:14px; flex-wrap:wrap; }
.tab { flex:1; min-width:70px; padding:8px; border-radius:10px; border:1px solid var(--line); background:transparent; color:var(--ink); font-weight:600; font-size:12px; cursor:pointer; }
.tab.active { background:var(--accent); border-color:var(--accent); }
.list { display:flex; flex-direction:column; gap:8px; }
.item { background:var(--surface); border-radius:12px; padding:12px; border:1px solid var(--line); }
.item-top { display:flex; justify-content:space-between; align-items:center; margin-bottom:4px; }
.badge { font-size:11px; font-weight:700; padding:3px 8px; border-radius:6px; }
.badge.visit { background:rgba(10,132,255,.15); color:var(--accent); }
.badge.admin_login { background:rgba(48,209,88,.15); color:var(--green); }
.badge.admin_logout { background:rgba(255,69,58,.15); color:var(--red); }
.badge.view { background:rgba(10,132,255,.15); color:var(--accent); }
.badge.use { background:rgba(48,209,88,.15); color:var(--green); }
.time { font-size:12px; color:var(--muted); }
.meta { font-size:12px; color:var(--muted); margin-top:4px; word-break:break-all; }
.empty { text-align:center; color:var(--muted); padding:40px; }
.refresh { position:fixed; bottom:20px; right:20px; width:50px; height:50px; border-radius:50%; background:var(--accent); border:none; color:#fff; font-size:20px; cursor:pointer; box-shadow:0 4px 16px rgba(0,0,0,.3); }
</style>
</head>
<body>
<h1>KENZIE Monitor</h1>
<p class="sub">Pengunjung, login, dan statistik preset</p>
<div class="stats">
  <div class="stat"><b id="totalVisits">0</b><span>Kunjungan</span></div>
  <div class="stat"><b id="uniqueVisitors">0</b><span>Pengunjung</span></div>
  <div class="stat"><b id="adminLogins">0</b><span>Login Admin</span></div>
  <div class="stat"><b id="totalUses">0</b><span>Preset Dipakai</span></div>
</div>
<div class="tabs">
  <button class="tab active" onclick="filterList('all')">Semua</button>
  <button class="tab" onclick="filterList('visit')">Kunjungan</button>
  <button class="tab" onclick="filterList('admin')">Admin</button>
  <button class="tab" onclick="filterList('stats')">Statistik</button>
</div>
<div class="list" id="logList"><div class="empty">Memuat...</div></div>
<button class="refresh" onclick="loadAll()">↻</button>
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-database-compat.js"></script>
<script>
const firebaseConfig = {
  apiKey: "AIzaSyDuRmnuZ0XMqwdh7X4ITutmwTgA3YL-5bc",
  authDomain: "kenzie-preset.firebaseapp.com",
  databaseURL: "https://kenzie-preset-default-rtdb.firebaseio.com",
  projectId: "kenzie-preset",
  storageBucket: "kenzie-preset.firebasestorage.app",
  messagingSenderId: "225447135498",
  appId: "1:225447135498:web:ce6515b38b10ea602e92f3"
};
firebase.initializeApp(firebaseConfig);
const db = firebase.database();
let allLogs = [], statsData = {}, currentFilter = 'all';

async function loadAll() {
  document.getElementById('logList').innerHTML = '<div class="empty">Memuat...</div>';
  try {
    const [logsSnap, statsSnap] = await Promise.all([
      db.ref('logs').orderByChild('time').limitToLast(200).once('value'),
      db.ref('stats').once('value')
    ]);
    const logsVal = logsSnap.val();
    allLogs = logsVal ? Object.entries(logsVal).map(([k,v]) => ({id:k, ...v})).reverse() : [];
    statsData = statsSnap.val() || {};
    updateStats();
    renderList();
  } catch(e) {
    document.getElementById('logList').innerHTML = '<div class="empty">Gagal: ' + e.message + '</div>';
  }
}
function updateStats() {
  const visits = allLogs.filter(l => l.type === 'visit');
  const unique = new Set(visits.map(l => l.vid)).size;
  const admins = allLogs.filter(l => l.type === 'admin_login').length;
  let totalUses = 0;
  for (const id in statsData) totalUses += Number(statsData[id]?.u) || 0;
  document.getElementById('totalVisits').textContent = visits.length;
  document.getElementById('uniqueVisitors').textContent = unique;
  document.getElementById('adminLogins').textContent = admins;
  document.getElementById('totalUses').textContent = totalUses;
}
function filterList(f) {
  currentFilter = f;
  document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
  event.target.classList.add('active');
  renderList();
}
function renderList() {
  const el = document.getElementById('logList');
  if (currentFilter === 'stats') {
    const entries = Object.entries(statsData);
    if (!entries.length) { el.innerHTML = '<div class="empty">Belum ada statistik</div>'; return; }
    entries.sort((a,b) => ((b[1]?.u||0) + (b[1]?.v||0)) - ((a[1]?.u||0) + (a[1]?.v||0)));
    el.innerHTML = entries.map(([id, s]) => {
      const v = Number(s?.v) || 0, u = Number(s?.u) || 0;
      return `<div class="item"><div class="item-top"><span class="badge view">${id}</span><span class="time">${u} dipakai · ${v} dilihat</span></div></div>`;
    }).join('');
    return;
  }
  let list = allLogs;
  if (currentFilter === 'visit') list = list.filter(l => l.type === 'visit');
  else if (currentFilter === 'admin') list = list.filter(l => l.type?.startsWith('admin'));
  if (!list.length) { el.innerHTML = '<div class="empty">Belum ada data</div>'; return; }
  el.innerHTML = list.map(l => {
    const t = new Date(l.time);
    const timeStr = t.toLocaleString('id-ID', {day:'2-digit',month:'short',hour:'2-digit',minute:'2-digit'});
    const label = l.type === 'visit' ? 'Kunjungan' : l.type === 'admin_login' ? 'Login Admin' : l.type === 'admin_logout' ? 'Logout Admin' : l.type;
    return `<div class="item"><div class="item-top"><span class="badge ${l.type}">${label}</span><span class="time">${timeStr}</span></div><div class="meta">${l.vid || '-'} · ${l.page || ''}</div></div>`;
  }).join('');
}
loadAll();
</script>
</body>
</html>
