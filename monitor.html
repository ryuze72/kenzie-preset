<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<style>html:not(.gate-ok) body>*:not(#kgate){display:none!important}html:not(.gate-ok){background:#000}</style>
<script src="/gate.js"></script>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<title>KENZIE Monitor</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@500;600;700;800&family=JetBrains+Mono:wght@600;700&display=swap" rel="stylesheet">
<style>
:root{color-scheme:light;--bg:#f2f2f7;--ink:#000;--muted:#636366;--g1:rgba(255,255,255,.78);--g2:rgba(255,255,255,.5);--edge:rgba(255,255,255,.9);--hair:rgba(60,60,67,.14);--ctl:rgba(118,118,128,.12);
--shadow:0 0 0 .5px rgba(0,0,0,.05),0 8px 24px -10px rgba(0,0,0,.18);--accent:#007aff;--btn-a:#1a8aff;--btn-b:#007aff;
--green:#1c8a38;--green-bg:rgba(52,199,89,.16);--amber:#9a5a00;--amber-bg:rgba(255,159,10,.16);--red:#d70015;--red-bg:rgba(255,59,48,.12);--info:#0a5fd0;--info-bg:rgba(0,122,255,.12);--teal:#0a7f8f;--teal-bg:rgba(50,173,230,.16);
--blob1:#5ac8fa;--blob2:#0a84ff;--blob3:#5e5ce6;--blob4:#30d5c8;--blob-o:.5;--blur:18px;--sat:170%;--ease:cubic-bezier(.2,.8,.2,1);
--font:'Plus Jakarta Sans',-apple-system,BlinkMacSystemFont,'SF Pro Display',system-ui,sans-serif;--mono:'JetBrains Mono',ui-monospace,Menlo,monospace}
:root[data-theme=dark]{color-scheme:dark;--bg:#000;--ink:#fff;--muted:#9a9aa0;--g1:rgba(255,255,255,.11);--g2:rgba(255,255,255,.04);--edge:rgba(255,255,255,.14);--hair:rgba(255,255,255,.12);--ctl:rgba(118,118,128,.24);
--shadow:0 1px 0 rgba(255,255,255,.08) inset,0 16px 36px -16px rgba(0,0,0,.8);--accent:#0a84ff;--btn-a:#2e94ff;--btn-b:#0a84ff;
--green:#30d158;--green-bg:rgba(48,209,88,.16);--amber:#ffd60a;--amber-bg:rgba(255,214,10,.14);--red:#ff453a;--red-bg:rgba(255,69,58,.16);--info:#64b0ff;--info-bg:rgba(10,132,255,.2);--teal:#64d2ff;--teal-bg:rgba(100,210,255,.16);
--blob1:#64d2ff;--blob2:#0a84ff;--blob3:#5e5ce6;--blob4:#40c8e0;--blob-o:.42}
@media(prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important}}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html{background:var(--bg);-webkit-text-size-adjust:100%}
body{font-family:var(--font);color:var(--ink);min-height:100dvh;padding:calc(14px + env(safe-area-inset-top)) 16px calc(40px + env(safe-area-inset-bottom));-webkit-font-smoothing:antialiased;overflow-x:hidden}
button{font:inherit;color:inherit;border:0;background:none;cursor:pointer}a{color:inherit;text-decoration:none}
.aurora{position:fixed;inset:0;z-index:-1;overflow:hidden;background:var(--bg)}
.aurora i{position:absolute;width:62vmax;height:62vmax;border-radius:50%;filter:blur(70px);opacity:var(--blob-o);animation:drift 26s ease-in-out infinite alternate}
.aurora i:nth-child(1){background:var(--blob1);top:-22vmax;left:-18vmax}.aurora i:nth-child(2){background:var(--blob2);top:10vmax;right:-30vmax;animation-delay:-6s;animation-duration:32s}
.aurora i:nth-child(3){background:var(--blob3);bottom:-30vmax;left:-12vmax;animation-delay:-12s;opacity:calc(var(--blob-o)*.55)}.aurora i:nth-child(4){background:var(--blob4);bottom:-24vmax;right:-20vmax;animation-delay:-3s;animation-duration:38s;opacity:calc(var(--blob-o)*.7)}
@keyframes drift{to{transform:translate3d(6vmax,4vmax,0) scale(1.12)}}
.wrap{max-width:760px;margin:0 auto}
.glass{background:linear-gradient(180deg,var(--g1),var(--g2));border:.5px solid var(--edge);border-radius:24px;box-shadow:var(--shadow);backdrop-filter:blur(var(--blur)) saturate(var(--sat));-webkit-backdrop-filter:blur(var(--blur)) saturate(var(--sat))}
.top{display:flex;align-items:center;gap:10px;padding:14px 14px 14px 18px;margin-bottom:12px}
.top .grow{flex:1;min-width:0}.top h1{font-size:21px;font-weight:800;letter-spacing:-.03em}.top p{font-size:12.5px;color:var(--muted);font-weight:600;margin-top:2px}
.live{display:inline-block;width:8px;height:8px;border-radius:50%;background:#34c759;margin-right:6px;animation:pulse 2s infinite}
@keyframes pulse{50%{box-shadow:0 0 0 6px rgba(52,199,89,0)}0%{box-shadow:0 0 0 0 rgba(52,199,89,.5)}}
.ibtn{width:42px;height:42px;border-radius:50%;display:grid;place-items:center;background:var(--ctl);transition:transform .25s var(--ease)}.ibtn:active{transform:scale(.92)}.ibtn svg{width:19px;height:19px}.ibtn.spin svg{animation:spin .8s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.seg{display:flex;gap:4px;padding:4px;margin-bottom:12px;overflow-x:auto;scrollbar-width:none;border-radius:999px}.seg::-webkit-scrollbar{display:none}
.seg button{flex:1 0 auto;padding:10px 14px;border-radius:999px;font-size:13px;font-weight:700;color:var(--muted);transition:all .3s var(--ease);white-space:nowrap}
.seg button.on{background:linear-gradient(135deg,var(--btn-a),var(--btn-b));color:#fff;box-shadow:0 6px 16px -6px rgba(0,122,255,.45)}
.stats{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;margin-bottom:12px}
@media(min-width:560px){.stats{grid-template-columns:repeat(4,1fr)}}
.stat{padding:14px 16px}.stat b{display:block;font-size:22px;font-weight:800;letter-spacing:-.03em}.stat span{font-size:11.5px;color:var(--muted);font-weight:700}
.panel{display:none;padding:6px 0 10px}.panel.on{display:block}
.card{padding:16px;margin-bottom:12px}.card h2{font-size:15px;font-weight:800;margin-bottom:10px;display:flex;align-items:center;justify-content:space-between;gap:8px}.card h2 small{font-size:12px;font-weight:600;color:var(--muted)}
.row{display:flex;align-items:flex-start;gap:12px;padding:12px 0;border-bottom:1px solid var(--hair)}.row:last-child{border-bottom:0}
.badge{flex:0 0 auto;min-width:64px;text-align:center;padding:6px 8px;border-radius:12px;font-size:11px;font-weight:800}
.badge.ok{background:var(--green-bg);color:var(--green)}.badge.wait{background:var(--amber-bg);color:var(--amber)}.badge.fail{background:var(--red-bg);color:var(--red)}.badge.info{background:var(--info-bg);color:var(--info)}.badge.teal{background:var(--teal-bg);color:var(--teal)}
.meta{flex:1;min-width:0}.meta .t{font-weight:800;font-size:14px;margin-bottom:2px;word-break:break-word}.meta .s{font-size:12px;color:var(--muted);font-weight:600;word-break:break-word}.meta .id{font-family:var(--mono);font-size:11px;color:var(--accent);margin-top:4px}
.bar{height:8px;border-radius:99px;background:var(--ctl);overflow:hidden;margin-top:6px}.bar i{display:block;height:100%;background:linear-gradient(90deg,var(--btn-a),var(--btn-b));border-radius:99px}
.empty{padding:28px 16px;text-align:center;color:var(--muted);font-weight:600;font-size:13px}
.foot{margin-top:14px;text-align:center;font-size:11.5px;color:var(--muted);font-weight:600}
.foot a{color:var(--accent);font-weight:700}
.btn{padding:8px 12px;border-radius:999px;background:var(--ctl);font-size:12px;font-weight:700}
</style>
</head>
<body>
<div class="aurora" aria-hidden="true"><i></i><i></i><i></i><i></i></div>
<div class="wrap">
  <div class="glass top">
    <div class="grow">
      <h1>KENZIE Monitor</h1>
      <p><span class="live"></span>Live · semua aktivitas fitur</p>
    </div>
    <button class="ibtn" id="btnTheme" type="button" title="Tema" aria-label="Tema">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/></svg>
    </button>
    <button class="ibtn" id="btnReload" type="button" title="Refresh" aria-label="Refresh">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M23 4v6h-6M1 20v-6h6"/><path d="M3.51 9a9 9 0 0 1 14.85-3.36L23 10M1 14l4.64 4.36A9 9 0 0 0 20.49 15"/></svg>
    </button>
  </div>

  <div class="glass seg" id="tabs"></div>
  <div class="glass seg" id="ranges" style="margin-top:-4px"></div>
  <div class="stats" id="stats"></div>
  <div id="panels"></div>

  <p class="foot">Kenzie Preset · <a id="siteLink" href="https://kenzie-preset.vercel.app/">kenzie-preset.vercel.app</a></p>
</div>
<script>
const DB='https://kenzie-preset-default-rtdb.firebaseio.com';
const SITE=(location.origin&&/kenzie-preset/i.test(location.origin)?location.origin:'https://kenzie-preset.vercel.app');
const TABS=[['ov','Ringkasan'],['act','Aktivitas'],['pre','Preset'],['ord','Pesanan'],['sys','Halaman']];
const RANGES=[['1','Hari ini'],['7','7 hari'],['0','Semua']];
const PAGES={home:'Beranda',search:'Cari',premium:'Premium',music:'Musik',contact:'Hubungi',amprem:'AM Premium',sms:'SMS',monitor:'Monitor',admin:'Admin',detail:'Detail preset'};
const FEAT={home:'Beranda',search:'Pencarian',premium:'Premium',music:'Musik',music_play:'Putar lagu',music_download:'Unduh lagu',contact:'Hubungi',amprem:'AM Premium',sms:'Temp SMS',tempmail:'Temp Mail',fake_ml:'Fake Lobby ML',fake_ff:'Fake Lobby FF',hd:'HD Foto',view_preset:'Lihat preset',open_preset:'Buka preset',copy_link:'Salin link',share:'Share'};

const $=(s,r=document)=>r.querySelector(s);
const $$=(s,r=document)=>[...r.querySelectorAll(s)];
let range='7', tab='ov', cache={logs:[], presets:[], orders:[]};

function themeInit(){
  const t=localStorage.getItem('kenzie_theme')||(matchMedia('(prefers-color-scheme: dark)').matches?'dark':'light');
  document.documentElement.setAttribute('data-theme',t);
}
themeInit();
$('#btnTheme').onclick=()=>{
  const cur=document.documentElement.getAttribute('data-theme')==='dark'?'light':'dark';
  document.documentElement.setAttribute('data-theme',cur);
  localStorage.setItem('kenzie_theme',cur);
};

async function getJSON(path){
  try{
    const r=await fetch(DB+path+'.json',{cache:'no-store'});
    if(!r.ok) return null;
    return await r.json();
  }catch(e){ return null; }
}
function num(n){ return (Number(n)||0).toLocaleString('id-ID'); }
function fmtTime(ts){
  if(!ts) return '—';
  try{
    const d=new Date(typeof ts==='number'? (ts<1e12?ts*1000:ts) : Date.parse(ts));
    if(isNaN(d)) return String(ts);
    return d.toLocaleString('id-ID',{dateStyle:'short',timeStyle:'short'});
  }catch(e){ return String(ts); }
}
function dayStart(d){ const x=new Date(d); x.setHours(0,0,0,0); return x.getTime(); }
function inRange(ts){
  if(range==='0') return true;
  const t=typeof ts==='number'? (ts<1e12?ts*1000:ts) : Date.parse(ts);
  if(!t||isNaN(t)) return true;
  const now=Date.now();
  if(range==='1') return t>=dayStart(now);
  if(range==='7') return t>=now-7*864e5;
  return true;
}
function featName(k){ return FEAT[k]||PAGES[k]||k||'—'; }
function pageName(k){ return PAGES[k]||k||'—'; }

function buildTabs(){
  $('#tabs').innerHTML=TABS.map(([id,label],i)=>`<button type="button" data-tab="${id}" class="${id===tab?'on':''}">${label}</button>`).join('');
  $('#ranges').innerHTML=RANGES.map(([id,label])=>`<button type="button" data-range="${id}" class="${id===range?'on':''}">${label}</button>`).join('');
  $$('#tabs button').forEach(b=>b.onclick=()=>{ tab=b.dataset.tab; buildTabs(); render(); });
  $$('#ranges button').forEach(b=>b.onclick=()=>{ range=b.dataset.range; buildTabs(); render(); });
}

function row(badgeClass,badgeText,title,sub,id){
  return `<div class="row"><div class="badge ${badgeClass}">${badgeText}</div><div class="meta"><div class="t">${title}</div><div class="s">${sub||''}</div>${id?`<div class="id">${id}</div>`:''}</div></div>`;
}
function barRow(label,value,max){
  const pct=max?Math.max(4,Math.round(value/max*100)):0;
  return `<div class="row" style="align-items:center"><div class="meta" style="width:100%"><div class="t" style="display:flex;justify-content:space-between"><span>${label}</span><span>${num(value)}</span></div><div class="bar"><i style="width:${pct}%"></i></div></div></div>`;
}

function filterLogs(){
  return (cache.logs||[]).filter(x=>inRange(x.ts||x.time||x.createdAt));
}

function render(){
  const L=filterLogs();
  const byFeat={};
  const byPage={};
  const bySearch={};
  const bySong={};
  const days=[];
  for(let i=6;i>=0;i--){
    const d=new Date(); d.setHours(0,0,0,0); d.setDate(d.getDate()-i);
    days.push({t:d.getTime(),n:0,label:d.toLocaleDateString('id-ID',{weekday:'short'})});
  }
  L.forEach(x=>{
    const f=x.feature||x.feat||x.type||x.event||'other';
    byFeat[f]=(byFeat[f]||0)+1;
    const p=x.page||x.path||'';
    if(p) byPage[p]=(byPage[p]||0)+1;
    if(x.q||x.query||x.search){ const q=String(x.q||x.query||x.search).toLowerCase(); bySearch[q]=(bySearch[q]||0)+1; }
    if(x.song||x.title||x.track){ const s=String(x.song||x.title||x.track); bySong[s]=(bySong[s]||0)+1; }
    const ts=typeof x.ts==='number'?(x.ts<1e12?x.ts*1000:x.ts):Date.parse(x.ts||x.time||x.createdAt);
    if(ts){ const ds=dayStart(ts); const day=days.find(d=>d.t===ds); if(day) day.n++; }
  });

  $('#stats').innerHTML=`
    <div class="glass stat"><b>${num(L.length)}</b><span>Aktivitas</span></div>
    <div class="glass stat"><b>${num(Object.keys(byFeat).length)}</b><span>Jenis fitur</span></div>
    <div class="glass stat"><b>${num((cache.presets||[]).length)}</b><span>Preset</span></div>
    <div class="glass stat"><b>${num((cache.orders||[]).length)}</b><span>Pesanan</span></div>`;

  let html='';
  if(tab==='ov'){
    const topFeat=Object.entries(byFeat).sort((a,b)=>b[1]-a[1]).slice(0,8);
    const maxF=topFeat[0]?topFeat[0][1]:1;
    html+=`<div class="glass card"><h2>Kunjungan 7 hari<small>${num(days.reduce((a,d)=>a+d.n,0))} total</small></h2>${days.map(d=>barRow(d.label,d.n,Math.max(...days.map(x=>x.n),1))).join('')||'<div class="empty">Belum ada data</div>'}</div>`;
    html+=`<div class="glass card"><h2>Fitur paling dibuka</h2>${topFeat.map(([k,v])=>barRow(featName(k),v,maxF)).join('')||'<div class="empty">Belum ada data</div>'}</div>`;
    html+=`<div class="glass card"><h2>Terbaru<small>${L.length} aktivitas</small></h2>${L.slice(0,12).map(x=>row('info',featName(x.feature||x.feat||x.type||x.event),x.label||x.message||x.q||x.path||featName(x.feature||x.type),fmtTime(x.ts||x.time),x.id||'')).join('')||'<div class="empty">Belum ada aktivitas</div>'}</div>`;
  } else if(tab==='act'){
    const topSearch=Object.entries(bySearch).sort((a,b)=>b[1]-a[1]).slice(0,10);
    const topSong=Object.entries(bySong).sort((a,b)=>b[1]-a[1]).slice(0,10);
    html+=`<div class="glass card"><h2>Pencarian terbanyak</h2>${topSearch.map(([k,v])=>row('teal',String(v),k,'','')).join('')||'<div class="empty">Belum ada pencarian</div>'}</div>`;
    html+=`<div class="glass card"><h2>Lagu paling diputar</h2>${topSong.map(([k,v])=>row('ok',String(v),k,'','')).join('')||'<div class="empty">Belum ada data musik</div>'}</div>`;
    html+=`<div class="glass card"><h2>Log aktivitas<small>${L.length}</small></h2>${L.slice(0,60).map(x=>row('info',featName(x.feature||x.feat||x.type||x.event),x.label||x.message||x.q||x.path||'—',[x.page?pageName(x.page):'',fmtTime(x.ts||x.time)].filter(Boolean).join(' · '),x.uid||x.ip||'')).join('')||'<div class="empty">Belum ada log</div>'}</div>`;
  } else if(tab==='pre'){
    const e=(cache.presets||[]).slice().sort((a,b)=>(b.views||0)-(a.views||0));
    const used=e.slice().sort((a,b)=>(b.uses||b.used||0)-(a.uses||a.used||0));
    html+=`<div class="glass card"><h2>Paling dilihat</h2>${e.slice(0,15).map(p=>row('info',String(p.views||0),p.name||p.title||p.id,p.id||'','')).join('')||'<div class="empty">Belum ada preset</div>'}</div>`;
    html+=`<div class="glass card"><h2>Paling dipakai</h2>${used.slice(0,15).map(p=>row('ok',String(p.uses||p.used||0),p.name||p.title||p.id,p.id||'','')).join('')||'<div class="empty">Belum ada data</div>'}</div>`;
    html+=`<div class="glass card"><h2>Semua preset<small>${e.length}</small></h2>${e.slice(0,40).map(p=>row('teal',p.cat||p.category||'—',p.name||p.title||p.id,[p.creator||p.author||'',fmtTime(p.createdAt||p.ts)].filter(Boolean).join(' · '),p.id)).join('')||'<div class="empty">Kosong</div>'}</div>`;
  } else if(tab==='ord'){
    const O=(cache.orders||[]).slice().sort((a,b)=>(b.createdAt||b.ts||0)-(a.createdAt||a.ts||0));
    html+=`<div class="glass card"><h2>Pesanan terbaru<small>${O.length}</small></h2>${O.slice(0,50).map(o=>{const st=String(o.status||'—'); let bc='info'; if(/done|ok|selesai|success|paid/i.test(st)) bc='ok'; else if(/pending|wait|proses/i.test(st)) bc='wait'; else if(/fail|cancel|reject|error/i.test(st)) bc='fail'; return row(bc,st,o.email||o.buyer||o.name||o.id,[o.package||o.paket||'',fmtTime(o.createdAt||o.ts)].filter(Boolean).join(' · '),o.orderId||o.id);}).join('')||'<div class="empty">Belum ada pesanan</div>'}</div>`;
  } else if(tab==='sys'){
    const pages=Object.entries(byPage).sort((a,b)=>b[1]-a[1]);
    html+=`<div class="glass card"><h2>Halaman web</h2>${pages.map(([k,v])=>row('info',String(v),pageName(k),k,'')).join('')||'<div class="empty">Belum ada data halaman</div>'}</div>`;
    html+=`<div class="glass card"><h2>Layanan</h2>${[
      row('ok','SITE',SITE,'Domain aktif'),
      row('info','DB',DB.replace('https://',''),'Firebase RTDB'),
      row('teal','AM',SITE+'/amprem.html','AM Premium'),
      row('wait','SMS',SITE+'/sms.html','Temp SMS'),
      row('info','Monitor',SITE+'/monitor.html','Monitor ini'),
    ].join('')}</div>`;
  }
  $('#panels').innerHTML=html||'<div class="glass empty">Tidak ada data</div>';
}

function normalizeLogs(data){
  if(!data) return [];
  if(Array.isArray(data)) return data.filter(Boolean);
  if(typeof data==='object'){
    return Object.entries(data).map(([k,v])=>({id:k,...(v||{})}));
  }
  return [];
}
function normalizePresets(data){
  if(!data) return [];
  if(Array.isArray(data)) return data.filter(Boolean);
  if(typeof data==='object'){
    return Object.entries(data).map(([k,v])=>({id:k,...(v||{})}));
  }
  return [];
}
function normalizeOrders(data){
  if(!data) return [];
  if(typeof data==='object'){
    return Object.entries(data).map(([k,v])=>({id:k,...(v||{})}));
  }
  return [];
}

async function loadAll(){
  const btn=$('#btnReload'); btn.classList.add('spin');
  try{
    const [logs, logs2, presets, orders]=await Promise.all([
      getJSON('/activity'),
      getJSON('/logs'),
      getJSON('/presets'),
      getJSON('/orders'),
    ]);
    const A=normalizeLogs(logs).concat(normalizeLogs(logs2));
    A.sort((a,b)=>(b.ts||b.time||0)-(a.ts||a.time||0));
    cache.logs=A;
    cache.presets=normalizePresets(presets);
    cache.orders=normalizeOrders(orders);
    render();
  }finally{ btn.classList.remove('spin'); }
}

$('#siteLink').href=SITE+'/';
$('#siteLink').textContent=SITE.replace(/^https?:\/\//,'');
buildTabs();
$('#btnReload').onclick=()=>loadAll();
document.addEventListener('visibilitychange',()=>{ if(!document.hidden) loadAll(); });
loadAll();
setInterval(()=>{ if(!document.hidden) loadAll(); },60000);
</script>
</body>
</html>
