<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<style>html:not(.gate-ok) body>*:not(#kgate){display:none!important}html:not(.gate-ok){background:#000}</style>
<script src="/gate.js"></script>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<title>KENZIE Monitor</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@500;600;700;800&family=JetBrains+Mono:wght@600;700&display=swap" rel="stylesheet">
<style>
:root{color-scheme:light;--bg:#f2f2f7;--ink:#000;--muted:#636366;--g1:rgba(255,255,255,.78);--g2:rgba(255,255,255,.5);--edge:rgba(255,255,255,.9);--hair:rgba(60,60,67,.14);--ctl:rgba(118,118,128,.12);
--shadow:0 0 0 .5px rgba(0,0,0,.05),0 8px 24px -10px rgba(0,0,0,.18);--accent:#007aff;--btn-a:#1a8aff;--btn-b:#007aff;
--green:#1c8a38;--green-bg:rgba(52,199,89,.16);--amber:#9a5a00;--amber-bg:rgba(255,159,10,.16);--red:#d70015;--red-bg:rgba(255,59,48,.12);--info:#0a5fd0;--info-bg:rgba(0,122,255,.12);--teal:#0a7f8f;--teal-bg:rgba(50,173,230,.16);
--blob1:#5ac8fa;--blob2:#0a84ff;--blob3:#5e5ce6;--blob4:#30d5c8;--blob-o:.5;--blur:18px;--sat:170%;--ease:cubic-bezier(.2,.8,.2,1);
--font:'Plus Jakarta Sans',-apple-system,BlinkMacSystemFont,'SF Pro Display',system-ui,sans-serif;--mono:'JetBrains Mono',ui-monospace,Menlo,monospace}
:root[data-theme=dark]{color-scheme:dark;--bg:#000;--ink:#fff;--muted:#9a9aa0;--g1:rgba(255,255,255,.11);--g2:rgba(255,255,255,.04);--edge:rgba(255,255,255,.14);--hair:rgba(255,255,255,.12);--ctl:rgba(118,118,128,.24);
--shadow:0 1px 0 rgba(255,255,255,.08) inset,0 16px 36px -16px rgba(0,0,0,.8);--accent:#0a84ff;--btn-a:#2e94ff;--btn-b:#0a84ff;
--green:#30d158;--green-bg:rgba(48,209,88,.16);--amber:#ffd60a;--amber-bg:rgba(255,214,10,.14);--red:#ff453a;--red-bg:rgba(255,69,58,.16);--info:#64b0ff;--info-bg:rgba(10,132,255,.2);--teal:#64d2ff;--teal-bg:rgba(100,210,255,.16);
--blob1:#64d2ff;--blob2:#0a84ff;--blob3:#5e5ce6;--blob4:#40c8e0;--blob-o:.42}
@media(prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important}}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html{background:var(--bg);-webkit-text-size-adjust:100%}
body{font-family:var(--font);color:var(--ink);min-height:100dvh;padding:calc(14px + env(safe-area-inset-top)) 16px calc(40px + env(safe-area-inset-bottom));-webkit-font-smoothing:antialiased;overflow-x:hidden}
button{font:inherit;color:inherit;border:0;background:none;cursor:pointer}a{color:inherit;text-decoration:none}
.aurora{position:fixed;inset:0;z-index:-1;overflow:hidden;background:var(--bg)}
.aurora i{position:absolute;width:62vmax;height:62vmax;border-radius:50%;filter:blur(70px);opacity:var(--blob-o);animation:drift 26s ease-in-out infinite alternate}
.aurora i:nth-child(1){background:var(--blob1);top:-22vmax;left:-18vmax}.aurora i:nth-child(2){background:var(--blob2);top:10vmax;right:-30vmax;animation-delay:-6s;animation-duration:32s}
.aurora i:nth-child(3){background:var(--blob3);bottom:-30vmax;left:-12vmax;animation-delay:-12s;opacity:calc(var(--blob-o)*.55)}.aurora i:nth-child(4){background:var(--blob4);bottom:-24vmax;right:-20vmax;animation-delay:-3s;animation-duration:38s;opacity:calc(var(--blob-o)*.7)}
@keyframes drift{to{transform:translate3d(6vmax,4vmax,0) scale(1.12)}}
.wrap{max-width:760px;margin:0 auto}
.glass{background:linear-gradient(180deg,var(--g1),var(--g2));border:.5px solid var(--edge);border-radius:24px;box-shadow:var(--shadow);backdrop-filter:blur(var(--blur)) saturate(var(--sat));-webkit-backdrop-filter:blur(var(--blur)) saturate(var(--sat))}
.top{display:flex;align-items:center;gap:10px;padding:14px 14px 14px 18px;margin-bottom:12px}
.top .grow{flex:1;min-width:0}.top h1{font-size:21px;font-weight:800;letter-spacing:-.03em}.top p{font-size:12.5px;color:var(--muted);font-weight:600;margin-top:2px}
.live{display:inline-block;width:8px;height:8px;border-radius:50%;background:#34c759;margin-right:6px;animation:pulse 2s infinite}
@keyframes pulse{50%{box-shadow:0 0 0 6px rgba(52,199,89,0)}0%{box-shadow:0 0 0 0 rgba(52,199,89,.5)}}
.ibtn{width:42px;height:42px;border-radius:50%;display:grid;place-items:center;background:var(--ctl);transition:transform .25s var(--ease)}.ibtn:active{transform:scale(.92)}.ibtn svg{width:19px;height:19px}.ibtn.spin svg{animation:spin .8s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.seg{display:flex;gap:4px;padding:4px;margin-bottom:12px;overflow-x:auto;scrollbar-width:none;border-radius:999px}.seg::-webkit-scrollbar{display:none}
.seg button{flex:1 0 auto;padding:10px 14px;border-radius:999px;font-size:13px;font-weight:700;color:var(--muted);transition:all .3s var(--ease);white-space:nowrap}
.seg button.on{color:#fff;background:linear-gradient(180deg,var(--btn-a),var(--btn-b));box-shadow:0 6px 16px -6px rgba(0,122,255,.55)}
.range{display:flex;gap:8px;margin-bottom:14px}.range button{padding:7px 13px;border-radius:999px;font-size:12px;font-weight:700;background:var(--ctl);color:var(--muted)}.range button.on{color:var(--ink);background:var(--g1);box-shadow:var(--shadow)}
.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;margin-bottom:14px}@media(min-width:560px){.grid{grid-template-columns:repeat(4,1fr)}}
.stat{padding:14px 12px;border-radius:20px;animation:rise .45s var(--ease) both}
.stat b{display:block;font-size:25px;font-weight:800;letter-spacing:-.03em;line-height:1.1;font-variant-numeric:tabular-nums}.stat span{display:block;margin-top:4px;font-size:11.5px;color:var(--muted);font-weight:700}
.stat.c-blue b{color:var(--accent)}.stat.c-green b{color:var(--green)}.stat.c-amber b{color:var(--amber)}.stat.c-teal b{color:var(--teal)}.stat.c-red b{color:var(--red)}
@keyframes rise{from{opacity:0;transform:translateY(10px) scale(.985)}}
.card{padding:16px;margin-bottom:14px;border-radius:24px}
.card h2{font-size:15px;font-weight:800;letter-spacing:-.02em;margin-bottom:12px;display:flex;align-items:center;justify-content:space-between;gap:8px}.card h2 small{font-size:12px;color:var(--muted);font-weight:700}
.bars{display:flex;align-items:flex-end;gap:8px;height:120px}.bar{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;gap:6px;height:100%}
.bar i{display:block;width:100%;min-height:4px;border-radius:8px 8px 4px 4px;background:linear-gradient(180deg,var(--btn-a),var(--btn-b));transition:height .6s var(--ease)}.bar b{font-size:11px;font-weight:800;font-variant-numeric:tabular-nums}.bar span{font-size:10.5px;color:var(--muted);font-weight:700}
.rows{display:grid;gap:10px}.row{display:grid;gap:5px}.row .rt{display:flex;justify-content:space-between;gap:10px;font-size:13px;font-weight:700}.row .rt span:first-child{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.row .rt span:last-child{color:var(--muted);font-variant-numeric:tabular-nums;white-space:nowrap}
.track{height:7px;border-radius:99px;background:var(--ctl);overflow:hidden}.track i{display:block;height:100%;border-radius:99px;background:linear-gradient(90deg,var(--btn-a),var(--btn-b));transition:width .6s var(--ease)}.track i.g{background:#34c759}
.feed{display:grid;gap:8px}.ev{display:flex;align-items:center;gap:12px;padding:11px 12px;border-radius:16px;background:var(--ctl);animation:rise .4s var(--ease) both}
.ev .ic{width:34px;height:34px;border-radius:11px;flex:0 0 34px;display:grid;place-items:center}.ev .ic svg{width:17px;height:17px}
.ev .tx{flex:1;min-width:0}.ev .tx b{display:block;font-size:13.5px;font-weight:800}.ev .tx span{display:block;font-size:12px;color:var(--muted);font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.ev time{font-size:11.5px;color:var(--muted);font-weight:700;white-space:nowrap}
.t-visit .ic{background:var(--info-bg);color:var(--info)}.t-nav .ic{background:var(--ctl);color:var(--muted)}.t-admin .ic{background:var(--green-bg);color:var(--green)}.t-out .ic{background:var(--red-bg);color:var(--red)}.t-music .ic{background:var(--teal-bg);color:var(--teal)}.t-order .ic{background:var(--amber-bg);color:var(--amber)}
.chips{display:flex;gap:8px;overflow-x:auto;scrollbar-width:none;margin:0 -16px 12px;padding:2px 16px}.chips::-webkit-scrollbar{display:none}
.chip{flex:0 0 auto;padding:8px 14px;border-radius:999px;font-size:12.5px;font-weight:700;background:var(--ctl);color:var(--muted)}.chip.on{color:#fff;background:linear-gradient(180deg,var(--btn-a),var(--btn-b))}
.pill{display:inline-flex;align-items:center;gap:6px;padding:6px 11px;border-radius:999px;font-size:11.5px;font-weight:800;line-height:1;white-space:nowrap}.pill::before{content:"";width:6px;height:6px;border-radius:50%;background:currentColor}
.pill.wait{color:var(--amber);background:var(--amber-bg)}.pill.info{color:var(--info);background:var(--info-bg)}.pill.ok{color:var(--green);background:var(--green-bg)}.pill.bad{color:var(--red);background:var(--red-bg)}
.code{font-family:var(--mono);font-size:13.5px;font-weight:700;letter-spacing:.03em}
.links{display:grid;gap:10px;grid-template-columns:minmax(0,1fr)}.link .pill{flex:0 0 auto}.link{display:flex;align-items:center;gap:12px;padding:13px 14px;border-radius:18px;background:var(--ctl);transition:transform .2s var(--ease)}.link:active{transform:scale(.98)}
.link .ic{width:38px;height:38px;border-radius:12px;display:grid;place-items:center;color:#fff;background:linear-gradient(180deg,var(--btn-a),var(--btn-b));flex:0 0 38px}.link .ic svg{width:19px;height:19px}
.link .tx{flex:1;min-width:0}.link b{display:block;font-size:14px;font-weight:800}.link span.u{display:block;font-size:11.5px;color:var(--muted);font-weight:600;font-family:var(--mono);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.svc{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:12px 14px;border-radius:16px;background:var(--ctl);margin-bottom:8px;font-size:13.5px;font-weight:700}.svc small{display:block;color:var(--muted);font-weight:600;font-size:11.5px;margin-top:2px}
.btn{min-height:36px;padding:0 14px;border-radius:999px;font-size:12.5px;font-weight:800;background:var(--g1);box-shadow:var(--shadow)}
.empty{padding:34px 16px;text-align:center;color:var(--muted);font-weight:700;font-size:14px}.err{margin-bottom:12px;padding:12px 14px;border-radius:16px;font-size:13px;font-weight:700;color:var(--red);background:var(--red-bg)}
.note{font-size:12px;color:var(--muted);font-weight:600;line-height:1.5;margin-top:10px}
</style>
</head>
<body>
<div class="aurora"><i></i><i></i><i></i><i></i></div>
<div class="wrap">
  <header class="glass top">
    <div class="grow"><h1>KENZIE Monitor</h1><p><span class="live"></span><span id="upd">Memuat...</span></p></div>
    <button class="ibtn" id="theme" aria-label="Ganti tema"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg></button>
    <button class="ibtn" id="refresh" aria-label="Muat ulang"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12a9 9 0 1 1-3-6.7L21 8"/><path d="M21 3v5h-5"/></svg></button>
  </header>
  <nav class="glass seg" id="seg"></nav>
  <div id="msg"></div>
  <div id="view"><div class="glass empty">Memuat...</div></div>
</div>
<script>
const DB='https://kenzie-preset-default-rtdb.firebaseio.com', SITE='https://kenzie-preset.vercel.app';
const TABS=[['ov','Ringkasan'],['act','Aktivitas'],['pre','Preset'],['ord','Pesanan'],['sys','Halaman']];
const RANGES=[['1','Hari ini'],['7','7 hari'],['0','Semua']];
const PAGES={home:'Beranda',search:'Cari',favorites:'Favorit',music:'Musik',admin:'Admin',premium:'Premium',contact:'Hubungi penjual',detail:'Detail preset'};
const ST={pending:['Menunggu pembayaran','wait'],review:['Menunggu verifikasi','info'],paid:['Uang sudah masuk','info'],done:['AM Prem sudah dikirim','ok'],cancel:['Ditolak','bad']};
const LINKS=[['Web utama',SITE+'/','M3 11l9-8 9 8v9a1 1 0 0 1-1 1h-5v-6H9v6H4a1 1 0 0 1-1-1z'],['Buat AM Premium',SITE+'/amprem.html','M3 8l4.5 4L12 5l4.5 7L21 8l-2 11H5z'],['Konfirmasi pesanan',SITE+'/confirm.html','M5 12.5l4.5 4.5L19 7.5'],['Monitor (halaman ini)',SITE+'/monitor.html','M3 12h4l3-8 4 16 3-8h4']];
const IC={visit:'<path d="M2 12s3.6-7 10-7 10 7 10 7-3.6 7-10 7S2 12 2 12z"/><circle cx="12" cy="12" r="3"/>',nav:'<path d="M5 12h14M13 6l6 6-6 6"/>',admin:'<path d="M12 3l8 3v6c0 5-3.5 8-8 9-4.5-1-8-4-8-9V6z"/><path d="m9 12 2 2 4-4"/>',out:'<path d="M9 21H5a1 1 0 0 1-1-1V4a1 1 0 0 1 1-1h4M16 17l5-5-5-5M21 12H9"/>',music:'<path d="M9 18V5l12-2v13"/><circle cx="6" cy="18" r="3"/><circle cx="18" cy="16" r="3"/>',order:'<path d="M3 8l4.5 4L12 5l4.5 7L21 8l-2 11H5z"/>'};
let tab='ov',range='7',actF='all',logs=[],stats={},orders={},buyers={},presets={},st={};
const $=id=>document.getElementById(id);
const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&','<':'<','>':'>','"':'"',"'":'&#39;'}[c]));
const rp=n=>'Rp '+(Number(n)||0).toLocaleString('id-ID'),num=n=>(Number(n)||0).toLocaleString('id-ID');
const when=t=>{try{return new Date(t).toLocaleString('id-ID',{day:'2-digit',month:'short',hour:'2-digit',minute:'2-digit'})}catch{return''}};
const ago=t=>{const s=Math.max(0,(Date.now()-t)/1e3);return s<60?'baru saja':s<3600?Math.floor(s/60)+' mnt':s<86400?Math.floor(s/3600)+' jam':Math.floor(s/86400)+' hari'};
async function api(p,q){const r=await fetch(DB+'/'+p+'.json'+(q?'?'+q:''));if(!r.ok)throw new Error('HTTP '+r.status);return r.json()}
async function loadAll(){
  $('refresh').classList.add('spin');$('msg').innerHTML='';const bad=[];
  const get=async(p,k,q)=>{try{return await api(p,q)}catch(e){bad.push(k);return null}};
  const [l,s,o,b,p]=await Promise.all([get('logs','logs','orderBy="$key"&limitToLast=600'),get('stats','stats'),get('orders','orders'),get('buyers','buyers'),get('presets','presets')]);
  logs=l?Object.entries(l).map(([k,v])=>Object.assign({id:k},v)).filter(x=>x&&x.time).sort((a,b)=>b.time-a.time):[];
  stats=s||{};orders=o||{};buyers=b||{};
  presets={};if(p){(Array.isArray(p)?p:Object.values(p)).forEach(x=>{if(x&&x.id)presets[x.id]=x})}
  if(bad.length)$('msg').innerHTML='<div class="err">Gagal membaca: '+bad.join(', ')+'. Cek aturan Firebase untuk path itu.</div>';
  $('refresh').classList.remove('spin');$('upd').textContent='Diperbarui '+new Date().toLocaleTimeString('id-ID',{hour:'2-digit',minute:'2-digit'});render();
}
const inRange=l=>range==='0'||l.time>=(range==='1'?new Date().setHours(0,0,0,0):Date.now()-7*864e5);
const ordList=()=>Object.entries(orders).map(([id,o])=>Object.assign({id},o,{status:o.status==='confirmed'?'done':(ST[o.status]?o.status:'pending'),t:o.t||o.time||0})).sort((a,b)=>b.t-a.t);
const evInfo=l=>{const d=esc(l.d||'');switch(l.type){
  case'visit':return['t-visit','visit','Kunjungan',l.vid+(d?' · '+d:'')];case'nav':return['t-nav','nav','Buka '+(PAGES[l.d]||d),l.vid];
  case'admin_login':return['t-admin','admin','Login admin',l.vid];case'admin_logout':return['t-out','out','Logout admin',l.vid];
  case'music_search':return['t-music','music','Cari lagu',d];case'music_play':return['t-music','music','Putar lagu',d];case'music_download':return['t-music','music','Unduh MP3',d];
  case'order_new':return['t-order','order','Pesanan baru',d];case'order_proof':return['t-order','order','Bukti bayar dikirim',d];
  default:return['t-nav','nav',esc(l.type),l.vid]}};
const FILT={all:()=>true,visit:l=>l.type==='visit',nav:l=>l.type==='nav',admin:l=>/^admin/.test(l.type),music:l=>/^music/.test(l.type),order:l=>/^order/.test(l.type)};
const FL=[['all','Semua'],['visit','Kunjungan'],['nav','Navigasi'],['admin','Admin'],['music','Musik'],['order','Pesanan']];
function stat(v,l,c,i){return'<div class="glass stat c-'+c+'" style="animation-delay:'+i*40+'ms"><b>'+v+'</b><span>'+l+'</span></div>'}
function rowsHtml(items,max,green){if(!items.length)return'<div class="empty" style="padding:18px">Belum ada data</div>';const m=Math.max(1,...items.map(x=>x[1]));return'<div class="rows">'+items.slice(0,max).map(([k,v,x])=>'<div class="row"><div class="rt"><span>'+esc(k)+'</span><span>'+(x||num(v))+'</span></div><div class="track"><i class="'+(green?'g':'')+'" style="width:'+Math.max(3,v/m*100)+'%"></i></div></div>').join('')+'</div>'}
const topBy=(arr,f)=>{const m={};arr.forEach(x=>{const k=f(x);if(k)m[k]=(m[k]||0)+1});return Object.entries(m).sort((a,b)=>b[1]-a[1])};
function feedHtml(list,n){if(!list.length)return'<div class="empty">Belum ada aktivitas</div>';return'<div class="feed">'+list.slice(0,n).map((l,i)=>{const [c,ic,t,s]=evInfo(l);return'<div class="ev '+c+'" style="animation-delay:'+Math.min(i,10)*30+'ms"><div class="ic"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">'+IC[ic]+'</svg></div><div class="tx"><b>'+t+'</b><span>'+s+'</span></div><time title="'+when(l.time)+'">'+ago(l.time)+'</time></div>'}).join('')+'</div>'}
function vOverview(){
  const L=logs.filter(inRange),v=L.filter(l=>l.type==='visit'),uniq=new Set(L.filter(l=>l.vid).map(l=>l.vid)).size;
  let views=0,uses=0;for(const id in stats){views+=Number(stats[id]&&stats[id].v)||0;uses+=Number(stats[id]&&stats[id].u)||0}
  const O=ordList(),rev=O.filter(o=>o.status==='done').reduce((a,o)=>a+(Number(o.price)||0),0),need=O.filter(o=>o.status==='review'||o.status==='paid').length;
  const days=[...Array(7)].map((_,i)=>{const d=new Date();d.setHours(0,0,0,0);d.setDate(d.getDate()-(6-i));return{t:+d,n:0,l:d.toLocaleDateString('id-ID',{weekday:'short'})}});
  logs.filter(l=>l.type==='visit').forEach(l=>{const d=days.find(x=>l.time>=x.t&&l.time<x.t+864e5);if(d)d.n++});const mx=Math.max(1,...days.map(d=>d.n));
  const nav=topBy(L.filter(l=>l.type==='nav'),l=>PAGES[l.d]||l.d);
  return'<div class="range">'+RANGES.map(([k,l])=>'<button class="'+(range===k?'on':'')+'" data-r="'+k+'">'+l+'</button>').join('')+'</div>'+
  '<div class="grid">'+stat(num(v.length),'Kunjungan','blue',0)+stat(num(uniq),'Pengunjung unik','blue',1)+stat(num(L.filter(l=>l.type==='admin_login').length),'Login admin','green',2)+stat(num(L.filter(l=>l.type==='nav').length),'Halaman dibuka','teal',3)+
  stat(num(views),'Preset dilihat','blue',4)+stat(num(uses),'Preset dipakai','green',5)+stat(num(L.filter(l=>l.type==='music_search').length),'Cari lagu','teal',6)+stat(num(L.filter(l=>l.type==='music_play').length),'Lagu diputar','teal',7)+
  stat(num(O.length),'Pesanan','amber',8)+stat(num(need),'Perlu dicek','red',9)+stat(num(O.filter(o=>o.status==='done').length),'Selesai','green',10)+stat(rp(rev),'Pendapatan','green',11)+'</div>'+
  '<div class="glass card"><h2>Kunjungan 7 hari<small>'+num(days.reduce((a,d)=>a+d.n,0))+' total</small></h2><div class="bars">'+days.map(d=>'<div class="bar"><b>'+d.n+'</b><i style="height:'+Math.max(4,d.n/mx*78)+'px"></i><span>'+d.l+'</span></div>').join('')+'</div></div>'+
  '<div class="glass card"><h2>Fitur paling dibuka</h2>'+rowsHtml(nav,7)+'</div>'+
  '<div class="glass card"><h2>Terbaru<small>'+L.length+' aktivitas</small></h2>'+feedHtml(L,6)+'</div>';
}
function vAct(){const L=logs.filter(inRange).filter(FILT[actF]);
  const tops=actF==='music'?'<div class="glass card"><h2>Pencarian terbanyak</h2>'+rowsHtml(topBy(L.filter(l=>l.type==='music_search'),l=>(l.d||'').toLowerCase()),5)+'</div><div class="glass card"><h2>Lagu paling diputar</h2>'+rowsHtml(topBy(L.filter(l=>l.type==='music_play'),l=>l.d),5,true)+'</div>':'';
  return'<div class="range">'+RANGES.map(([k,l])=>'<button class="'+(range===k?'on':'')+'" data-r="'+k+'">'+l+'</button>').join('')+'</div><div class="chips">'+FL.map(([k,l])=>'<button class="chip '+(actF===k?'on':'')+'" data-f="'+k+'">'+l+'</button>').join('')+'</div>'+tops+'<div class="glass card"><h2>Log aktivitas<small>'+L.length+'</small></h2>'+feedHtml(L,80)+'</div>'}
function vPre(){const e=Object.entries(stats).map(([id,s])=>({id,v:Number(s&&s.v)||0,u:Number(s&&s.u)||0})).sort((a,b)=>(b.u*3+b.v)-(a.u*3+a.v));
  const nm=id=>presets[id]?presets[id].name:id,tu=e.reduce((a,x)=>a+x.u,0),tv=e.reduce((a,x)=>a+x.v,0);
  return'<div class="grid">'+stat(num(e.length),'Preset tercatat','blue',0)+stat(num(tv),'Total dilihat','blue',1)+stat(num(tu),'Total dipakai','green',2)+stat(tv?Math.round(tu/tv*100)+'%':'-','Rasio pakai','teal',3)+'</div>'+
  '<div class="glass card"><h2>Paling dipakai</h2>'+rowsHtml(e.filter(x=>x.u).sort((a,b)=>b.u-a.u).map(x=>[nm(x.id),x.u]),8,true)+'</div>'+
  '<div class="glass card"><h2>Paling dilihat</h2>'+rowsHtml(e.filter(x=>x.v).sort((a,b)=>b.v-a.v).map(x=>[nm(x.id),x.v]),8)+'</div>'+
  '<div class="glass card"><h2>Semua preset<small>'+e.length+'</small></h2>'+(e.length?'<div class="rows">'+e.map(x=>'<div class="svc"><div>'+esc(nm(x.id))+'<small>'+esc(x.id)+'</small></div><span style="color:var(--muted);font-size:12px;font-weight:700;white-space:nowrap">'+x.u+' dipakai · '+x.v+' dilihat</span></div>').join('')+'</div>':'<div class="empty">Belum ada statistik</div>')+'</div>'}
function vOrd(){const O=ordList(),c=k=>O.filter(o=>o.status===k).length,rev=O.filter(o=>o.status==='done').reduce((a,o)=>a+(Number(o.price)||0),0);
  return'<div class="grid">'+stat(num(O.length),'Total pesanan','amber',0)+stat(num(c('review')+c('paid')),'Perlu dicek','red',1)+stat(num(c('done')),'Selesai','green',2)+stat(rp(rev),'Pendapatan','green',3)+'</div>'+
  '<a class="link glass" style="margin-bottom:14px" href="'+SITE+'/confirm.html"><div class="ic"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg></div><div class="tx"><b>Buka halaman konfirmasi</b><span class="u">cek bukti & konfirmasi pesanan</span></div></a>'+
  '<div class="glass card"><h2>Pesanan terbaru<small>'+O.length+'</small></h2>'+(O.length?'<div class="feed">'+O.slice(0,30).map(o=>{const b=buyers[o.id]||{},s=ST[o.status];return'<div class="ev t-order"><div class="tx"><b class="code">'+esc(o.id)+'</b><span>'+esc(b.name||'-')+' · '+esc(o.pkg||'Premium')+' · '+rp(o.price)+'</span>'+(b.email?'<span>Email AM: '+esc(b.email)+'</span>':'')+'<span>'+when(o.t)+'</span></div><span class="pill '+s[1]+'">'+s[0]+'</span></div>'}).join('')+'</div>':'<div class="empty">Belum ada pesanan</div>')+'</div>'}
function vSys(){
  return'<div class="glass card"><h2>Halaman web</h2><div class="links">'+LINKS.map(([n,u,ic],i)=>{const r=st['p'+i];return'<a class="link" href="'+u+'" target="_blank" rel="noopener"><div class="ic"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="'+ic+'"/></svg></div><div class="tx"><b>'+n+'</b><span class="u">'+u.replace('https://','')+'</span></div>'+(r?'<span class="pill '+(r.ok?'ok':'bad')+'">'+(r.ok?r.ms+' ms':'Gagal')+'</span>':'<span class="pill wait">...</span>')+'</a>'}).join('')+'</div></div>'+
  '<div class="glass card"><h2>Layanan<button class="btn" id="recheck">Cek ulang</button></h2>'+
  svc('Database (Firebase)','kenzie-preset-default-rtdb',st.db)+svc('API pencarian lagu (YouTube)','api.theresav.eu (via /api/yt-search)',st.mus,'<button class="btn" id="testMus">Tes</button>')+
  '<p class="note">Log aktivitas tersimpan di path <b>logs</b>, statistik preset di <b>stats</b>, pesanan di <b>orders</b>, <b>buyers</b>, dan <b>proofs</b>. Pastikan aturan Firebase mengizinkan baca/tulis untuk path tersebut.</p></div>'}
function svc(n,u,r,extra){return'<div class="svc"><div>'+n+'<small>'+u+'</small></div><div style="display:flex;gap:8px;align-items:center">'+(extra||'')+(r?'<span class="pill '+(r.ok?'ok':'bad')+'">'+(r.ok?r.ms+' ms':'Gagal')+'</span>':'<span class="pill wait">...</span>')+'</div></div>'}
async function ping(key,url,opt){const t=performance.now();try{await fetch(url,Object.assign({mode:'no-cors',cache:'no-store'},opt||{}));st[key]={ok:true,ms:Math.round(performance.now()-t)}}catch{st[key]={ok:false}}if(tab==='sys')render()}
function checkAll(){LINKS.forEach((l,i)=>ping('p'+i,l[1]));ping('db',DB+'/logs.json?orderBy="$key"&limitToFirst=1',{mode:'cors'})}
function testMusic(){st.mus=null;render();const t=performance.now();fetch('/api/yt-search?query=a').then(r=>{st.mus={ok:r.ok,ms:Math.round(performance.now()-t)};render()}).catch(()=>{st.mus={ok:false};render()})}
function render(){
  $('seg').innerHTML=TABS.map(([k,l])=>'<button class="'+(tab===k?'on':'')+'" data-t="'+k+'">'+l+'</button>').join('');
  $('view').innerHTML={ov:vOverview,act:vAct,pre:vPre,ord:vOrd,sys:vSys}[tab]();
}
document.addEventListener('click',e=>{const t=e.target.closest('[data-t],[data-r],[data-f],#recheck,#testMus');if(!t)return;
  if(t.dataset.t){tab=t.dataset.t;render();if(tab==='sys'&&!st.p0)checkAll()}else if(t.dataset.r){range=t.dataset.r;render()}else if(t.dataset.f){actF=t.dataset.f;render()}
  else if(t.id==='recheck'){st={};render();checkAll()}else if(t.id==='testMus')testMusic()});
$('refresh').onclick=()=>{loadAll();if(tab==='sys')checkAll()};
(function(){let th=null;try{th=localStorage.getItem('kenzie_theme')}catch{}if(!th)th=matchMedia('(prefers-color-scheme: dark)').matches?'dark':'light';
  const ap=v=>{if(v==='dark')document.documentElement.dataset.theme='dark';else document.documentElement.removeAttribute('data-theme')};ap(th);
  $('theme').onclick=()=>{th=th==='dark'?'light':'dark';ap(th);try{localStorage.setItem('kenzie_theme',th)}catch{}}})();
loadAll();setInterval(()=>{if(!document.hidden)loadAll()},60000);
</script>
</body>
</html>
