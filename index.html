<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
  <title>KENZIE PRESET LIBRARY</title>
  <meta name="theme-color" content="#f2f2f7" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=JetBrains+Mono:wght@600;700&family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  <style>
    /* =====================================================
       KENZIE PRESET — Liquid Glass redesign
       (fungsi / JavaScript tidak diubah)
       ===================================================== */
    :root {
      color-scheme: light;
      --bg: #f2f2f7; --bg-2: #ffffff;
      --ink: #000000; --muted: #636366;
      --g1: rgba(255,255,255,.78); --g2: rgba(255,255,255,.52);
      --edge: rgba(255,255,255,.9);
      --hair: rgba(60,60,67,.14);
      --ctl: rgba(118,118,128,.12); --ctl-edge: rgba(60,60,67,.08);
      --shadow: 0 0 0 .5px rgba(0,0,0,.05), 0 8px 24px -10px rgba(0,0,0,.18);
      --accent: #007aff; --accent-2: #007aff; --blue: var(--accent);
      --btn-a: #1a8aff; --btn-b: #007aff;
      --btn-glow: rgba(0,122,255,.38);
      --green: #1c8a38; --green-bg: rgba(52,199,89,.16);
      --red: #d70015; --red-bg: rgba(255,59,48,.12);
      --amber: #9a5a00; --amber-bg: rgba(255,159,10,.16);
      --idc: #0a5fd0; --idbg: rgba(0,122,255,.12);
      --sheet: #ffffff;
      --scrim: rgba(0,0,0,.35);
      --blob1: #5ac8fa; --blob2: #0a84ff; --blob3: #5e5ce6; --blob4: #30d5c8; --blob-o: .5;
      --c-a: #32ade6; --c-b: #0a84ff;
      --blur: 16px; --sat: 170%; --glow: 0 0 0 0 transparent;
      --ease: cubic-bezier(.2,.8,.2,1);
      --gx: 14px;
      --nav-h: 64px;
      --font: 'Plus Jakarta Sans', 'Inter', -apple-system, BlinkMacSystemFont, 'SF Pro Display', system-ui, sans-serif;
      --mono: 'JetBrains Mono', ui-monospace, SFMono-Regular, Menlo, monospace;
    }
    [data-theme="dark"] {
      color-scheme: dark;
      --bg: #000000; --bg-2: #0c0c0e;
      --ink: #ffffff; --muted: #9a9aa0;
      --g1: rgba(255,255,255,.11); --g2: rgba(255,255,255,.04);
      --edge: rgba(255,255,255,.14);
      --hair: rgba(255,255,255,.12);
      --ctl: rgba(118,118,128,.24); --ctl-edge: rgba(255,255,255,.08);
      --shadow: 0 1px 0 rgba(255,255,255,.08) inset, 0 16px 36px -16px rgba(0,0,0,.8);
      --accent: #0a84ff; --accent-2: #0a84ff;
      --btn-a: #2e94ff; --btn-b: #0a84ff;
      --btn-glow: rgba(10,132,255,.4);
      --green: #30d158; --green-bg: rgba(48,209,88,.16);
      --red: #ff453a; --red-bg: rgba(255,69,58,.16);
      --amber: #ffd60a; --amber-bg: rgba(255,214,10,.14);
      --idc: #64b0ff; --idbg: rgba(10,132,255,.2);
      --sheet: #1c1c1e;
      --scrim: rgba(0,0,0,.6);
      --blob1: #64d2ff; --blob2: #0a84ff; --blob3: #5e5ce6; --blob4: #40c8e0; --blob-o: .42;
      --c-a: #64d2ff; --c-b: #0a84ff;
    }
    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after { animation: none !important; transition: none !important; }
    }

    * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
    html { background: var(--bg); scroll-behavior: smooth; -webkit-text-size-adjust: 100%; }
    body {
      min-height: 100vh; min-height: 100dvh;
      background: var(--bg); color: var(--ink);
      font-family: var(--font); font-size: 15px; line-height: 1.5;
      overflow-x: hidden; touch-action: manipulation;
      -webkit-font-smoothing: antialiased;
      transition: background-color .35s, color .35s;
    }
    ::selection { background: rgba(0,122,255,.28); }
    button, input, textarea, select { font: inherit; color: inherit; }
    button { cursor: pointer; }
    a { color: inherit; text-decoration: none; }
    code { font-family: var(--mono); }

    /* ---------- Aurora background ---------- */
    .aurora {
      position: fixed; inset: 0; z-index: 0; overflow: hidden; pointer-events: none;
      background: radial-gradient(120% 80% at 50% -10%, var(--bg-2), var(--bg) 70%);
      transition: background .35s;
    }
    .aurora i {
      position: absolute; width: 70vmax; height: 70vmax; border-radius: 50%;
      opacity: var(--blob-o); will-change: transform;
    }
    .aurora i:nth-child(1) { background: radial-gradient(circle, var(--blob1) 0%, transparent 62%); left: -25vmax; top: -25vmax; animation: drift1 28s ease-in-out infinite alternate; }
    .aurora i:nth-child(2) { background: radial-gradient(circle, var(--blob2) 0%, transparent 62%); right: -30vmax; top: 10vmax; animation: drift2 34s ease-in-out infinite alternate; }
    .aurora i:nth-child(3) { background: radial-gradient(circle, var(--blob3) 0%, transparent 62%); left: -10vmax; bottom: -35vmax; animation: drift3 31s ease-in-out infinite alternate; }
    .aurora i:nth-child(4) { background: radial-gradient(circle, var(--blob4) 0%, transparent 62%); right: -24vmax; bottom: -32vmax; animation: drift2 37s ease-in-out infinite alternate-reverse; }
    @keyframes drift1 { to { transform: translate3d(22vmax, 16vmax, 0) scale(1.15); } }
    @keyframes drift2 { to { transform: translate3d(-20vmax, 18vmax, 0) scale(.9); } }
    @keyframes drift3 { to { transform: translate3d(26vmax, -14vmax, 0) scale(1.12); } }

    /* ---------- Layout ---------- */
    .app {
      position: relative; z-index: 1;
      width: min(100%, 1080px); margin: 0 auto;
      padding: calc(10px + env(safe-area-inset-top, 0px)) var(--gx) calc(var(--nav-h) + env(safe-area-inset-bottom, 0px) + 44px);
      min-height: 100vh; min-height: 100dvh;
    }
    .page { display: none; }
    .page.active { display: block; animation: pageIn .45s var(--ease); }
    @keyframes pageIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: none; } }

    /* ---------- Liquid glass surface ---------- */
    .topbar, .card, .stats, .back, .chip, .link-box, .admin-card, .login-box, .bottom-nav, .toast, .warn {
      background: linear-gradient(155deg, var(--g1), var(--g2));
      border: 1px solid var(--edge);
      box-shadow: var(--shadow), var(--glow);
      -webkit-backdrop-filter: blur(var(--blur)) saturate(var(--sat));
      backdrop-filter: blur(var(--blur)) saturate(var(--sat));
      transition: background-color .35s, border-color .35s, box-shadow .35s, transform .4s var(--ease);
    }
    @supports not ((backdrop-filter: blur(1px)) or (-webkit-backdrop-filter: blur(1px))) {
      .topbar, .card, .stats, .back, .chip, .link-box, .admin-card, .login-box, .bottom-nav, .toast { background: var(--sheet); }
    }

    /* ---------- Topbar ---------- */
    .topbar {
      position: sticky; top: calc(8px + env(safe-area-inset-top, 0px)); z-index: 30;
      display: flex; flex-wrap: wrap; align-items: center; gap: 10px;
      padding: 10px; border-radius: 28px; max-width: 100%;
    }
    .brand { order: 1; flex: 1 1 0; min-width: 0; display: flex; align-items: center; gap: 11px; cursor: pointer; }
    .brandmark {
      width: 44px; height: 44px; flex: 0 0 44px; border-radius: 50%; overflow: hidden;
      display: grid; place-items: center;
      background: linear-gradient(145deg, var(--btn-a), var(--btn-b)); color: #fff;
      font-weight: 800; font-size: 15px; letter-spacing: .02em;
      box-shadow: inset 0 1px 0 rgba(255,255,255,.4), 0 6px 16px -6px var(--btn-glow);
    }
    .brandmark img { width: 100%; height: 100%; object-fit: cover; display: block; }
    .brandtext { display: flex; flex-direction: column; justify-content: center; gap: 3px; font-weight: 800; font-size: 15px; line-height: 1; letter-spacing: -.01em; }
    .brandtext span { display: block; margin: 0; font-size: 9.5px; font-weight: 700; letter-spacing: .28em; color: var(--muted); }

    .icon-btn {
      order: 2; flex: 0 0 44px; width: 44px; height: 44px; border-radius: 50%;
      display: grid; place-items: center; font-size: 18px; line-height: 1;
      color: var(--ink); background: var(--ctl); border: 1px solid var(--ctl-edge);
      transition: transform .3s var(--ease), background-color .3s;
    }
    .icon-btn svg { width: 20px; height: 20px; display: block; }
    .icon-btn:active { transform: scale(.92); }

    .search-wrap { order: 3; flex: 1 1 100%; position: relative; max-width: none; }
    .search-input {
      width: 100%; height: 46px; padding: 0 42px 0 44px; outline: none;
      border-radius: 999px; font-size: 14.5px;
      background: var(--ctl); border: 1px solid var(--ctl-edge); color: var(--ink);
      transition: border-color .3s, box-shadow .3s, background-color .3s;
    }
    .search-input::placeholder { color: var(--muted); opacity: 1; }
    .search-input:focus { border-color: var(--accent); box-shadow: 0 0 0 4px color-mix(in srgb, var(--accent) 22%, transparent); }
    .search-icon { position: absolute; left: 16px; top: 50%; transform: translateY(-50%); color: var(--muted); pointer-events: none; }
    .clear-btn {
      position: absolute; right: 8px; top: 50%; transform: translateY(-50%);
      width: 30px; height: 30px; border: none; border-radius: 50%;
      background: var(--ctl); color: var(--muted); font-size: 12px;
      display: none; place-items: center;
    }
    .clear-btn.show { display: grid; }

    @media (min-width: 720px) {
      .topbar { flex-wrap: nowrap; border-radius: 999px; padding: 8px 10px 8px 8px; }
      .brand { flex: 0 0 auto; }
      .search-wrap { order: 2; flex: 1 1 auto; max-width: 440px; margin: 0 auto; }
      .icon-btn { order: 3; }
    }

    /* ---------- Stats + categories ---------- */
    .stats {
      display: inline-flex; align-items: center; gap: 8px;
      margin: 18px 0 14px; padding: 8px 15px 8px 13px; border-radius: 999px;
      font-size: 12.5px; font-weight: 600; color: var(--muted);
    }
    .stats::before {
      content: ""; width: 8px; height: 8px; border-radius: 50%; background: var(--green);
      box-shadow: 0 0 0 0 var(--green); animation: ping 2.4s ease-out infinite;
    }
    @keyframes ping { 0% { box-shadow: 0 0 0 0 color-mix(in srgb, var(--green) 60%, transparent); } 80%, 100% { box-shadow: 0 0 0 8px transparent; } }
    .stats b { color: var(--ink); font-weight: 800; }

    .cats {
      display: flex; flex-wrap: nowrap; gap: 8px; margin: 0 calc(var(--gx) * -1) 22px; padding: 4px var(--gx);
      overflow-x: auto; scrollbar-width: none; -webkit-overflow-scrolling: touch;
    }
    .cats::-webkit-scrollbar { display: none; }
    .cat {
      flex: 0 0 auto; display: inline-flex; align-items: center; justify-content: center;
      min-height: 40px; padding: 0 17px; border-radius: 999px; white-space: nowrap;
      font-size: 13px; font-weight: 700; line-height: 1; color: var(--muted);
      background: var(--ctl); border: 1px solid var(--ctl-edge);
      transition: transform .3s var(--ease), background .3s, color .3s, box-shadow .3s;
    }
    .cat:active { transform: scale(.95); }
    .cat.active {
      color: #fff; border-color: transparent;
      background: linear-gradient(135deg, var(--btn-a), var(--btn-b)) border-box;
      box-shadow: inset 0 1px 0 rgba(255,255,255,.38), 0 8px 20px -8px var(--btn-glow);
    }

    /* ---------- Sections / grid ---------- */
    .section { margin-bottom: 32px; }
    .section-title {
      display: flex; align-items: center; gap: 10px;
      font-size: 22px; font-weight: 800; letter-spacing: -.02em; line-height: 1.2; margin-bottom: 14px;
    }
    .section-title::before { content: ""; width: 5px; height: 22px; border-radius: 4px; background: linear-gradient(var(--btn-a), var(--btn-b)); flex: 0 0 5px; }
    .grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px; }
    @media (min-width: 640px) { .grid { grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 16px; } }
    @media (min-width: 900px) { .grid { grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 18px; } }

    /* ---------- Card ---------- */
    .card {
      position: relative; display: flex; flex-direction: column; overflow: hidden;
      border-radius: 24px; min-width: 0;
    }
    .card::after {
      content: ""; position: absolute; inset: 0; pointer-events: none; z-index: 3;
      background: linear-gradient(115deg, transparent 38%, rgba(255,255,255,.30) 50%, transparent 62%);
      transform: translateX(-130%); transition: transform .9s var(--ease);
    }
    @media (hover: hover) {
      .card:hover { transform: translateY(-3px); }
      .card:hover::after { transform: translateX(130%); }
    }
    .card-thumb {
      position: relative; aspect-ratio: 16/10; margin: 6px 6px 0; border-radius: 19px; overflow: hidden; cursor: pointer;
      background: linear-gradient(135deg, color-mix(in srgb, var(--accent) 22%, transparent), color-mix(in srgb, var(--accent-2) 22%, transparent));
    }
    .card-thumb::after { content: ""; position: absolute; inset: 0; pointer-events: none; background: linear-gradient(to top, rgba(0,0,0,.28), transparent 45%); }
    .card-thumb { color: #fff; }
    .card-thumb img { width: 100%; height: 100%; object-fit: cover; display: block; }
    .card-badge {
      position: absolute; top: 8px; left: 8px; z-index: 2;
      padding: 4px 9px; border-radius: 999px; font-size: 10.5px; font-weight: 800; letter-spacing: .02em; line-height: 1.2; color: #fff;
      background: rgba(10,12,24,.45); border: 1px solid rgba(255,255,255,.22);
      -webkit-backdrop-filter: blur(10px); backdrop-filter: blur(10px);
    }
    .card-fav {
      position: absolute; top: 6px; right: 6px; z-index: 2;
      width: 34px; height: 34px; border-radius: 50%; font-size: 15px; line-height: 1;
      display: grid; place-items: center; color: #fff;
      background: rgba(10,12,24,.45); border: 1px solid rgba(255,255,255,.22);
      -webkit-backdrop-filter: blur(10px); backdrop-filter: blur(10px);
      transition: transform .3s var(--ease);
    }
    .card-fav:active { transform: scale(.85); }
    .card-body { flex: 1; display: flex; flex-direction: column; align-items: flex-start; padding: 12px 12px 12px; }
    .card-id, .detail-id, .admin-card-id {
      display: inline-flex; align-items: center; font-family: var(--mono); font-weight: 700; letter-spacing: .02em;
      color: var(--idc); background: var(--idbg); line-height: 1;
    }
    .card-id { font-size: 10.5px; padding: 5px 8px; border-radius: 8px; }
    .card-title {
      width: 100%; margin: 8px 0 3px; font-size: 14.5px; font-weight: 800; line-height: 1.25; letter-spacing: -.01em; cursor: pointer;
      overflow-wrap: anywhere; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden;
    }
    .card-meta { width: 100%; margin-bottom: 8px; font-size: 12px; font-weight: 500; color: var(--muted); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .card-stats { width: 100%; display: flex; align-items: center; gap: 14px; margin-bottom: 12px; font-size: 11.5px; font-weight: 700; line-height: 1; color: var(--muted); font-variant-numeric: tabular-nums; }
    .card-stats .stat { display: inline-flex; align-items: center; gap: 5px; }
    .card-stats svg { flex: 0 0 14px; display: block; opacity: .85; }
    .chip [data-stat-id] { font-variant-numeric: tabular-nums; }
    .card-actions { width: 100%; display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-top: auto; }

    /* ---------- Buttons ---------- */
    .btn, .btn-sm, .btn-xs {
      position: relative; overflow: hidden; isolation: isolate;
      display: inline-flex; align-items: center; justify-content: center; gap: 6px;
      text-align: center; white-space: nowrap; line-height: 1; font-weight: 700;
      color: var(--ink); background: var(--ctl); border: 1px solid var(--ctl-edge);
      transition: transform .3s var(--ease), box-shadow .3s, background-color .3s, filter .3s;
    }
    .btn { min-height: 46px; padding: 0 20px; border-radius: 999px; font-size: 14px; }
    .btn-sm { min-height: 40px; padding: 0 10px; border-radius: 999px; font-size: 12.5px; width: 100%; }
    .btn-xs { min-height: 42px; padding: 0 10px; border-radius: 999px; font-size: 12.5px; width: 100%; }
    .btn:active, .btn-sm:active, .btn-xs:active { transform: scale(.96); }
    @media (hover: hover) { .btn:hover, .btn-sm:hover, .btn-xs:hover { transform: translateY(-1px) scale(1.02); } }

    .btn-primary, .btn-sm.primary, .btn-xs.fill {
      color: #fff; border-color: transparent; background-origin: border-box;
      background: linear-gradient(135deg, var(--btn-a), var(--btn-b)) border-box;
      box-shadow: inset 0 1px 0 rgba(255,255,255,.4), 0 8px 20px -9px var(--btn-glow);
    }
    .btn-primary::after, .btn-sm.primary::after, .btn-xs.fill::after {
      content: ""; position: absolute; inset: 0; z-index: -1; pointer-events: none;
      background: linear-gradient(110deg, transparent 35%, rgba(255,255,255,.38) 50%, transparent 65%);
      transform: translateX(-130%); transition: transform .8s var(--ease);
    }
    @media (hover: hover) { .btn-primary:hover::after, .btn-sm.primary:hover::after, .btn-xs.fill:hover::after { transform: translateX(130%); } }
    .btn-xs.danger { color: var(--red); background: var(--red-bg); border-color: transparent; }
    button:disabled, .btn:disabled, .btn-sm:disabled { opacity: .5; cursor: not-allowed; transform: none !important; }

    /* ---------- Detail ---------- */
    .back {
      display: inline-flex; align-items: center; gap: 6px; min-height: 42px; padding: 0 18px; margin: 18px 0 16px;
      border-radius: 999px; font-size: 13.5px; font-weight: 700; color: var(--ink); line-height: 1;
    }
    .detail-layout { display: grid; gap: 20px; align-items: start; }
    @media (min-width: 700px) { .detail-layout { grid-template-columns: 1fr 1fr; gap: 28px; } }
    .detail-thumb {
      position: relative; aspect-ratio: 16/10; border-radius: 28px; overflow: hidden; border: 1px solid var(--edge);
      background: linear-gradient(135deg, color-mix(in srgb, var(--accent) 22%, transparent), color-mix(in srgb, var(--accent-2) 22%, transparent));
      box-shadow: var(--shadow);
    }
    .detail-thumb img { width: 100%; height: 100%; object-fit: cover; display: block; }
    .detail-info { min-width: 0; }
    .detail-id { font-size: 12.5px; padding: 7px 12px; border-radius: 10px; cursor: pointer; margin-bottom: 10px; }
    .detail-info h1 { font-size: clamp(24px, 6vw, 32px); font-weight: 800; letter-spacing: -.03em; line-height: 1.15; margin-bottom: 12px; overflow-wrap: anywhere; }
    .detail-meta { display: flex; flex-wrap: wrap; gap: 8px; margin: 0 0 14px; }
    .chip { display: inline-flex; align-items: center; gap: 6px; padding: 7px 12px; border-radius: 999px; font-size: 12px; font-weight: 600; line-height: 1; color: var(--muted); }
    .chip b { color: var(--ink); font-weight: 800; }
    .detail-desc { color: var(--muted); font-size: 14px; line-height: 1.6; margin: 0 0 14px; overflow-wrap: anywhere; }
    .warn {
      padding: 12px 14px; margin-bottom: 12px; border-radius: 16px; font-size: 13.5px; font-weight: 600; line-height: 1.4;
      color: var(--amber); background: var(--amber-bg); border-color: transparent; box-shadow: none;
    }
    .link-box {
      display: flex; flex-direction: column; gap: 10px; padding: 12px; margin-bottom: 10px; border-radius: 20px;
    }
    .link-box code { display: block; width: 100%; min-width: 0; padding: 2px 4px 0; font-size: 12px; line-height: 1.5; color: var(--muted); overflow-wrap: anywhere; word-break: break-all; white-space: normal; }
    .link-actions { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
    .link-actions:has(.btn-sm:only-child) { grid-template-columns: 1fr; }
    .link-actions .btn-sm { min-height: 44px; font-size: 13px; }
    .detail-actions { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-top: 16px; }
    .detail-actions .btn { width: 100%; padding: 0 12px; }
    .detail-actions .btn-primary { grid-column: 1 / -1; min-height: 52px; font-size: 15px; }
    @media (min-width: 340px) { .detail-actions { grid-template-columns: 1fr 1fr auto; } .detail-actions .btn:last-child { width: 52px; padding: 0; } }

    .empty { text-align: center; padding: 40px 16px; color: var(--muted); font-size: 14px; }
    .empty h3 { font-size: 16px; font-weight: 800; color: var(--ink); margin-bottom: 6px; }

    /* ---------- Admin ---------- */
    .login-box { max-width: 380px; margin: 36px auto; padding: 30px 22px; text-align: center; border-radius: 30px; }
    .login-box h2 { font-size: 24px; font-weight: 800; letter-spacing: -.02em; margin-bottom: 6px; }
    .login-box p { color: var(--muted); font-size: 13px; margin-bottom: 20px; }
    .login-box code { padding: 2px 7px; border-radius: 6px; background: var(--idbg); color: var(--idc); font-size: 12px; }
    .login-box .btn { width: 100%; }
    .form-group { margin-bottom: 14px; text-align: left; }
    .form-group label { display: block; margin-bottom: 6px; padding-left: 4px; font-size: 12px; font-weight: 700; letter-spacing: .02em; color: var(--muted); }
    .form-input, .form-select {
      width: 100%; min-height: 48px; padding: 12px 16px; outline: none; border-radius: 16px; font-size: 15px;
      background: var(--ctl); border: 1px solid var(--ctl-edge); color: var(--ink);
      transition: border-color .3s, box-shadow .3s, background-color .3s;
    }
    textarea.form-input { min-height: 96px; resize: vertical; line-height: 1.5; }
    .form-input::placeholder { color: var(--muted); opacity: .8; }
    .form-input:focus, .form-select:focus { border-color: var(--accent); box-shadow: 0 0 0 4px color-mix(in srgb, var(--accent) 22%, transparent); }
    .check-row { display: flex; align-items: center; gap: 12px; padding: 12px 14px; margin-bottom: 8px; border-radius: 16px; background: var(--ctl); border: 1px solid var(--ctl-edge); }
    .check-row input { width: 20px; height: 20px; accent-color: var(--accent); flex: 0 0 20px; }
    .check-row label { flex: 1; font-size: 14px; font-weight: 700; color: var(--ink); }

    .admin-header { margin: 18px 0 12px; }
    .admin-header h2 { font-size: 26px; font-weight: 800; letter-spacing: -.03em; line-height: 1.2; margin-bottom: 14px; }

    @media (min-width: 800px) { .admin-list { display: grid; grid-template-columns: 1fr 1fr; } }
    .admin-card { padding: 16px; border-radius: 24px; }
    .admin-card-top { display: flex; align-items: center; justify-content: space-between; gap: 8px; margin-bottom: 10px; }
    .admin-card-id { font-size: 12px; padding: 7px 11px; border-radius: 999px; }

    .admin-card-meta { margin: 4px 0 14px; font-size: 12.5px; line-height: 1.5; color: var(--muted); overflow-wrap: anywhere; }
    .admin-card-actions { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
    .status { display: inline-flex; align-items: center; gap: 6px; padding: 6px 11px; border-radius: 999px; font-size: 11.5px; font-weight: 800; line-height: 1; }
    .status::before { content: ""; width: 6px; height: 6px; border-radius: 50%; background: currentColor; }
    .status.ok { color: var(--green); background: var(--green-bg); }
    .status.wait { color: var(--amber); background: var(--amber-bg); }

    /* ---------- Modal (bottom sheet) ---------- */
    .overlay {
      position: fixed; inset: 0; z-index: 100; display: none; align-items: flex-end; justify-content: center; padding: 0;
      background: var(--scrim); -webkit-backdrop-filter: blur(10px); backdrop-filter: blur(10px); overscroll-behavior: contain;
    }
    .overlay.show { display: flex; animation: fadeIn .3s ease; }
    @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
    body.modal-open { overflow: hidden; position: fixed; width: 100%; }
    .modal {
      width: 100%; max-width: 520px; max-height: 92vh; max-height: 92dvh; overflow-y: auto; overscroll-behavior: contain; -webkit-overflow-scrolling: touch;
      padding: 8px 18px calc(22px + env(safe-area-inset-bottom, 0px));
      background: var(--sheet); border: 1px solid var(--edge); border-bottom: none; border-radius: 30px 30px 0 0;
      box-shadow: 0 -20px 60px -20px rgba(0,0,0,.45);
    }
    .overlay.show .modal { animation: sheetUp .45s var(--ease); }
    @keyframes sheetUp { from { transform: translateY(40px); opacity: 0; } to { transform: none; opacity: 1; } }
    .modal::before { content: ""; display: block; width: 40px; height: 5px; margin: 4px auto 6px; border-radius: 3px; background: var(--hair); }
    .modal h3 { position: sticky; top: 0; z-index: 2; margin: 0 -18px 14px; padding: 10px 18px 12px; font-size: 19px; font-weight: 800; letter-spacing: -.02em; background: var(--sheet); }
    .modal-actions { display: flex; gap: 10px; margin-top: 18px; }
    .modal-actions .btn { flex: 1; }
    #thumbPreview { background: var(--ctl) !important; border: 1px dashed var(--ctl-edge); border-radius: 16px !important; }
    #presetModal .btn-outline { min-height: 44px; }
    @media (min-width: 700px) {
      .overlay { align-items: center; padding: 24px; }
      .modal { border-radius: 30px; border-bottom: 1px solid var(--edge); }
      .modal::before { display: none; }
    }

    /* ---------- Toast ---------- */
    .toasts {
      position: fixed; left: 50%; transform: translateX(-50%); z-index: 200;
      bottom: calc(var(--nav-h) + env(safe-area-inset-bottom, 0px) + 28px);
      width: min(92vw, 420px); display: flex; flex-direction: column; align-items: center; gap: 8px; pointer-events: none;
    }
    .toast {
      padding: 11px 18px; border-radius: 999px; font-size: 13.5px; font-weight: 700; line-height: 1.3; text-align: center; color: var(--ink);
      background: var(--sheet); animation: toastIn .4s var(--ease);
    }
    .toast.ok { color: var(--green); }
    .toast.err { color: var(--red); }
    @keyframes toastIn { from { opacity: 0; transform: translateY(14px) scale(.96); } to { opacity: 1; transform: none; } }

    /* ---------- Bottom nav (floating pill) ---------- */
    .bottom-nav {
      position: fixed; z-index: 40; left: 12px; right: 12px; margin: 0 auto; max-width: 460px;
      bottom: calc(10px + env(safe-area-inset-bottom, 0px)); height: var(--nav-h);
      display: grid; grid-template-columns: repeat(4, 1fr); align-items: stretch; gap: 2px; padding: 6px; border-radius: 30px;
    }
    @media (min-width: 700px) { .bottom-nav { display: none; } .app { padding-bottom: 48px; } .toasts { bottom: 28px; } }
    .nav-item {
      position: relative; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px;
      background: none; border: none; border-radius: 24px; color: var(--muted); font-size: 10.5px; font-weight: 700; line-height: 1; letter-spacing: .01em;
      transition: color .3s, transform .3s var(--ease);
    }
    .nav-item::before {
      content: ""; position: absolute; inset: 0; border-radius: 24px; opacity: 0; transform: scale(.85); z-index: -1;
      background: linear-gradient(155deg, color-mix(in srgb, var(--accent) 22%, transparent), color-mix(in srgb, var(--accent-2) 16%, transparent));
      box-shadow: inset 0 1px 0 rgba(255,255,255,.35);
      transition: opacity .35s var(--ease), transform .35s var(--ease);
    }
    .nav-item:active { transform: scale(.92); }
    .nav-item.active { color: var(--accent); }
    .nav-item.active::before { opacity: 1; transform: none; }
    .nav-item svg { width: 22px; height: 22px; display: block; }

    /* ---------- Efek (Low / Medium / Hard) ---------- */
    /* LOW & MEDIUM: hanya warna yang makin menyala, gerakan tetap sama */
    body.fx-low { --blur: 14px; --sat: 170%; --blob-o: .5; }
    [data-theme="dark"] body.fx-low { --blob-o: .4; }
    body.fx-med { --blur: 22px; --sat: 210%; --blob-o: .92; }
    [data-theme="dark"] body.fx-med { --blob-o: .75; }
    body.fx-med :is(.card, .topbar, .link-box, .admin-card, .bottom-nav, .stats, .login-box) {
      --glow: -10px 14px 34px -16px color-mix(in srgb, var(--c-a) 75%, transparent), 12px -6px 34px -18px color-mix(in srgb, var(--c-b) 75%, transparent);
    }
    body.fx-med .aurora { filter: saturate(1.25); }

    /* HARD: liquid glass paling pekat — blur tebal, warna penuh, cahaya putih berjalan di tepi kaca */
    @property --ang { syntax: '<angle>'; inherits: false; initial-value: 0deg; }
    body.fx-hard { --blur: 40px; --sat: 260%; --blob-o: 1; }
    [data-theme="dark"] body.fx-hard { --blob-o: .95; }
    body.fx-hard .aurora { filter: saturate(1.45); }
    body.fx-hard .aurora i:nth-child(1) { animation-duration: 9s; }
    body.fx-hard .aurora i:nth-child(2) { animation-duration: 12s; }
    body.fx-hard .aurora i:nth-child(3) { animation-duration: 10s; }
    body.fx-hard .aurora i:nth-child(4) { animation-duration: 13s; }
    body.fx-hard :is(.card, .topbar, .link-box, .admin-card, .bottom-nav, .stats, .login-box) {
      --glow: inset 0 1.5px 0 rgba(255,255,255,.7), inset 0 -1px 0 rgba(255,255,255,.2), -12px 16px 40px -14px color-mix(in srgb, var(--c-a) 85%, transparent), 14px -8px 40px -16px color-mix(in srgb, var(--c-b) 85%, transparent);
    }
    /* cahaya putih yang berjalan mengelilingi tepi kaca */
    body.fx-hard .admin-card, body.fx-hard .link-box { position: relative; }
    body.fx-hard :is(.card, .topbar, .admin-card, .link-box, .bottom-nav, .login-box)::before {
      content: ""; position: absolute; inset: 0; border-radius: inherit; padding: 2px; pointer-events: none; z-index: 4;
      background: conic-gradient(from var(--ang), transparent 0 58%, rgba(255,255,255,.95) 82%, transparent 100%);
      -webkit-mask: linear-gradient(#000 0 0) content-box, linear-gradient(#000 0 0);
      -webkit-mask-composite: xor; mask-composite: exclude;
      animation: edgeLight 3.2s linear infinite;
    }
    @keyframes edgeLight { to { --ang: 360deg; } }
    /* kartu mengambang halus + kilau */
    body.fx-hard .grid > .card { animation: float 3.4s ease-in-out infinite alternate; }
    body.fx-hard .grid > .card:nth-child(even) { animation-duration: 2.8s; animation-delay: -1.4s; }
    @keyframes float { from { transform: translateY(0); } to { transform: translateY(-5px); } }
    body.fx-hard .card::after { animation: sweep 3s ease-in-out infinite; }
    body.fx-hard .card:nth-child(even)::after { animation-delay: -1.5s; }
    body.fx-hard .card-thumb img { filter: saturate(1.2) contrast(1.04); }
    body.fx-hard :is(.btn-primary, .btn-sm.primary, .btn-xs.fill)::after { animation: sweep 2.4s ease-in-out infinite; }
    @keyframes sweep { 0% { transform: translateX(-130%); } 55%, 100% { transform: translateX(130%); } }
    body.fx-hard .nav-item.active::before { animation: navGlow 1.8s ease-in-out infinite alternate; }
    @keyframes navGlow { from { box-shadow: inset 0 1px 0 rgba(255,255,255,.35), 0 0 6px 0 var(--btn-glow); } to { box-shadow: inset 0 1px 0 rgba(255,255,255,.5), 0 0 20px 2px var(--btn-glow); } }
    /* sentuhan: mengempis lalu membal */
    body.fx-hard :is(.btn, .btn-sm, .btn-xs, .cat, .icon-btn, .nav-item, .card-fav) { transition-timing-function: cubic-bezier(.3,1.6,.4,1); transition-duration: .35s; }
    body.fx-hard :is(.btn, .btn-sm, .btn-xs, .cat, .icon-btn, .card-fav):active { transform: scale(.92); }
    /* transisi: membal dengan blur */
    body.fx-hard .page.active { animation: pageHard .55s var(--ease); }
    @keyframes pageHard { 0% { opacity: 0; transform: translateY(34px) scale(.96); filter: blur(10px); } 100% { opacity: 1; transform: none; filter: none; } }
    body.fx-hard .overlay.show .modal { animation: sheetHard .55s cubic-bezier(.2,1.4,.3,1); }
    @keyframes sheetHard { from { transform: translateY(100px) scale(.96); opacity: 0; } to { transform: none; opacity: 1; } }
    body.fx-hard .toast { animation: toastHard .5s cubic-bezier(.2,1.6,.3,1); }
    @keyframes toastHard { from { opacity: 0; transform: translateY(30px) scale(.85); } to { opacity: 1; transform: none; } }
    body.fx-hard .app { animation: slam .6s var(--ease); }
    @keyframes slam { 0% { transform: scale(1.04); filter: blur(6px) brightness(1.15); } 100% { transform: none; filter: none; } }

    /* Hard + gelap: tint gelap tipis di bawah kaca agar teks tetap terbaca di atas warna penuh */
    [data-theme="dark"] body.fx-hard :is(.card, .topbar, .stats, .back, .chip, .link-box, .admin-card, .login-box, .bottom-nav) {
      background: linear-gradient(155deg, rgba(10,10,14,.6), rgba(10,10,14,.36));
    }
    [data-theme="dark"] body.fx-hard { --muted: #c0c0c8; }
</style>

        if (!Array.isArray(arr)) return;
        for (const p of arr) {
          if (p && p.id && p.name && !collected.some(x => x.id === p.id)) collected.push(p);
        }
      };
      // 1. Firebase REST
      try {
        const r = await fetch('https://kenzie-preset-default-rtdb.firebaseio.com/presets.json');
        if (r.ok) {
          const val = await r.json();
          if (Array.isArray(val)) addAll(val);
          else if (val && typeof val === 'object') addAll(Object.values(val));
        }
      } catch (e) { console.warn('REST', e); }
      // 2. Firebase SDK
      if (db) {
        try {
          const snap = await db.ref('presets').once('value');
          const val = snap.val();
          if (Array.isArray(val)) addAll(val);
          else if (val && typeof val === 'object') addAll(Object.values(val));

        input.value = '';
        return;
      }
      const reader = new FileReader();

    function previewThumb(input) {
      const file = input.files && input.files[0];
      if (!file) return;
      const reader = new FileReader();
      reader.onload = function(e) {
        const img = new Image();
        img.onload = function() {
          const canvas = document.createElement('canvas');
          const max = 600;
          let w = img.width, h = img.height;
          if (w > max || h > max) {
            if (w > h) { h = Math.round(h * max / w); w = max; }
            else { w = Math.round(w * max / h); h = max; }
          }
          canvas.width = w; canvas.height = h;
          canvas.getContext('2d').drawImage(img, 0, 0, w, h);
          const data = canvas.toDataURL('image/jpeg', 0.7);
          document.getElementById('fThumbData').value = data;
          document.getElementById('thumbPreview').innerHTML = '<img src="' + data + '" style="width:100%;height:100%;object-fit:cover"/>';
        };
        img.src = e.target.result;
      };
      reader.readAsDataURL(file);
    }

    function openLinkModal(id) { const p=presets.find(x=>x.id===id); if(!p) return; document.getElementById('linkEditId').value=id; document.getElementById('linkModalName').textContent=p.id+' · '+p.name; document.getElementById('fLinkOnly').value=p.link||''; document.getElementById('linkModal').classList.add('show'); document.body.classList.add('modal-open'); setTimeout(()=>document.getElementById('fLinkOnly').focus(),50); }
    function closeLinkModal() { document.getElementById('linkModal').classList.remove('show'); document.body.classList.remove('modal-open'); }
    function saveLink() { const id=document.getElementById('linkEditId').value, val=document.getElementById('fLinkOnly').value.trim(); if(!isShareLink(val)){ toast('Link Alight Motion tidak valid','err'); return; } const idx=presets.findIndex(x=>x.id===id); if(idx<0) return; presets[idx].link=val; saveData(); closeLinkModal(); renderAdminTable(); toast('Link tersimpan','ok'); }
    function savePreset() {
      const name=document.getElementById('fName').value.trim(), creator=document.getElementById('fCreator').value.trim();
      if(!name||!creator){ toast('Nama & kreator wajib','err'); return; }
      const linkVal=document.getElementById('fLink').value.trim(); if(linkVal&&!isShareLink(linkVal)){ toast('Link Alight tidak valid','err'); return; }
      const demoVal=document.getElementById('fDemo').value.trim(); if(demoVal&&!isTikTok(demoVal)){ toast('Link TikTok tidak valid','err'); return; }
      const xmlUrl=document.getElementById('fXmlUrl').value.trim(); if(xmlUrl&&!/^https?:\/\//i.test(xmlUrl)){ toast('Link XML tidak valid','err'); return; }
      const editId=document.getElementById('editId').value;
      const data={name,creator,description:document.getElementById('fDesc').value.trim(),link:linkVal,demo:demoVal,xmlUrl,trending:document.getElementById('fTrending').checked,popular:document.getElementById('fPopular').checked,thumb:document.getElementById('fThumbData').value,video:document.getElementById('fVideo').value.trim()};
      if(editId){ const idx=presets.findIndex(x=>x.id===editId); if(idx>=0) presets[idx]={...presets[idx],...data}; toast('Diperbarui','ok'); }
      else { data.id=nextId(); data.date=new Date().toISOString().slice(0,10); presets.unshift(data); toast('Upload: '+data.id,'ok'); }
      saveData(); closeModal(); renderAdminTable(); renderHome();
    }
    function deletePreset(id) { presets=presets.filter(p=>p.id!==id); favorites=favorites.filter(f=>f!==id); saveData(); saveFavs(); renderAdminTable(); toast('Dihapus','ok'); }
    function esc(s){ if(!s) return ''; return String(s).replace(/&/g,'&').replace(/</g,'<').replace(/>/g,'>').replace(/"/g,'"'); }
    function toast(msg,type){ const c=document.getElementById('toastContainer'), t=document.createElement('div'); t.className='toast '+(type==='err'?'err':'ok'); t.textContent=msg; c.appendChild(t); setTimeout(()=>{t.style.opacity='0';t.style.transition='opacity .3s';setTimeout(()=>t.remove(),300);},2000); }


    // ===== Statistik: berapa kali dilihat & digunakan =====
    // Disimpan di Firebase path /stats/{id}/{v|u}, terpisah dari data preset (tidak ketimpa saat Publish).
    const STATS_KEY = 'kenzie_stats_v1', FB_REST = 'https://kenzie-preset-default-rtdb.firebaseio.com';
    let stats = {};
    try { stats = JSON.parse(lsGet(STATS_KEY) || '{}') || {}; } catch { stats = {}; }
    const seenViews = new Set(), lastUse = {};
    const IC_EYE = '<svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M2 12s3.6-7 10-7 10 7 10 7-3.6 7-10 7S2 12 2 12z"/><circle cx="12" cy="12" r="3"/></svg>';
    const IC_USE = '<svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3v12m0 0-4-4m4 4 4-4M5 21h14"/></svg>';
    function statVal(id, k) { return (stats[id] && Number(stats[id][k])) || 0; }
    function fmtNum(n) {
      n = Number(n) || 0;
      if (n < 1000) return String(n);
      if (n < 1e6) return (n / 1000).toFixed(n < 10000 ? 1 : 0).replace('.0', '') + 'K';
      return (n / 1e6).toFixed(1).replace('.0', '') + 'M';
    }
    function statSpan(id, k, full) { return '<span data-stat-id="' + id + '" data-stat="' + k + '"' + (full ? ' data-full="1"' : '') + '>' + (full ? statVal(id, k).toLocaleString('id-ID') + 'x' : fmtNum(statVal(id, k))) + '</span>'; }
    function statsRow(id) {
      return '<div class="card-stats"><span class="stat" title="Dilihat">' + IC_EYE + statSpan(id, 'v') + '</span><span class="stat" title="Digunakan">' + IC_USE + statSpan(id, 'u') + '</span></div>';
    }
    function statChips(id) {
      return '<span class="chip"><b>Dilihat</b> ' + statSpan(id, 'v', true) + '</span><span class="chip"><b>Digunakan</b> ' + statSpan(id, 'u', true) + '</span>';
    }
    function statText(id) { return fmtNum(statVal(id, 'v')) + ' dilihat · ' + fmtNum(statVal(id, 'u')) + ' dipakai'; }
    function refreshStatsDOM() {
      document.querySelectorAll('[data-stat-id]').forEach(el => {
        const n = statVal(el.dataset.statId, el.dataset.stat);
        el.textContent = el.dataset.full ? n.toLocaleString('id-ID') + 'x' : fmtNum(n);
      });
    }
    function bumpStat(id, k) {
      if (!id) return;
      stats[id] = stats[id] || {};
      stats[id][k] = statVal(id, k) + 1;
      lsSet(STATS_KEY, JSON.stringify(stats));
      refreshStatsDOM();
      try {
        if (db) db.ref('stats/' + id + '/' + k).set(firebase.database.ServerValue.increment(1)).catch(() => {});
        else fetch(FB_REST + '/stats/' + id + '/' + k + '.json', { method: 'PUT', body: JSON.stringify({ '.sv': { increment: 1 } }) }).catch(() => {});
      } catch (e) { console.warn('stats', e); }
    }
    function trackView(id) {
      if (!presets.find(x => x.id === id) || seenViews.has(id)) return;
      seenViews.add(id);
      try { if (sessionStorage.getItem('kenzie_seen_' + id)) return; sessionStorage.setItem('kenzie_seen_' + id, '1'); } catch {}
      bumpStat(id, 'v');
    }
    function trackUse(id) {
      const now = Date.now();
      if (lastUse[id] && now - lastUse[id] < 3000) return;
      lastUse[id] = now;
      bumpStat(id, 'u');
    }
    async function loadStats() {
      try {
        const r = await fetch(FB_REST + '/stats.json');
        if (r.ok) {
          const v = await r.json();
          if (v && typeof v === 'object') {
            for (const id in v) stats[id] = { v: Number(v[id] && v[id].v) || 0, u: Number(v[id] && v[id].u) || 0 };
            lsSet(STATS_KEY, JSON.stringify(stats));
          }
        }
      } catch (e) { console.warn('stats load', e); }
      refreshStatsDOM();
    }

    // Theme toggle
    const themeKey = 'kenzie_theme';
    const root = document.documentElement;
    const themeBtn = document.getElementById('themeToggle');
    function applyTheme(t) {
      if (t === 'dark') { root.dataset.theme = 'dark'; themeBtn.textContent = '☾'; document.querySelector('meta[name="theme-color"]').content = '#08080b'; }
      else { delete root.dataset.theme; themeBtn.textContent = '☀'; document.querySelector('meta[name="theme-color"]').content = '#f2f2f7'; }
      lsSet(themeKey, t);
    }
    themeBtn.onclick = () => applyTheme(root.dataset.theme === 'dark' ? 'light' : 'dark');
    const saved = lsGet(themeKey);
    if (saved === 'dark' || (!saved && matchMedia('(prefers-color-scheme: dark)').matches)) applyTheme('dark');
    else applyTheme('light');

    document.getElementById('presetModal').addEventListener('click', e => { if(e.target===e.currentTarget) closeModal(); });
    document.getElementById('linkModal').addEventListener('click', e => { if(e.target===e.currentTarget) closeLinkModal(); });
    document.getElementById('fLinkOnly').addEventListener('keydown', e => { if(e.key==='Enter') saveLink(); });
    document.getElementById('adminPass').addEventListener('keydown', e => { if(e.key==='Enter') adminLogin(); });

    // Prevent double-tap zoom
    let lastTouchEnd = 0;
    document.addEventListener('touchend', function(e) {
      const now = Date.now();
      if (now - lastTouchEnd <= 300) e.preventDefault();
      lastTouchEnd = now;
    }, { passive: false });

    loadData().then(() => { parseRoute(); loadAvatar(); loadStats(); });
    const FX_KEY = 'kenzie_fx';
    const fxLevels = ['low', 'med', 'hard'];
    const fxLabels = { low: 'Low', med: 'Medium', hard: 'Hard' };
    let fxIndex = 0;
    function applyEffect(level) {
      document.body.classList.remove('fx-low', 'fx-med', 'fx-hard');
      document.body.classList.add('fx-' + level);
      const btn = document.getElementById('fxBtn');
      if (btn) btn.textContent = 'Efek: ' + fxLabels[level];
      try { localStorage.setItem(FX_KEY, level); } catch {}
    }
    function cycleEffect() {
      fxIndex = (fxIndex + 1) % 3;
      applyEffect(fxLevels[fxIndex]);
      const level = fxLevels[fxIndex];
      const msgs = { low: 'Efek Low — halus', med: 'Efek Medium — kuat', hard: 'Efek HARD — brutal!' };
      toast(msgs[level], 'ok');
      // Flash effect on hard
      if (level === 'hard') {
        document.body.style.transition = 'filter 0.2s';
        document.body.style.filter = 'brightness(1.15)';
        setTimeout(() => { document.body.style.filter = ''; }, 200);
      }
    }
    try {
      const saved = localStorage.getItem(FX_KEY);
      if (saved && fxLevels.includes(saved)) { fxIndex = fxLevels.indexOf(saved); applyEffect(saved); }
      else applyEffect('low');
    } catch { applyEffect('low'); }

    window.addEventListener('hashchange', parseRoute);
    parseRoute();
  </script>
</body>
</html>
