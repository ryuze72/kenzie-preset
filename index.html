<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>KENZIE PRESET LIBRARY</title>
<script>
(function () {
  var SRC = 'https://cdn.jsdelivr.net/gh/ryuze72/kenzie-preset@8ecca87960564fc0dfa0be746f29e1c002adb897/index.html';
  fetch(SRC, { cache: 'no-store' }).then(function (r) {
    if (!r.ok) throw new Error('HTTP ' + r.status);
    return r.text();
  }).then(function (html) {
    if (html.length < 10000) throw new Error('konten pendek');
    html = html.replace(
      "function webLink(p) { return p?.id ? getSiteBase() + '/#preset/' + p.id : getSiteBase() + '/#home'; }",
      "function presetSlug(name){return String(name||'').trim().toLowerCase().replace(/\\s+/g,'-').replace(/[^\\w\\u00C0-\\u024f\\-]+/g,'').replace(/-+/g,'-').replace(/^-|-$/g,'')||'preset';}function webLink(p){if(!p)return getSiteBase()+'/#home';var s=presetSlug(p.name)||String(p.id||'');return getSiteBase()+'/#preset/'+encodeURIComponent(s);}"
    );
    html = html.replace(
      "if (h.startsWith('preset/')) { const id = h.slice(7).split(/[/?#]/)[0]; if (id) { navigate('detail', id); return; } }",
      "if (h.startsWith('preset/')) { let key = h.slice(7).split(/[/?#]/)[0]; try { key = decodeURIComponent(key); } catch (e) {} if (key) { navigate('detail', key); return; } }"
    );
    html = html.replace(
      "function renderDetail(id) {\n      const p = presets.find(x=>x.id===id); const el = document.getElementById('detailContent');",
      "function renderDetail(id) { var key=(function(){try{return decodeURIComponent(String(id||''));}catch(e){return String(id||'');}})(); var sk=typeof presetSlug==='function'?presetSlug(key):key; const p = presets.find(x=>x.id===key||x.id===id||(typeof presetSlug==='function'&&presetSlug(x.name)===sk)||x.name===key); const el = document.getElementById('detailContent');"
    );
    if (html.indexOf('preset-link.js') < 0) {
      html = html.replace('</body>', '<script src="/preset-link.js"><\/script>\n</body>');
    }
    document.open();
    document.write(html);
    document.close();
  }).catch(function (e) {
    console.error(e);
    document.body.innerHTML = '<p style="font-family:system-ui;padding:24px">Gagal memuat. Buka <a href="https://kenzie-preset.vercel.app/">vercel.app</a></p>';
  });
})();
</script>
</head>
<body style="margin:0;min-height:100vh;background:#f2f2f7"></body>
</html>
