<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
  <title>KENZIE PRESET LIBRARY</title>
  <meta name="theme-color" content="#f2f2f7" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  <style>
    :root {
      --bg: #f2f2f7;
      --surface: rgba(255,255,255,0.62);
      --surface2: rgba(255,255,255,0.78);
      --ink: #17171a;
      --muted: #77777e;
      --line: rgba(60,60,67,0.13);
      --blue: #007aff;
      --purple: #af52de;
      --green: #34c759;
      --red: #ff3b30;
      --yellow: #ffcc00;
      --shadow: 0 20px 60px rgba(0,0,0,0.09);
      --radius: 22px;
      --radius-sm: 16px;
      --radius-pill: 999px;
    }
    [data-theme="dark"] {
      --bg: #08080b;
      --surface: rgba(28,28,30,0.7);
      --surface2: rgba(44,44,46,0.8);
      --ink: #f5f5f7;
      --muted: #a1a1a6;
      --line: rgba(255,255,255,0.1);
      --shadow: 0 20px 60px rgba(0,0,0,0.4);
    }
    * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
    html { scroll-behavior: smooth; background: var(--bg); }
    body {
      min-height: 100vh;
      background: radial-gradient(circle at 12% 5%, rgba(0,122,255,0.12), transparent 28%),
                  radial-gradient(circle at 88% 20%, rgba(175,82,222,0.13), transparent 28%),
                  linear-gradient(180deg, var(--bg) 0%, #ededf2 100%);
      color: var(--ink);
      font-family: -apple-system, BlinkMacSystemFont, 'Inter', 'SF Pro Display', sans-serif;
      overflow-x: hidden;
      touch-action: manipulation;
    }
    [data-theme="dark"] body {
      background: radial-gradient(circle at 12% 5%, rgba(0,122,255,0.18), transparent 28%),
                  radial-gradient(circle at 88% 20%, rgba(175,82,222,0.2), transparent 28%),
                  linear-gradient(180deg, #08080b 0%, #0c0c0f 100%);
    }
    button, input, textarea, select { font: inherit; color: inherit; }
    button { cursor: pointer; }
    a { color: inherit; text-decoration: none; }

    .app { width: min(100%, 1080px); margin: auto; padding: 18px 16px 80px; }

    /* Topbar liquid glass */
    .topbar {
      position: sticky;
      top: 12px;
      z-index: 20;
      height: 62px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      padding: 7px 9px 7px 10px;
      border: 1px solid rgba(255,255,255,0.7);
      background: rgba(255,255,255,0.55);
      backdrop-filter: blur(28px) saturate(180%);
      -webkit-backdrop-filter: blur(28px) saturate(180%);
      border-radius: 30px;
      box-shadow: 0 12px 35px rgba(0,0,0,0.08);
    }
    [data-theme="dark"] .topbar {
      background: rgba(28,28,30,0.65);
      border-color: rgba(255,255,255,0.12);
    }
    .brand { display: flex; align-items: center; gap: 10px; white-space: nowrap; }
    .brandmark {
      width: 43px; height: 43px; border-radius: 50%;
      background: linear-gradient(145deg, #fff, #e7e7ec);
      color: #111;
      display: grid; place-items: center;
      font-weight: 800; font-size: 17px;
      box-shadow: inset 0 1px 0 #fff, 0 5px 15px rgba(0,0,0,0.08);
    }
    [data-theme="dark"] .brandmark { background: linear-gradient(145deg, #2c2c2e, #1c1c1e); color: #fff; }
    .brandtext { font-weight: 800; font-size: 13px; letter-spacing: -0.25px; }
    .brandtext span { display: block; font-size: 8px; color: var(--muted); margin-top: 1px; font-weight: 600; }

    .search-wrap { flex: 1; max-width: 360px; position: relative; }
    .search-input {
      width: 100%;
      height: 42px;
      padding: 0 36px 0 40px;
      background: rgba(118,118,128,0.1);
      border: 1px solid rgba(255,255,255,0.45);
      border-radius: 999px;
      outline: none;
      font-size: 14px;
    }
    [data-theme="dark"] .search-input { background: rgba(255,255,255,0.06); border-color: rgba(255,255,255,0.1); }
    .search-input::placeholder { color: var(--muted); }
    .search-icon { position: absolute; left: 14px; top: 50%; transform: translateY(-50%); color: var(--muted); pointer-events: none; }
    .clear-btn {
      position: absolute; right: 8px; top: 50%; transform: translateY(-50%);
      width: 26px; height: 26px; border: none; border-radius: 50%;
      background: none; color: var(--muted); display: none; place-items: center;
    }
    .clear-btn.show { display: grid; }

    .icon-btn {
      width: 42px; height: 42px; border-radius: 14px;
      background: rgba(118,118,128,0.1);
      border: 1px solid rgba(255,255,255,0.45);
      display: grid; place-items: center; color: var(--muted);
    }
    [data-theme="dark"] .icon-btn { background: rgba(255,255,255,0.06); border-color: rgba(255,255,255,0.1); }

    .stats {
      display: inline-flex; align-items: center; gap: 6px;
      margin: 18px 0 14px; padding: 7px 13px;
      background: rgba(255,255,255,0.58); border: 1px solid rgba(255,255,255,0.8);
      border-radius: 999px; font-size: 12px; color: var(--muted);
      backdrop-filter: blur(12px);
    }
    [data-theme="dark"] .stats { background: rgba(255,255,255,0.06); border-color: rgba(255,255,255,0.1); }
    .stats b { color: var(--ink); font-weight: 700; }

    .cats { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 22px; }
    .cat {
      min-height: 36px; padding: 0 14px; border-radius: 999px;
      background: rgba(118,118,128,0.1); border: 1px solid rgba(255,255,255,0.45);
      color: var(--muted); font-size: 12.5px; font-weight: 600;
    }
    [data-theme="dark"] .cat { background: rgba(255,255,255,0.06); border-color: rgba(255,255,255,0.1); }
    .cat.active { background: #007aff; color: #fff; border-color: transparent; }

    .section { margin-bottom: 32px; }
    .section-title {
      font-size: 22px; font-weight: 800; letter-spacing: -0.6px; margin-bottom: 12px;
    }
    .grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 12px; }
    @media (min-width: 640px) { .grid { grid-template-columns: repeat(3, 1fr); gap: 16px; } }
    @media (min-width: 900px) { .grid { grid-template-columns: repeat(4, 1fr); gap: 18px; } }

    .card {
      background: var(--surface);
      border: 1px solid rgba(255,255,255,0.7);
      backdrop-filter: blur(20px);
      border-radius: var(--radius);
      overflow: hidden;
      box-shadow: 0 10px 30px rgba(0,0,0,0.05);
      transition: transform 0.2s;
    }
    [data-theme="dark"] .card { border-color: rgba(255,255,255,0.1); }
    .card:hover { transform: translateY(-2px); }
    .card-thumb { aspect-ratio: 16/10; background: linear-gradient(135deg, #e5e5ea, #d1d1d6); position: relative; }
    [data-theme="dark"] .card-thumb { background: linear-gradient(135deg, #2c2c2e, #1c1c1e); }
    .card-thumb img { width: 100%; height: 100%; object-fit: cover; }
    .card-badge {
      position: absolute; top: 8px; left: 8px;
      background: rgba(0,0,0,0.6); color: #fff;
      font-size: 10px; font-weight: 700; padding: 3px 8px; border-radius: 6px;
    }
    .card-fav {
      position: absolute; top: 6px; right: 6px;
      width: 30px; height: 30px; border-radius: 50%;
      background: rgba(0,0,0,0.5); border: none; color: #fff;
      display: grid; place-items: center;
    }
    .card-body { padding: 12px; }
    .card-id {
      display: inline-block; font-family: ui-monospace, monospace;
      font-size: 10px; font-weight: 700; color: var(--blue);
      background: rgba(0,122,255,0.1); padding: 2px 6px; border-radius: 5px;
    }
    .card-title { font-size: 14px; font-weight: 700; margin: 4px 0 2px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .card-meta { font-size: 11px; color: var(--muted); margin-bottom: 8px; }
    .card-actions { display: flex; gap: 6px; }
    .btn-sm {
      flex: 1; min-height: 32px; border-radius: 10px;
      border: 1px solid var(--line); background: rgba(255,255,255,0.6);
      font-size: 11.5px; font-weight: 600; color: var(--ink);
    }
    [data-theme="dark"] .btn-sm { background: rgba(255,255,255,0.08); }
    .btn-sm.primary { background: var(--blue); color: #fff; border-color: transparent; }

    .empty { text-align: center; padding: 36px 16px; color: var(--muted); }
    .empty h3 { font-size: 15px; margin-bottom: 4px; }

    .page { display: none; }
    .page.active { display: block; animation: fade 0.25s ease; }
    @keyframes fade { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: none; } }

    .back {
      display: inline-flex; align-items: center; gap: 6px;
      min-height: 36px; padding: 0 14px; margin-bottom: 16px;
      background: rgba(255,255,255,0.6); border: 1px solid rgba(255,255,255,0.7);
      border-radius: 999px; font-size: 13px; font-weight: 600; color: var(--muted);
    }
    [data-theme="dark"] .back { background: rgba(255,255,255,0.06); border-color: rgba(255,255,255,0.1); }

    .detail-layout { display: grid; gap: 20px; }
    @media (min-width: 700px) { .detail-layout { grid-template-columns: 1fr 1fr; } }
    .detail-thumb {
      border-radius: 24px; overflow: hidden;
      border: 1px solid rgba(255,255,255,0.7);
      aspect-ratio: 16/10; background: #e5e5ea;
      box-shadow: 0 16px 40px rgba(0,0,0,0.08);
    }
    [data-theme="dark"] .detail-thumb { background: #1c1c1e; border-color: rgba(255,255,255,0.1); }
    .detail-thumb img { width: 100%; height: 100%; object-fit: cover; }
    .detail-info h1 { font-size: clamp(26px, 5vw, 36px); font-weight: 800; letter-spacing: -1px; margin-bottom: 8px; }
    .detail-id {
      display: inline-block; font-family: ui-monospace, monospace;
      font-size: 12px; font-weight: 700; color: var(--blue);
      background: rgba(0,122,255,0.1); padding: 4px 10px; border-radius: 8px; cursor: pointer;
    }
    .detail-meta { display: flex; flex-wrap: wrap; gap: 6px; margin: 12px 0; }
    .chip {
      background: rgba(255,255,255,0.6); border: 1px solid rgba(255,255,255,0.7);
      border-radius: 999px; padding: 5px 10px; font-size: 11.5px; color: var(--muted);
    }
    [data-theme="dark"] .chip { background: rgba(255,255,255,0.06); border-color: rgba(255,255,255,0.1); }
    .chip b { color: var(--ink); font-weight: 600; }
    .detail-desc { color: var(--muted); font-size: 14px; line-height: 1.6; margin: 12px 0; }
    .detail-actions { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 16px; }
    .btn {
      min-height: 42px; padding: 0 18px; border-radius: 999px;
      border: none; font-weight: 700; font-size: 13px;
    }
    .btn-primary { background: var(--blue); color: #fff; }
    .btn-outline {
      background: rgba(255,255,255,0.7); border: 1px solid rgba(60,60,67,0.1); color: var(--ink);
    }
    [data-theme="dark"] .btn-outline { background: rgba(255,255,255,0.08); border-color: rgba(255,255,255,0.12); }
    .warn {
      background: rgba(255,204,0,0.12); border: 1px solid rgba(255,204,0,0.3);
      color: #b8860b; padding: 10px 12px; border-radius: 14px; font-size: 13px; margin-bottom: 12px;
    }
    .link-box {
      display: flex; align-items: center; gap: 8px;
      background: rgba(255,255,255,0.55); border: 1px solid rgba(255,255,255,0.7);
      border-radius: 14px; padding: 8px 8px 8px 12px; margin-bottom: 10px;
    }
    [data-theme="dark"] .link-box { background: rgba(255,255,255,0.05); border-color: rgba(255,255,255,0.1); }
    .link-box code { flex: 1; min-width: 0; font-size: 11.5px; color: var(--blue); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

    /* Admin */
    .login-box {
      max-width: 360px; margin: 40px auto; padding: 28px 20px; text-align: center;
      background: var(--surface); border: 1px solid rgba(255,255,255,0.7);
      border-radius: 28px; backdrop-filter: blur(24px);
    }
    [data-theme="dark"] .login-box { border-color: rgba(255,255,255,0.1); }
    .login-box h2 { font-size: 22px; font-weight: 800; margin-bottom: 4px; }
    .login-box p { color: var(--muted); font-size: 13px; margin-bottom: 18px; }
    .form-group { margin-bottom: 12px; text-align: left; }
    .form-group label { display: block; font-size: 12px; font-weight: 600; color: var(--muted); margin-bottom: 5px; }
    .form-input, .form-select {
      width: 100%; min-height: 44px; padding: 10px 14px;
      background: rgba(245,245,247,0.8); border: 1px solid rgba(60,60,67,0.12);
      border-radius: 14px; outline: none;
    }
    [data-theme="dark"] .form-input, [data-theme="dark"] .form-select {
      background: rgba(255,255,255,0.06); border-color: rgba(255,255,255,0.1);
    }
    .form-input:focus, .form-select:focus { border-color: var(--blue); box-shadow: 0 0 0 3px rgba(0,122,255,0.12); }
    .admin-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 12px; flex-wrap: wrap; gap: 8px; }
    .admin-header h2 { font-size: 20px; font-weight: 800; }
    .table-wrap { overflow-x: auto; background: var(--surface); border-radius: 18px; border: 1px solid rgba(255,255,255,0.7); }
    [data-theme="dark"] .table-wrap { border-color: rgba(255,255,255,0.1); }
    table { width: 100%; border-collapse: collapse; font-size: 13px; }
    th, td { padding: 12px 14px; text-align: left; border-bottom: 1px solid var(--line); }
    th { font-size: 11px; font-weight: 700; color: var(--muted); text-transform: uppercase; letter-spacing: 0.5px; }
    .btn-xs { min-height: 30px; padding: 0 10px; border-radius: 8px; font-size: 11px; font-weight: 600; border: 1px solid var(--line); background: rgba(255,255,255,0.6); }
    [data-theme="dark"] .btn-xs { background: rgba(255,255,255,0.08); }
    .btn-xs.fill { background: var(--blue); color: #fff; border-color: transparent; }
    .btn-xs.danger { color: var(--red); }
    .status { display: inline-block; padding: 3px 8px; border-radius: 999px; font-size: 11px; font-weight: 700; }
    .status.ok { color: var(--green); background: rgba(52,199,89,0.12); }
    .status.wait { color: #b8860b; background: rgba(255,204,0,0.15); }

    .overlay {
      position: fixed; inset: 0; background: rgba(0,0,0,0.45);
      backdrop-filter: blur(8px); z-index: 100;
      display: none; align-items: center; justify-content: center; padding: 16px;
    }
    .overlay.show { display: flex; }
    .modal {
      background: var(--surface2); border-radius: 24px;
      width: 100%; max-width: 400px; max-height: 90vh; overflow-y: auto; padding: 20px;
      border: 1px solid rgba(255,255,255,0.7);
    }
    [data-theme="dark"] .modal { border-color: rgba(255,255,255,0.1); }
    .modal h3 { font-size: 17px; font-weight: 800; margin-bottom: 14px; }
    .modal-actions { display: flex; gap: 8px; justify-content: flex-end; margin-top: 14px; }

    .toasts {
      position: fixed; bottom: 90px; left: 50%; transform: translateX(-50%);
      z-index: 200; display: flex; flex-direction: column; gap: 6px; pointer-events: none;
    }
    .toast {
      background: rgba(255,255,255,0.85); border: 1px solid rgba(255,255,255,0.7);
      border-radius: 14px; padding: 10px 16px; font-size: 13px; font-weight: 600;
      box-shadow: 0 8px 24px rgba(0,0,0,0.12); backdrop-filter: blur(12px);
    }
    [data-theme="dark"] .toast { background: rgba(44,44,46,0.9); border-color: rgba(255,255,255,0.1); }
    .toast.ok { color: var(--green); }
    .toast.err { color: var(--red); }

    .bottom-nav {
      position: fixed; bottom: 0; left: 0; right: 0;
      background: rgba(255,255,255,0.75); backdrop-filter: blur(20px);
      border-top: 1px solid rgba(255,255,255,0.7);
      display: flex; justify-content: space-around;
      padding: 6px 0 calc(6px + env(safe-area-inset-bottom)); z-index: 40;
    }
    [data-theme="dark"] .bottom-nav { background: rgba(28,28,30,0.8); border-color: rgba(255,255,255,0.1); }
    @media (min-width: 700px) { .bottom-nav { display: none; } .app { padding-bottom: 24px; } }
    .nav-item {
      display: flex; flex-direction: column; align-items: center; gap: 2px;
      background: none; border: none; color: var(--muted);
      font-size: 10px; font-weight: 600; padding: 4px 10px;
    }
    .nav-item.active { color: var(--blue); }
    .nav-item svg { width: 20px; height: 20px; }

    .theme-toggle {
      position: fixed; bottom: 80px; right: 16px; z-index: 30;
      width: 44px; height: 44px; border-radius: 50%;
      background: rgba(255,255,255,0.8); border: 1px solid rgba(255,255,255,0.7);
      display: grid; place-items: center; font-size: 18px; box-shadow: 0 6px 20px rgba(0,0,0,0.1);
    }
    [data-theme="dark"] .theme-toggle { background: rgba(44,44,46,0.85); border-color: rgba(255,255,255,0.1); }
    @media (min-width: 700px) { .theme-toggle { bottom: 20px; } }
  </style>

  <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-database-compat.js"></script>
</head>
<body>
  <div class="app">
    <header class="topbar">
      <div class="brand" onclick="navigate('home')">
        <div class="brandmark">RZ</div>
        <div class="brandtext">KENZIE<span>PRESET</span></div>
      </div>
      <div class="search-wrap">
        <svg class="search-icon" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.3-4.3"/></svg>
        <input class="search-input" id="searchInput" placeholder="Cari preset..." />
        <button class="clear-btn" id="clearSearch" onclick="clearSearch()">✕</button>
      </div>
      <button class="icon-btn" onclick="navigate('favorites')" title="Favorit">♡</button>
      <button class="icon-btn" onclick="navigate('admin')" title="Admin">⚙</button>
    </header>

    <div class="page active" id="homePage">
      <div class="stats"><b id="totalCount">0</b> preset · <b id="readyCount">0</b> siap</div>
      <div class="cats" id="catBar">
        <button class="cat active" data-cat="All">Semua</button>
        <button class="cat" data-cat="Trending">Trending</button>
        <button class="cat" data-cat="Popular">Populer</button>
        <button class="cat" data-cat="XML">XML</button>
        <button class="cat" data-cat="PRESET5MB">Preset 5MB</button>
      </div>
      <div class="section">
        <div class="section-title" id="listTitle">Semua preset</div>
        <div class="grid" id="gridAll"></div>
        <div class="load-more" id="loadMoreWrap" style="display:none;margin-top:16px;text-align:center">
          <button class="btn btn-outline" onclick="loadMore()">Muat lebih banyak</button>
        </div>
      </div>
    </div>

    <div class="page" id="detailPage">
      <button class="back" onclick="navigate('home')">← Kembali</button>
      <div class="detail-layout" id="detailContent"></div>
      <div class="section" style="margin-top:24px" id="similarSection">
        <div class="section-title">Serupa</div>
        <div class="grid" id="gridSimilar"></div>
      </div>
    </div>

    <div class="page" id="favPage">
      <button class="back" onclick="navigate('home')">← Kembali</button>
      <div class="section">
        <div class="section-title">Favorit</div>
        <div class="grid" id="gridFav"></div>
        <div class="empty" id="favEmpty" style="display:none"><h3>Belum ada favorit</h3></div>
      </div>
    </div>

    <div class="page" id="adminPage">
      <div id="adminLogin" class="login-box">
        <h2>Admin</h2>
        <p>Password: <code>kenzie</code></p>
        <div class="form-group"><label>Password</label><input type="password" class="form-input" id="adminPass" /></div>
        <button class="btn btn-primary" style="width:100%" onclick="adminLogin()">Masuk</button>
        <button class="btn btn-outline" style="width:100%;margin-top:8px" onclick="navigate('home')">Kembali</button>
      </div>
      <div id="adminPanel" style="display:none">
        <div class="admin-header">
          <h2>Kelola Preset</h2>
          <div style="display:flex;gap:8px;align-items:center">
            <button class="btn btn-outline" id="modeToggleBtn" onclick="toggleSiteMode()" style="font-size:12px;padding:0 12px">Public</button>
            <button class="btn btn-primary" onclick="openAddModal()">+ Upload</button>
            <button class="btn btn-outline" onclick="publishPresets()" style="font-size:12px;background:#34c759;color:#fff">Publish</button>
            <button class="btn btn-outline" onclick="adminLogout()">Logout</button>
          </div>
        </div>
        <p style="color:var(--muted);font-size:12px;margin-bottom:12px">Upload dulu → isi link Alight Motion lewat tombol Isi link.</p>
        <div class="table-wrap">
          <table>
            <thead><tr><th>ID</th><th>Nama</th><th>Kreator</th><th>Tipe</th><th>Link</th><th>T</th><th>P</th><th>Aksi</th></tr></thead>
            <tbody id="adminTableBody"></tbody>
          </table>
        </div>
      </div>
    </div>
  </div>

  <nav class="bottom-nav">
    <button class="nav-item active" data-page="home" onclick="navigate('home')">
      <svg fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/></svg>Home
    </button>

          <button type="button" class="btn btn-outline" style="font-size:12px;flex:1" onclick="document.getElementById('fThumb').setAttribute('capture','environment');document.getElementById('fThumb').click()">Kamera</button>

        <div id="thumbPreview" style="width:100%;aspect-ratio:16/10;background:#1c1c1e;border-radius:12px;display:grid;place-items:center;overflow:hidden;font-size:28px;opacity:.4">🎬</div>

  <script>
    const FAV_KEY = 'kenzie_favs_v1', ADMIN_KEY = 'kenzie_admin_ok', LOCAL_KEY = 'kenzie_presets_v2', ADMIN_PASS = 'kenzie', MODE_KEY = 'kenzie_mode';
    const SITE_URL = 'https://kenzie-preset.vercel.app';

    // ===== FIREBASE CONFIG (isi dari Firebase Console) =====
    const firebaseConfig = {
      apiKey: "AIzaSyDuRmnuZ0XMqwdh7X4ITutmwTgA3YL-5bc",
      authDomain: "kenzie-preset.firebaseapp.com",
      databaseURL: "https://kenzie-preset-default-rtdb.firebaseio.com",
      projectId: "kenzie-preset",
      storageBucket: "kenzie-preset.firebasestorage.app",
      messagingSenderId: "225447135498",
      appId: "1:225447135498:web:ce6515b38b10ea602e92f3",
      measurementId: "G-NFC225TYLB"
    };
    // ======================================================

    let db = null;
    try {
      if (firebaseConfig.apiKey && !firebaseConfig.apiKey.startsWith('ISI_')) {
        firebase.initializeApp(firebaseConfig);
        db = firebase.database();
      }
    } catch (e) { console.warn('Firebase init', e); }

    const PRESETS_URL = '/api/presets';
    const PRESETS_PUT = 'https://api.jstash.app/v1/bins/pcexosfWnXmzw6wk5NmgDQ';
    const PRESETS_TOKEN = 'js_edit_T9y2iIeZPa_K6jY3zFHZy9Vx9JwnWuDiFNndT-IYWG0';

    function getSiteBase() {
      if ((location.protocol === 'http:' || location.protocol === 'https:') && !['localhost','127.0.0.1'].includes(location.hostname)) return location.origin;
      return SITE_URL;
    }
    function webLink(p) { return p?.id ? getSiteBase() + '/#preset/' + p.id : getSiteBase() + '/#home'; }
    const SHARE_RE = /^https?:\/\/(www\.)?alightcreative\.com\/am\/share\/\S+$/i;
    function isShareLink(u) { return SHARE_RE.test((u||'').trim()); }
    function isTikTok(u) { return /^https?:\/\/(www\.)?(vm\.)?tiktok\.com\/\S+$/i.test((u||'').trim()); }

    let presets = [], favorites = [], currentCat = 'All', searchQuery = '', allPage = 1, isAdmin = false, currentPage = 'home', delArm = null, delTimer = null, loaded = false, siteMode = 'public';
    const PAGE_SIZE = 12;

    function lsGet(k) { try { return localStorage.getItem(k); } catch { return null; } }
    function lsSet(k, v) { try { localStorage.setItem(k, v); } catch {} }
    function lsDel(k) { try { localStorage.removeItem(k); } catch {} }
    async function loadData() {
      isAdmin = lsGet(ADMIN_KEY) === '1';
      siteMode = lsGet(MODE_KEY) || 'public';
      try { favorites = JSON.parse(lsGet(FAV_KEY) || '[]'); } catch { favorites = []; }

      if (db) {
        try {
          const snap = await db.ref('presets').once('value');
          const val = snap.val();
          presets = Array.isArray(val) ? val : (val ? Object.values(val) : []);
        } catch (e) {
          console.warn('Firebase load', e);
          try { presets = JSON.parse(lsGet(LOCAL_KEY) || '[]'); } catch { presets = []; }
        }
      } else {
        // Fallback ke API lokal
        try {
          const res = await fetch('/api/presets?t=' + Date.now());
          if (res.ok) {
            const data = await res.json();
            if (Array.isArray(data)) presets = data;
          }
        } catch (e) {
          try { presets = JSON.parse(lsGet(LOCAL_KEY) || '[]'); } catch { presets = []; }
        }
      }
      loaded = true;
    }
    function saveData() { 
      lsSet(LOCAL_KEY, JSON.stringify(presets)); 
      publishPresets();
    }
    async function publishPresets() {
      if (!Array.isArray(presets)) { toast('Tidak ada preset', 'err'); return; }
      toast('Menyimpan...', 'ok');
      try {
        if (db) {
          await db.ref('presets').set(presets);
          toast('Berhasil! Tersimpan di Firebase', 'ok');
          lsSet(LOCAL_KEY, JSON.stringify(presets));
        } else {
          const r = await fetch('/api/publish', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ password: ADMIN_PASS, presets })
          });
          const j = await r.json().catch(()=>({}));
          if (r.ok && j.ok) {
            toast('Berhasil! Semua orang bisa lihat', 'ok');
            lsSet(LOCAL_KEY, JSON.stringify(presets));
          } else {
            toast('Gagal: ' + (j.error || r.status), 'err');
          }
        }
      } catch (e) {
        toast('Gagal: ' + (e.message || 'server'), 'err');
      }
    }
    function saveFavs() { lsSet(FAV_KEY, JSON.stringify(favorites)); }
    function nextId() {
      const n = presets.map(p => parseInt((p.id||'').replace('RYZ-',''),10)||0);
      return 'RYZ-' + String((n.length ? Math.max(...n) : 0) + 1).padStart(3,'0');
    }
    function setHash(h) { try { history.replaceState(null,'',h); } catch {} }

    function navigate(page, id) {
      if (siteMode === 'private' && !isAdmin && page !== 'admin') {
        // Force to admin login if private and not authenticated
        window.scrollTo(0,0); currentPage = 'admin';
        document.querySelectorAll('.page').forEach(p => p.classList.remove('active'));
        document.getElementById('adminPage').classList.add('active');
        setHash('#admin');
        showAdminLogin();
        toast('Mode Private — masukkan password admin', 'err');
        return;
      }
      window.scrollTo(0,0); currentPage = page;
      document.querySelectorAll('.page').forEach(p => p.classList.remove('active'));
      document.querySelectorAll('.nav-item').forEach(n => n.classList.remove('active'));
      if (page === 'home') {
        document.getElementById('homePage').classList.add('active');
        setHash('#home'); document.querySelector('.nav-item[data-page="home"]')?.classList.add('active');
        renderHome();
      } else if (page === 'detail' && id) {
        document.getElementById('detailPage').classList.add('active');
        setHash('#preset/' + id); renderDetail(id);
      } else if (page === 'favorites') {
        document.getElementById('favPage').classList.add('active');
        setHash('#favorit'); document.querySelector('.nav-item[data-page="favorites"]')?.classList.add('active');
        renderFavorites();
      } else if (page === 'admin') {
        document.getElementById('adminPage').classList.add('active');
        setHash('#admin'); document.querySelector('.nav-item[data-page="admin"]')?.classList.add('active');
        isAdmin ? showAdminPanel() : showAdminLogin();
      }
    }
    function parseRoute() {
      const h = (location.hash||'#home').slice(1);
      if (h.startsWith('preset/')) { const id = h.slice(7).split(/[/?#]/)[0]; if (id) { navigate('detail', id); return; } }
      if (/^RYZ-\d+/i.test(h)) { navigate('detail', h.split(/[/?#]/)[0].toUpperCase()); return; }
      if (h === 'favorit' || h === 'favorites') navigate('favorites');
      else if (h === 'admin') navigate('admin');
      else navigate('home');
    }
    function none(m) { return `<div class="empty" style="grid-column:1/-1"><p>${m}</p></div>`; }
    function getFiltered() {
      let list = [...presets];
      if (currentCat === 'XML') list = list.filter(p => p.xmlUrl);
      else if (currentCat === 'PRESET5MB') list = list.filter(p => p.link);
      else if (currentCat === 'Trending') list = list.filter(p => p.trending);
      else if (currentCat === 'Popular') list = list.filter(p => p.popular);
      if (searchQuery) {
        const q = searchQuery.toLowerCase();
        list = list.filter(p => (p.name||'').toLowerCase().includes(q) || (p.creator||'').toLowerCase().includes(q) || (p.id||'').toLowerCase().includes(q) || (p.description||'').toLowerCase().includes(q));
      }
      return list;
    }
    function cardHTML(p) {
      const isFav = favorites.includes(p.id);
      const thumb = p.thumb ? `<img src="${esc(p.thumb)}" alt="" onerror="this.parentElement.innerHTML='<div style=\\'width:100%;height:100%;display:grid;place-items:center;font-size:28px;opacity:.4\\'>🎬</div>'"/>` : `<div style="width:100%;height:100%;display:grid;place-items:center;font-size:28px;opacity:.35">🎬</div>`;
      const badge = currentCat === 'XML' ? 'XML' : (p.link ? '5MB' : 'XML');
      const main = currentCat === 'XML'
        ? (p.xmlUrl ? `<a class="btn-sm primary" href="${esc(p.xmlUrl)}" target="_blank" onclick="event.stopPropagation()">Buka XML</a>` : '<button class="btn-sm primary" disabled>XML</button>')
        : (p.link ? `<a class="btn-sm primary" href="${esc(p.link)}" onclick="event.stopPropagation()">Impor</a>` : '<button class="btn-sm primary" disabled>Belum</button>');
      return `<div class="card"><div class="card-thumb" onclick="navigate('detail','${p.id}')">${thumb}<span class="card-badge">${badge}</span><button class="card-fav" onclick="event.stopPropagation();toggleFav('${p.id}')">${isFav?'❤️':'🤍'}</button></div><div class="card-body"><span class="card-id">${p.id}</span><div class="card-title" onclick="navigate('detail','${p.id}')">${esc(p.name)}</div><div class="card-meta">${esc(p.creator)}</div><div class="card-actions">${main}<button class="btn-sm" onclick="event.stopPropagation();copyWebLink('${p.id}')">Salin</button></div></div></div>`;
    }
    function renderHome() {
      document.getElementById('totalCount').textContent = presets.length;
      document.getElementById('readyCount').textContent = presets.filter(p=>p.link).length;
      const titles = { All:'Semua preset', Trending:'Trending', Popular:'Populer', XML:'Preset XML', PRESET5MB:'Preset 5MB' };
      const list = getFiltered();
      document.getElementById('listTitle').textContent = searchQuery ? 'Hasil: "' + searchQuery + '"' : (titles[currentCat] || 'Semua preset');
      document.getElementById('gridAll').innerHTML = list.slice(0, allPage*PAGE_SIZE).map(cardHTML).join('') || none(searchQuery ? 'Tidak ditemukan' : 'Belum ada preset');
      document.getElementById('loadMoreWrap').style.display = list.length > allPage*PAGE_SIZE ? 'block' : 'none';
    }
    function loadMore() { allPage++; renderHome(); }
    function renderDetail(id) {
      const p = presets.find(x=>x.id===id); const el = document.getElementById('detailContent');
      if (!p) { el.innerHTML = `<div class="empty"><h3>Tidak ditemukan</h3><button class="btn btn-primary" style="margin-top:12px" onclick="navigate('home')">Kembali</button></div>`; document.getElementById('similarSection').style.display='none'; return; }
      document.getElementById('similarSection').style.display='block';
      const isFav = favorites.includes(p.id);
      const thumb = p.thumb ? `<img src="${esc(p.thumb)}" alt=""/>` : `<div style="width:100%;height:100%;display:grid;place-items:center;font-size:48px;opacity:.3">🎬</div>`;
      el.innerHTML = `<div class="detail-thumb">${thumb}</div><div class="detail-info"><span class="detail-id" onclick="copyWebLink('${p.id}')">${p.id}</span><h1>${esc(p.name)}</h1><div class="detail-meta"><span class="chip"><b>Kreator</b> ${esc(p.creator)}</span><span class="chip"><b>Upload</b> ${esc(p.date||'-')}</span>${p.trending?'<span class="chip">Trending</span>':''}${p.popular?'<span class="chip">Populer</span>':''}</div>${p.description?`<p class="detail-desc">${esc(p.description)}</p>`:''}${p.link?`<div class="link-box"><code>${esc(p.link)}</code><button class="btn-sm" style="flex:none" onclick="copyAlightLink('${p.id}')">Salin</button></div>`:`<div class="warn">⏳ Menunggu link Alight Motion</div>`}${p.demo?`<div class="link-box"><code>${esc(p.demo)}</code><button class="btn-sm" style="flex:none" onclick="copyDemoLink('${p.id}')">Salin</button></div>`:''}${p.xmlUrl?`<div class="link-box"><code>${esc(p.xmlUrl)}</code><button class="btn-sm" style="flex:none" onclick="copyXMLLink('${p.id}')">Salin</button></div>`:''}<div class="detail-actions">${p.link?`<a class="btn btn-primary" href="${esc(p.link)}">Impor</a>`:'<button class="btn btn-primary" disabled>Impor</button>'}<button class="btn btn-outline" onclick="copyWebLink('${p.id}')">Salin Web</button><button class="btn btn-outline" onclick="sharePreset('${p.id}')">Bagikan</button><button class="btn btn-outline" onclick="toggleFav('${p.id}');renderDetail('${p.id}')">${isFav?'❤️':'🤍'}</button></div></div>`;
      document.getElementById('gridSimilar').innerHTML = presets.filter(x=>x.id!==p.id).slice(0,4).map(cardHTML).join('') || '<p style="color:var(--muted)">Tidak ada</p>';
    }
    function renderFavorites() {
      const list = presets.filter(p=>favorites.includes(p.id));
      const g = document.getElementById('gridFav'), e = document.getElementById('favEmpty');
      if (!list.length) { g.innerHTML=''; e.style.display='block'; } else { e.style.display='none'; g.innerHTML=list.map(cardHTML).join(''); }
    }
    function copyText(text, msg) {
      const fb = () => { try { const ta=document.createElement('textarea'); ta.value=text; document.body.appendChild(ta); ta.select(); document.execCommand('copy'); document.body.removeChild(ta); toast(msg,'ok'); } catch { toast('Gagal','err'); } };
      if (navigator.clipboard?.writeText) navigator.clipboard.writeText(text).then(()=>toast(msg,'ok')).catch(fb); else fb();
    }
    function copyWebLink(id) { const p=presets.find(x=>x.id===id); if(p) copyText(webLink(p),'Link web disalin!'); }
    function copyAlightLink(id) { const p=presets.find(x=>x.id===id); if(p?.link) copyText(p.link,'Link disalin!'); else toast('Belum diisi','err'); }
    function copyDemoLink(id) { const p=presets.find(x=>x.id===id); if(p?.demo) copyText(p.demo,'TikTok disalin!'); }
    function copyXMLLink(id) { const p=presets.find(x=>x.id===id); if(p?.xmlUrl) copyText(p.xmlUrl,'XML disalin!'); }
    function sharePreset(id) { const p=presets.find(x=>x.id===id); if(!p) return; const url=webLink(p), text=`${p.name} (${p.id})\n${url}`; if(navigator.share) navigator.share({title:p.name,text,url}).catch(()=>copyText(text,'Disalin!')); else copyText(text,'Disalin!'); }
    function toggleFav(id) { const i=favorites.indexOf(id); if(i>=0) favorites.splice(i,1); else favorites.push(id); saveFavs(); toast(i>=0?'Dihapus':'Ditambah favorit','ok'); if(currentPage==='home') renderHome(); else if(currentPage==='favorites') renderFavorites(); }

    document.getElementById('searchInput').addEventListener('input', e => {
      searchQuery = e.target.value.trim();
      document.getElementById('clearSearch').classList.toggle('show', !!searchQuery);
      if (document.getElementById('homePage').classList.contains('active')) renderHome(); else navigate('home');
    });
    function clearSearch() { searchQuery=''; document.getElementById('searchInput').value=''; document.getElementById('clearSearch').classList.remove('show'); renderHome(); }
    document.getElementById('catBar').addEventListener('click', e => {
      const btn = e.target.closest('.cat'); if(!btn) return;
      document.querySelectorAll('.cat').forEach(b=>b.classList.remove('active')); btn.classList.add('active');
      currentCat = btn.dataset.cat; allPage=1; renderHome();
    });

    function showAdminLogin() { document.getElementById('adminLogin').style.display='block'; document.getElementById('adminPanel').style.display='none'; }
    function showAdminPanel() { 
      document.getElementById('adminLogin').style.display='none'; 
      document.getElementById('adminPanel').style.display='block'; 
      updateModeButton();
      renderAdminTable(); 
    }
    function updateModeButton() {
      const btn = document.getElementById('modeToggleBtn');
      if (btn) {
        btn.textContent = siteMode === 'private' ? 'Private' : 'Public';
        btn.style.background = siteMode === 'private' ? 'var(--red)' : '';
        btn.style.color = siteMode === 'private' ? '#fff' : '';
      }
    }
    function toggleSiteMode() {
      siteMode = siteMode === 'public' ? 'private' : 'public';
      lsSet(MODE_KEY, siteMode);
      updateModeButton();
      toast(siteMode === 'private' ? 'Mode Private aktif' : 'Mode Public aktif', 'ok');
    }
    function downloadPresetsJson() {
      const blob = new Blob([JSON.stringify(presets, null, 2)], {type:'application/json'});
      const a = document.createElement('a');
      a.href = URL.createObjectURL(blob);
      a.download = 'presets.json';
      a.click();
      toast('presets.json diunduh — upload ke GitHub agar semua orang bisa lihat', 'ok');
    }
    function adminLogin() { if(document.getElementById('adminPass').value===ADMIN_PASS){ isAdmin=true; lsSet(ADMIN_KEY,'1'); showAdminPanel(); toast('Login OK','ok'); } else toast('Password salah','err'); }
    function adminLogout() { isAdmin=false; lsDel(ADMIN_KEY); showAdminLogin(); toast('Logout','ok'); }
    function askDelete(id) { clearTimeout(delTimer); if(delArm===id){ delArm=null; deletePreset(id); return; } delArm=id; renderAdminTable(); delTimer=setTimeout(()=>{delArm=null;renderAdminTable();},3000); }
    function renderAdminTable() {
      document.getElementById('adminTableBody').innerHTML = presets.map(p=>`<tr><td><code>${p.id}</code></td><td>${esc(p.name)}</td><td>${esc(p.creator)}</td><td>${[p.xmlUrl?'XML':'',p.link?'Alight':''].filter(Boolean).join(' + ')||'—'}</td><td>${p.link?'<span class="status ok">Siap</span>':'<span class="status wait">Wait</span>'}</td><td>${p.trending?'✓':'—'}</td><td>${p.popular?'✓':'—'}</td><td><button class="btn-xs ${p.link?'':'fill'}" onclick="openLinkModal('${p.id}')">${p.link?'Ubah':'Isi'}</button> <button class="btn-xs" onclick="openEditModal('${p.id}')">Edit</button> <button class="btn-xs danger" onclick="askDelete('${p.id}')">${delArm===p.id?'Yakin?':'Hapus'}</button></td></tr>`).join('');
    }
    
    function previewThumb(input) {
      const file = input.files && input.files[0];
      if (!file) return;
      const reader = new FileReader();
      reader.onload = function(e) {
        const img = new Image();
        img.onload = function() {
          const canvas = document.createElement('canvas');
          const max = 600;
          let w = img.width, h = img.height;
          if (w > max || h > max) {
            if (w > h) { h = Math.round(h * max / w); w = max; }
            else { w = Math.round(w * max / h); h = max; }
          }
          canvas.width = w; canvas.height = h;
          canvas.getContext('2d').drawImage(img, 0, 0, w, h);
          const data = canvas.toDataURL('image/jpeg', 0.7);
          document.getElementById('fThumbData').value = data;
          document.getElementById('thumbPreview').innerHTML = '<img src="' + data + '" style="width:100%;height:100%;object-fit:cover"/>';
        };
        img.src = e.target.result;
      };
      reader.readAsDataURL(file);
    }
    function openAddModal() { document.getElementById('modalTitle').textContent='Upload Preset'; document.getElementById('editId').value=''; ['fName','fCreator','fDesc','fLink','fDemo','fXmlUrl'].forEach(id=>document.getElementById(id).value=''); document.getElementById('fTrending').checked=false; document.getElementById('fPopular').checked=false; document.getElementById('fThumbData').value=''; document.getElementById('thumbPreview').innerHTML='🎬'; document.getElementById('fThumb').value=''; document.getElementById('presetModal').classList.add('show'); }
    function openEditModal(id) { const p=presets.find(x=>x.id===id); if(!p) return; document.getElementById('modalTitle').textContent='Edit'; document.getElementById('editId').value=id; document.getElementById('fName').value=p.name||''; document.getElementById('fCreator').value=p.creator||''; document.getElementById('fDesc').value=p.description||''; document.getElementById('fLink').value=p.link||''; document.getElementById('fDemo').value=p.demo||''; document.getElementById('fXmlUrl').value=p.xmlUrl||''; document.getElementById('fTrending').checked=!!p.trending; document.getElementById('fPopular').checked=!!p.popular; document.getElementById('fThumbData').value=p.thumb||''; document.getElementById('thumbPreview').innerHTML=p.thumb?'<img src="'+p.thumb+'" style="width:100%;height:100%;object-fit:cover"/>':'🎬'; document.getElementById('fThumb').value=''; document.getElementById('presetModal').classList.add('show'); }
    function closeModal() { document.getElementById('presetModal').classList.remove('show'); }
    function openLinkModal(id) { const p=presets.find(x=>x.id===id); if(!p) return; document.getElementById('linkEditId').value=id; document.getElementById('linkModalName').textContent=p.id+' · '+p.name; document.getElementById('fLinkOnly').value=p.link||''; document.getElementById('linkModal').classList.add('show'); setTimeout(()=>document.getElementById('fLinkOnly').focus(),50); }
    function closeLinkModal() { document.getElementById('linkModal').classList.remove('show'); }
    function saveLink() { const id=document.getElementById('linkEditId').value, val=document.getElementById('fLinkOnly').value.trim(); if(!isShareLink(val)){ toast('Link Alight Motion tidak valid','err'); return; } const idx=presets.findIndex(x=>x.id===id); if(idx<0) return; presets[idx].link=val; saveData(); closeLinkModal(); renderAdminTable(); toast('Link tersimpan','ok'); }
    function savePreset() {
      const name=document.getElementById('fName').value.trim(), creator=document.getElementById('fCreator').value.trim();
      if(!name||!creator){ toast('Nama & kreator wajib','err'); return; }
      const linkVal=document.getElementById('fLink').value.trim(); if(linkVal&&!isShareLink(linkVal)){ toast('Link Alight tidak valid','err'); return; }
      const demoVal=document.getElementById('fDemo').value.trim(); if(demoVal&&!isTikTok(demoVal)){ toast('Link TikTok tidak valid','err'); return; }
      const xmlUrl=document.getElementById('fXmlUrl').value.trim(); if(xmlUrl&&!/^https?:\/\//i.test(xmlUrl)){ toast('Link XML tidak valid','err'); return; }
      const editId=document.getElementById('editId').value;
      const data={name,creator,description:document.getElementById('fDesc').value.trim(),link:linkVal,demo:demoVal,xmlUrl,trending:document.getElementById('fTrending').checked,popular:document.getElementById('fPopular').checked,thumb:document.getElementById('fThumbData').value};
      if(editId){ const idx=presets.findIndex(x=>x.id===editId); if(idx>=0) presets[idx]={...presets[idx],...data}; toast('Diperbarui','ok'); }
      else { data.id=nextId(); data.date=new Date().toISOString().slice(0,10); presets.unshift(data); toast('Upload: '+data.id,'ok'); }
      saveData(); closeModal(); renderAdminTable();
    }
    function deletePreset(id) { presets=presets.filter(p=>p.id!==id); favorites=favorites.filter(f=>f!==id); saveData(); saveFavs(); renderAdminTable(); toast('Dihapus','ok'); }
    function esc(s){ if(!s) return ''; return String(s).replace(/&/g,'&').replace(/</g,'<').replace(/>/g,'>').replace(/"/g,'"'); }
    function toast(msg,type){ const c=document.getElementById('toastContainer'), t=document.createElement('div'); t.className='toast '+(type==='err'?'err':'ok'); t.textContent=msg; c.appendChild(t); setTimeout(()=>{t.style.opacity='0';t.style.transition='opacity .3s';setTimeout(()=>t.remove(),300);},2000); }

    // Theme toggle
    const themeKey = 'kenzie_theme';
    const root = document.documentElement;
    const themeBtn = document.getElementById('themeToggle');
    function applyTheme(t) {
      if (t === 'dark') { root.dataset.theme = 'dark'; themeBtn.textContent = '☾'; document.querySelector('meta[name="theme-color"]').content = '#08080b'; }
      else { delete root.dataset.theme; themeBtn.textContent = '☀'; document.querySelector('meta[name="theme-color"]').content = '#f2f2f7'; }
      lsSet(themeKey, t);
    }
    themeBtn.onclick = () => applyTheme(root.dataset.theme === 'dark' ? 'light' : 'dark');
    const saved = lsGet(themeKey);
    if (saved === 'dark' || (!saved && matchMedia('(prefers-color-scheme: dark)').matches)) applyTheme('dark');
    else applyTheme('light');

    document.getElementById('presetModal').addEventListener('click', e => { if(e.target===e.currentTarget) closeModal(); });
    document.getElementById('linkModal').addEventListener('click', e => { if(e.target===e.currentTarget) closeLinkModal(); });
    document.getElementById('fLinkOnly').addEventListener('keydown', e => { if(e.key==='Enter') saveLink(); });
    document.getElementById('adminPass').addEventListener('keydown', e => { if(e.key==='Enter') adminLogin(); });

    // Prevent double-tap zoom
    let lastTouchEnd = 0;
    document.addEventListener('touchend', function(e) {
      const now = Date.now();
      if (now - lastTouchEnd <= 300) e.preventDefault();
      lastTouchEnd = now;
    }, { passive: false });

    loadData().then(() => { parseRoute(); });
    window.addEventListener('hashchange', parseRoute);
    parseRoute();
  </script>
</body>
</html>
