<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>KENZIE PRESET LIBRARY</title>
<style>
html,body{margin:0;height:100%;background:#f2f2f7}
#boot{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;font-family:system-ui,sans-serif;color:#666;z-index:1;flex-direction:column;gap:8px}
#app{position:fixed;inset:0;border:0;width:100%;height:100%;z-index:2}
</style>
</head>
<body>
<div id="boot"><p>Memuat…</p></div>
<iframe id="app" title="Kenzie Preset" style="display:none"></iframe>
<script>
(function () {
  var ORIGIN = (location.origin && location.origin !== 'null') ? location.origin : 'https://kenzie-preset.web.id';
  var SRC = 'https://cdn.jsdelivr.net/gh/ryuze72/kenzie-preset@8ecca87960564fc0dfa0be746f29e1c002adb897/index.html';
  var boot = document.getElementById('boot');
  var frame = document.getElementById('app');

  function patch(html) {
    // Force base so relative /api and assets resolve to real site
    if (html.indexOf('<base ') < 0) {
      html = html.replace(/<head[^>]*>/i, function (m) {
        return m + '\n  <base href="' + ORIGIN + '/">';
      });
    }

    // getSiteBase always real origin (parent)
    html = html.replace(
      /function getSiteBase\(\)\s*\{[^]*?\n\s*\}/,
      "function getSiteBase(){ return '" + ORIGIN + "'; }"
    );

    // webLink = nama preset
    html = html.replace(
      "function webLink(p) { return p?.id ? getSiteBase() + '/#preset/' + p.id : getSiteBase() + '/#home'; }",
      "function presetSlug(name){return String(name||'').trim().toLowerCase().replace(/\\s+/g,'-').replace(/[^\\w\\u00C0-\\u024f\\-]+/g,'').replace(/-+/g,'-').replace(/^-|-$/g,'')||'preset';}" +
      "function webLink(p){if(!p)return getSiteBase()+'/#home';var s=presetSlug(p.name)||String(p.id||'');return getSiteBase()+'/#preset/'+encodeURIComponent(s);}"
    );

    html = html.replace(
      "if (h.startsWith('preset/')) { const id = h.slice(7).split(/[/?#]/)[0]; if (id) { navigate('detail', id); return; } }",
      "if (h.startsWith('preset/')) { let key = h.slice(7).split(/[/?#]/)[0]; try { key = decodeURIComponent(key); } catch (e) {} if (key) { navigate('detail', key); return; } }"
    );

    html = html.replace(
      "function renderDetail(id) {\n      const p = presets.find(x=>x.id===id); const el = document.getElementById('detailContent');",
      "function renderDetail(id) {\n" +
      "      var key=(function(){try{return decodeURIComponent(String(id||''));}catch(e){return String(id||'');}})();\n" +
      "      var sk=typeof presetSlug==='function'?presetSlug(key):key;\n" +
      "      var p=presets.find(function(x){return x&&(x.id===key||x.id===id||(typeof presetSlug==='function'&&presetSlug(x.name)===sk)||x.name===key);});\n" +
      "      var el=document.getElementById('detailContent');\n" +
      "      if(!p){\n" +
      "        el.innerHTML='<div class=\"empty\"><h3>Mohon tunggu beberapa detik</h3><button class=\"btn btn-primary\" style=\"margin-top:12px\" onclick=\"navigate(\\x27home\\x27)\">Kembali</button></div>';\n" +
      "        var sim=document.getElementById('similarSection'); if(sim) sim.style.display='none';\n" +
      "        if(!window.__detailRetry){\n" +
      "          window.__detailRetry=setInterval(function(){\n" +
      "            var found=presets&&presets.find(function(x){return x&&(x.id===key||x.id===id||(typeof presetSlug==='function'&&presetSlug(x.name)===sk)||x.name===key);});\n" +
      "            if(found){clearInterval(window.__detailRetry);window.__detailRetry=null;renderDetail(found.id||id);}\n" +
      "            else if(typeof loaded!=='undefined'&&loaded){clearInterval(window.__detailRetry);window.__detailRetry=null;el.innerHTML='<div class=\"empty\"><h3>Preset tidak ditemukan</h3><button class=\"btn btn-primary\" style=\"margin-top:12px\" onclick=\"navigate(\\x27home\\x27)\">Kembali</button></div>';}\n" +
      "          },200);\n" +
      "        }\n" +
      "        return;\n" +
      "      }\n" +
      "      if(window.__detailRetry){clearInterval(window.__detailRetry);window.__detailRetry=null;}\n"
    );

    // Sync hash from parent into iframe, and bubble hash changes up
    var inject = '<script>(function(){try{var h=parent.location.hash;if(h){location.hash=h;}}catch(e){}' +
      'function up(){try{parent.history.replaceState(null,"",parent.location.pathname+parent.location.search+location.hash);}catch(e){}}' +
      'window.addEventListener("hashchange",up);' +
      'var ps=history.pushState;history.pushState=function(){ps.apply(this,arguments);up();};' +
      'var rs=history.replaceState;history.replaceState=function(){rs.apply(this,arguments);up();};' +
      '})();<\/script>' +
      '<script src="' + ORIGIN + '/preset-link.js"><\/script>';
    html = html.replace('</body>', inject + '\n</body>');
    return html;
  }

  function show(html) {
    frame.style.display = 'block';
    frame.onload = function () { boot.style.display = 'none'; };
    try {
      frame.removeAttribute('src');
      frame.srcdoc = html;
    } catch (e1) {
      try {
        frame.src = URL.createObjectURL(new Blob([html], { type: 'text/html;charset=utf-8' }));
      } catch (e2) {
        document.open(); document.write(html); document.close(); return;
      }
    }
    setTimeout(function () { boot.style.display = 'none'; }, 2500);
  }

  fetch(SRC, { cache: 'no-store' }).then(function (r) {
    if (!r.ok) throw new Error('HTTP ' + r.status);
    return r.text();
  }).then(function (html) {
    if (html.length < 10000) throw new Error('konten pendek');
    show(patch(html));
  }).catch(function (e) {
    console.error(e);
    boot.innerHTML = '<p>Gagal memuat</p><p><a href="https://kenzie-preset.vercel.app/' + (location.hash || '') + '">Buka vercel.app</a></p>';
  });
})();
</script>
</body>
</html>
