  <meta name="theme-color" content="#f2f2f7" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=JetBrains+Mono:wght@600;700&family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  <style>
    /* =====================================================
       KENZIE PRESET — Liquid Glass redesign
       (fungsi / JavaScript tidak diubah)
       ===================================================== */
    :root {
      color-scheme: light;
      --bg: #f2f2f7; --bg-2: #ffffff;
      --ink: #000000; --muted: #636366;
      --g1: rgba(255,255,255,.78); --g2: rgba(255,255,255,.52);
      --edge: rgba(255,255,255,.9);
      --hair: rgba(60,60,67,.14);
      --ctl: rgba(118,118,128,.12); --ctl-edge: rgba(60,60,67,.08);
      --shadow: 0 0 0 .5px rgba(0,0,0,.05), 0 8px 24px -10px rgba(0,0,0,.18);
      --accent: #007aff; --accent-2: #007aff; --blue: var(--accent);
      --btn-a: #1a8aff; --btn-b: #007aff;
      --btn-glow: rgba(0,122,255,.38);
      --green: #1c8a38; --green-bg: rgba(52,199,89,.16);
      --red: #d70015; --red-bg: rgba(255,59,48,.12);
      --amber: #9a5a00; --amber-bg: rgba(255,159,10,.16);
      --idc: #0a5fd0; --idbg: rgba(0,122,255,.12);
      --sheet: #ffffff;
      --scrim: rgba(0,0,0,.35);
      --blob1: #5ac8fa; --blob2: #0a84ff; --blob3: #5e5ce6; --blob4: #30d5c8; --blob-o: .5;
      --c-a: #32ade6; --c-b: #0a84ff;
      --blur: 16px; --sat: 170%; --glow: 0 0 0 0 transparent;
      --ease: cubic-bezier(.2,.8,.2,1);
      --gx: 14px;
      --nav-h: 64px;
      --font: 'Plus Jakarta Sans', 'Inter', -apple-system, BlinkMacSystemFont, 'SF Pro Display', system-ui, sans-serif;
      --mono: 'JetBrains Mono', ui-monospace, SFMono-Regular, Menlo, monospace;
    }
    [data-theme="dark"] {
      color-scheme: dark;
      --bg: #000000; --bg-2: #0c0c0e;
      --ink: #ffffff; --muted: #9a9aa0;
      --g1: rgba(255,255,255,.11); --g2: rgba(255,255,255,.04);
      --edge: rgba(255,255,255,.14);
      --hair: rgba(255,255,255,.12);
      --ctl: rgba(118,118,128,.24); --ctl-edge: rgba(255,255,255,.08);
      --shadow: 0 1px 0 rgba(255,255,255,.08) inset, 0 16px 36px -16px rgba(0,0,0,.8);
      --accent: #0a84ff; --accent-2: #0a84ff;
      --btn-a: #2e94ff; --btn-b: #0a84ff;
      --btn-glow: rgba(10,132,255,.4);
      --green: #30d158; --green-bg: rgba(48,209,88,.16);
      --red: #ff453a; --red-bg: rgba(255,69,58,.16);
      --amber: #ffd60a; --amber-bg: rgba(255,214,10,.14);
      --idc: #64b0ff; --idbg: rgba(10,132,255,.2);
      --sheet: #1c1c1e;
      --scrim: rgba(0,0,0,.6);
      --blob1: #64d2ff; --blob2: #0a84ff; --blob3: #5e5ce6; --blob4: #40c8e0; --blob-o: .42;
      --c-a: #64d2ff; --c-b: #0a84ff;
    }
    /* truncated for tool limit - RESTORE FULL FROM CACHE */
  </style>
