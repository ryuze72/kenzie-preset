<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>KENZIE PRESET LIBRARY</title>
<script>
(function () {
  var TOTAL = 20;
  var v = '?v=20261016b';
  var files = [];
  for (var i = 0; i < TOTAL; i++) {
    var n = (i < 10 ? '0' : '') + i;
    files.push('/ip' + n + '.txt' + v);
  }
  function fail(e) {
    console.error(e);
    document.body.innerHTML = '<div style="font-family:system-ui;padding:24px;max-width:420px;margin:40px auto">' +
      '<h3 style="margin:0 0 8px">Gagal memuat aplikasi</h3>' +
      '<p style="color:#555">' + (e && e.message || e) + '</p>' +
      '<p><a href="https://kenzie-preset.vercel.app/">Coba vercel.app</a></p></div>';
  }
  Promise.all(files.map(function (f) {
    return fetch(f, { cache: 'no-store' }).then(function (r) {
      if (!r.ok) throw new Error(f + ' → ' + r.status);
      return r.text();
    });
  })).then(function (parts) {
    var html = parts.join('');
    if (html.length < 50000) throw new Error('Konten tidak lengkap (' + html.length + ')');
    document.open();
    document.write(html);
    document.close();
  }).catch(fail);
})();
</script>
</head>
<body style="margin:0;min-height:100vh;background:#f2f2f7;display:flex;align-items:center;justify-content:center;font-family:system-ui,sans-serif;color:#666">
  <p>Memuat…</p>
</body>
</html>
