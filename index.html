@import url('https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Space+Grotesk:wght@400;500;600;700&display=swap');
:root{--bg:#080a12;--surface:#111522;--surface2:#191f30;--border:rgba(166,180,224,.13);--border-hover:rgba(151,166,255,.48);--text:#f5f7ff;--muted:#a4adc5;--dim:#747f9d;--accent:#9b8cff;--accent-bg:rgba(155,140,255,.14);--green:#5ce1b2;--yellow:#ffd37a;--red:#ff7d9a;--r:20px;--r-sm:14px}

body:before{content:"";position:fixed;inset:0;pointer-events:none;z-index:-1;opacity:.2;background-image:radial-gradient(rgba(255,255,255,.16) .65px,transparent .65px);background-size:7px 7px;mask-image:linear-gradient(to bottom,black,transparent 75%)}
button,input,textarea,select{font:inherit}button,a{-webkit-tap-highlight-color:transparent}button{touch-action:manipulation}
.header{position:sticky;top:0;z-index:50;background:rgba(8,10,18,.78);backdrop-filter:blur(24px);-webkit-backdrop-filter:blur(24px);border-bottom:1px solid var(--border);padding:12px 18px}.header-inner{max-width:1120px;margin:0 auto;display:flex;align-items:center;gap:12px}.logo{font:700 17px 'Space Grotesk',sans-serif;letter-spacing:-.8px;cursor:pointer;white-space:nowrap;flex-shrink:0;color:#fff;text-decoration:none}.logo span{color:#a99aff}
.search-wrap{flex:1;position:relative;max-width:470px;margin-left:auto}.search-input{width:100%;background:rgba(255,255,255,.045);border:1px solid var(--border);border-radius:999px;padding:12px 40px 12px 42px;color:var(--text);font-size:16px;outline:none;transition:.2s}.search-input:focus{border-color:var(--accent);background:rgba(155,140,255,.07);box-shadow:0 0 0 4px rgba(155,140,255,.09)}.search-input::placeholder{color:var(--dim)}.search-icon{position:absolute;left:15px;top:50%;transform:translateY(-50%);color:var(--dim);pointer-events:none}.clear-btn{position:absolute;right:12px;top:50%;transform:translateY(-50%);background:none;border:0;color:var(--muted);cursor:pointer;font-size:16px;display:none;padding:5px}.clear-btn.show{display:block}
.icon-btn{width:44px;height:44px;border-radius:50%;background:rgba(255,255,255,.045);border:1px solid var(--border);color:var(--muted);display:grid;place-items:center;cursor:pointer;flex-shrink:0;transition:.2s}.icon-btn:hover,.icon-btn:focus-visible{border-color:var(--border-hover);color:#fff;background:var(--accent-bg)}
.container{max-width:1120px;margin:0 auto;padding:22px 18px 110px}.stats{display:inline-flex;align-items:center;gap:7px;background:rgba(155,140,255,.1);border:1px solid rgba(155,140,255,.22);border-radius:999px;padding:7px 13px;font-size:12px;color:#d4ceff;margin-bottom:18px}.stats b{color:#b8adff;font-weight:700}
.cats{display:flex;flex-wrap:wrap;gap:8px;overflow:visible;margin-bottom:24px;padding:2px 0 4px;scrollbar-width:none}.cats::-webkit-scrollbar{display:none}.cat{flex:1 1 auto;padding:9px 17px;border-radius:999px;border:1px solid var(--border);background:rgba(255,255,255,.035);color:var(--muted);font-size:12px;font-weight:600;cursor:pointer;white-space:nowrap;transition:.2s;text-align:center;min-width:calc(33.333% - 8px)}.cat.active{background:linear-gradient(135deg,#a99aff,#7869e8);border-color:transparent;color:#fff;box-shadow:0 6px 20px rgba(130,109,255,.25)}.cat:not(.active):hover{border-color:var(--border-hover);color:#fff;background:rgba(255,255,255,.07)}
.section{margin-bottom:34px}.section-title{font:700 17px 'Space Grotesk',sans-serif;color:#f5f6ff;margin-bottom:15px;letter-spacing:-.35px;display:flex;align-items:center;gap:10px}.section-title:before{content:"";width:4px;height:19px;border-radius:99px;background:linear-gradient(#b5a8ff,#6dcbff);display:block}
.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:13px}@media(min-width:560px){.grid{grid-template-columns:repeat(3,minmax(0,1fr));gap:16px}}@media(min-width:850px){.grid{grid-template-columns:repeat(4,minmax(0,1fr));gap:18px}}
.card{background:linear-gradient(145deg,rgba(22,27,44,.96),rgba(13,17,29,.98));border:1px solid var(--border);border-radius:20px;overflow:hidden;cursor:pointer;transition:transform .24s,border-color .24s,box-shadow .24s;min-width:0;box-shadow:0 8px 24px rgba(0,0,0,.12)}.card:hover{border-color:var(--border-hover);transform:translateY(-4px);box-shadow:0 18px 36px rgba(0,0,0,.25),0 0 0 1px rgba(155,140,255,.06)}
.card-thumb{aspect-ratio:16/11;background:linear-gradient(135deg,#25213f,#152638);position:relative;overflow:hidden}.card-thumb:after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,rgba(5,7,15,.04) 35%,rgba(5,7,15,.68));pointer-events:none}.card-thumb img{width:100%;height:100%;object-fit:cover;transition:transform .5s}.card:hover .card-thumb img{transform:scale(1.055)}.card-thumb-ph{width:100%;height:100%;display:grid;place-items:center;font-size:38px;opacity:.62;background:radial-gradient(circle at 30% 25%,rgba(169,154,255,.25),transparent 45%),linear-gradient(135deg,#1d2037,#12232d)}
.card-badge{position:absolute;top:10px;left:10px;z-index:2;background:rgba(9,11,21,.72);backdrop-filter:blur(12px);border:1px solid rgba(255,255,255,.14);border-radius:999px;padding:4px 9px;font-size:10px;font-weight:700;color:#d4ccff}.card-fav{position:absolute;top:9px;right:9px;z-index:3;width:33px;height:33px;border-radius:50%;background:rgba(9,11,21,.68);backdrop-filter:blur(10px);border:1px solid rgba(255,255,255,.15);color:#fff;display:grid;place-items:center;cursor:pointer;font-size:13px}
.card-body{padding:13px 13px 14px}.card-id{display:inline-block;font:600 10px ui-monospace,monospace;color:#b9afff;background:rgba(155,140,255,.12);border:1px solid rgba(155,140,255,.16);border-radius:6px;padding:3px 7px;margin-bottom:7px}.card-wait{display:inline-block;margin-left:4px;font-size:9px;font-weight:700;color:var(--yellow);background:rgba(255,211,122,.1);border:1px solid rgba(255,211,122,.16);border-radius:999px;padding:3px 7px}.card-title{font-size:13px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;letter-spacing:-.1px}.card-meta{font-size:11px;color:var(--dim);margin:3px 0 12px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.card-actions{display:flex;gap:7px}
.btn-sm{flex:1;min-width:0;padding:8px 5px;border-radius:999px;border:1px solid var(--border);background:rgba(255,255,255,.035);color:var(--muted);font-size:11px;font-weight:700;cursor:pointer;text-align:center;text-decoration:none;display:flex;align-items:center;justify-content:center;transition:.2s}.btn-sm:hover{border-color:var(--border-hover);color:#fff}.btn-sm.primary{background:linear-gradient(135deg,#a99aff,#7668e8);border-color:transparent;color:white;box-shadow:0 4px 12px rgba(126,105,239,.18)}.btn-sm.primary:hover{filter:brightness(1.08)}.btn-sm:disabled{opacity:.35;pointer-events:none}
.empty{text-align:center;padding:42px 16px;color:var(--dim);background:rgba(255,255,255,.025);border:1px dashed var(--border);border-radius:18px}.empty h3{color:var(--muted);font-size:14px;margin-bottom:4px}.page{display:none}.page.active{display:block;animation:pageIn .28s ease both}@keyframes pageIn{from{opacity:0;transform:translateY(7px)}to{opacity:1;transform:translateY(0)}}
.back{display:inline-flex;align-items:center;gap:7px;background:rgba(255,255,255,.045);border:1px solid var(--border);border-radius:999px;padding:10px 16px;color:var(--muted);font-size:12px;font-weight:700;cursor:pointer;margin-bottom:22px;transition:.2s}.back:hover{border-color:var(--border-hover);color:#fff}
.detail-layout{display:grid;gap:24px;align-items:start}@media(min-width:700px){.detail-layout{grid-template-columns:minmax(0,1.05fr) minmax(0,1fr);gap:32px}}.detail-thumb{border-radius:24px;overflow:hidden;border:1px solid var(--border);aspect-ratio:16/11;background:var(--surface);box-shadow:0 18px 50px rgba(0,0,0,.25)}.detail-thumb img{width:100%;height:100%;object-fit:cover}.detail-info{padding:2px 0}.detail-info h1{font:700 clamp(24px,4vw,34px) 'Space Grotesk',sans-serif;letter-spacing:-1px;margin-bottom:12px;line-height:1.15}.detail-id{display:inline-block;font:700 12px ui-monospace,monospace;color:#c4bbff;background:var(--accent-bg);border:1px solid rgba(155,140,255,.18);border-radius:999px;padding:6px 12px;margin-bottom:15px;cursor:pointer}.detail-meta{display:flex;flex-wrap:wrap;gap:7px;margin-bottom:16px}.chip{background:rgba(255,255,255,.04);border:1px solid var(--border);border-radius:999px;padding:6px 10px;font-size:11px;color:var(--dim)}.chip b{color:var(--muted);font-weight:700}.detail-desc{color:var(--muted);font-size:14px;margin-bottom:20px;line-height:1.8}.detail-actions{display:flex;flex-wrap:wrap;gap:9px;margin-bottom:18px}
.btn{padding:11px 17px;border-radius:999px;border:1px solid transparent;font-size:12px;font-weight:700;cursor:pointer;display:inline-flex;align-items:center;justify-content:center;gap:7px;text-decoration:none;transition:transform .2s,filter .2s}.btn:active,.icon-btn:active,.cat:active{transform:scale(.97)}.btn-primary{background:linear-gradient(135deg,#a99aff,#7668e8);color:#fff;box-shadow:0 7px 20px rgba(126,105,239,.2)}.btn-primary:hover{filter:brightness(1.08)}.btn-outline{background:rgba(255,255,255,.045);border-color:var(--border);color:var(--muted)}.btn-outline:hover{border-color:var(--border-hover);color:#fff}.btn:disabled{opacity:.35;pointer-events:none}.warn{background:rgba(255,211,122,.08);border:1px solid rgba(255,211,122,.2);color:var(--yellow);padding:12px 14px;border-radius:14px;font-size:12px;margin-bottom:15px}
.link-label{font-size:11px;font-weight:700;color:var(--dim);margin-bottom:6px}.link-box{display:flex;align-items:center;gap:8px;background:rgba(255,255,255,.035);border:1px solid var(--border);border-radius:14px;padding:8px 8px 8px 13px;margin-bottom:13px}.link-box code{flex:1;min-width:0;font-size:11px;color:#b9afff;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.login-box{max-width:400px;margin:48px auto;background:linear-gradient(145deg,rgba(22,27,44,.98),rgba(13,17,29,.98));border:1px solid var(--border);border-radius:26px;padding:30px 23px;text-align:center;box-shadow:0 24px 70px rgba(0,0,0,.25)}.login-box h2{font:700 24px 'Space Grotesk',sans-serif;margin-bottom:7px}.login-box p{color:var(--dim);font-size:12px;margin-bottom:22px}.form-group{margin-bottom:15px;text-align:left}.form-group label{display:block;font-size:12px;font-weight:700;margin-bottom:7px;color:var(--muted)}.form-input,.form-select{width:100%;background:#0b0e18;border:1px solid var(--border);border-radius:13px;padding:12px 14px;color:var(--text);font-size:16px;outline:none;transition:.2s}.form-input:focus,.form-select:focus{border-color:var(--accent);box-shadow:0 0 0 3px rgba(155,140,255,.1)}textarea.form-input{resize:vertical;min-height:80px}.form-hint{font-size:11px;color:var(--dim);margin-top:5px}.admin-header{display:flex;align-items:center;justify-content:space-between;margin-bottom:16px;flex-wrap:wrap;gap:10px}.admin-header h2{font:700 22px 'Space Grotesk',sans-serif}.table-wrap{overflow-x:auto;border:1px solid var(--border);border-radius:18px;background:rgba(255,255,255,.02)}table{width:100%;border-collapse:collapse;font-size:12px}th,td{padding:13px 14px;text-align:left;border-bottom:1px solid var(--border)}th{background:rgba(255,255,255,.04);font-weight:700;color:var(--dim);white-space:nowrap}tr:last-child td{border-bottom:none}.actions{display:flex;gap:5px;flex-wrap:wrap}.btn-xs{padding:7px 10px;border-radius:999px;border:1px solid var(--border);background:rgba(255,255,255,.04);color:var(--muted);font-size:11px;font-weight:700;cursor:pointer}.btn-xs.fill{background:var(--accent);border-color:var(--accent);color:#fff}.btn-xs.danger{color:var(--red);border-color:rgba(255,125,154,.25)}.status{display:inline-block;font-size:10px;font-weight:700;border-radius:999px;padding:4px 9px}.status.ok{color:var(--green);background:rgba(92,225,178,.1)}.status.wait{color:var(--yellow);background:rgba(255,211,122,.1)}.check-row{display:flex;align-items:center;gap:8px;margin-bottom:9px;font-size:13px}.check-row input{accent-color:var(--accent)}
.overlay{position:fixed;inset:0;background:rgba(3,5,12,.76);backdrop-filter:blur(12px);z-index:100;display:none;align-items:center;justify-content:center;padding:16px}.overlay.show{display:flex}.modal{background:#111522;border:1px solid rgba(166,180,224,.2);border-radius:24px;width:100%;max-width:480px;max-height:88vh;overflow-y:auto;padding:23px;box-shadow:0 30px 100px rgba(0,0,0,.5)}.modal h3{font:700 20px 'Space Grotesk',sans-serif;margin-bottom:20px}.modal-actions{display:flex;gap:8px;justify-content:flex-end;margin-top:18px}
.toasts{position:fixed;bottom:95px;left:50%;transform:translateX(-50%);z-index:200;display:flex;flex-direction:column;gap:8px;pointer-events:none;width:max-content;max-width:calc(100vw - 30px)}.toast{background:#171c2b;border:1px solid rgba(166,180,224,.2);border-radius:999px;padding:11px 17px;font-size:12px;font-weight:700;box-shadow:0 12px 36px rgba(0,0,0,.35);text-align:center}.toast.ok{color:var(--green)}.toast.err{color:var(--red)}
.bottom-nav{position:fixed;bottom:0;left:0;right:0;background:rgba(10,12,21,.84);backdrop-filter:blur(24px);-webkit-backdrop-filter:blur(24px);border-top:1px solid var(--border);display:flex;justify-content:space-around;padding:8px 8px calc(8px + env(safe-area-inset-bottom));z-index:50}.nav-item{display:flex;flex-direction:column;align-items:center;gap:4px;background:none;border:0;color:var(--dim);font-size:10px;font-weight:700;cursor:pointer;padding:7px 16px;border-radius:999px;min-width:64px}.nav-item.active{color:#c5bcff;background:rgba(155,140,255,.12)}.nav-item svg{width:20px;height:20px}.load-more{display:flex;justify-content:center;margin-top:18px}
@media(min-width:640px){.bottom-nav{display:none}.container{padding-bottom:40px}.toasts{bottom:24px}}@media(max-width:420px){body{font-size:13px}.header{padding:9px 12px}.header-inner{gap:7px}.logo{font-size:14px}.search-input{padding:11px 32px 11px 36px}.icon-btn{width:39px;height:39px}.container{padding:16px 14px 105px}.grid{gap:11px}.card{border-radius:16px}.card-body{padding:10px}.card-title{font-size:12px}.card-meta{font-size:10px;margin-bottom:10px}.btn-sm{font-size:10px;padding:8px 3px}.cats{margin-bottom:23px}.section{margin-bottom:28px}}@media(prefers-reduced-motion:reduce){*,*:before,*:after{scroll-behavior:auto!important;animation-duration:.01ms!important;transition-duration:.01ms!important}}

/* Mobile viewport and readable standard sizing */
html,body{width:100%;max-width:100%;overflow-x:hidden;-webkit-text-size-adjust:100%;text-size-adjust:100%}
body{font-size:15px}
input,textarea,select,button{font-size:16px}
@media(max-width:700px){
 .header{padding:12px 14px}.header-inner{width:100%;gap:9px;flex-wrap:wrap}
 .logo{font-size:18px}.search-wrap{order:3;flex-basis:100%;max-width:none;margin:2px 0 0}

 .detail-layout{grid-template-columns:minmax(0,1fr)!important;gap:20px;min-width:0}
 .detail-thumb{width:100%;aspect-ratio:16/10;min-width:0}
 .detail-info{min-width:0;width:100%}.detail-info h1{font-size:27px;overflow-wrap:anywhere}
 .link-box{width:100%;min-width:0;gap:8px}.link-box code{min-width:0;white-space:normal;overflow-wrap:anywhere;word-break:break-word;font-size:13px}
 .detail-actions{gap:8px}.detail-actions .btn{flex:1 1 auto;min-height:44px;font-size:13px;padding:12px 14px}
 .chip{font-size:12px}.detail-desc{font-size:15px}

 .table-wrap{max-width:100%;overflow-x:auto}
}
@media(max-width:360px){.grid{gap:9px}.card-body{padding:10px 8px}.card-actions{gap:5px}.btn-sm{font-size:11px}}

<style>

<body>
  <header class="header">
    <div class="header-inner">
      <a class="logo" onclick="navigate('home')">RYUZE <span>PRESET</span></a>
      <div class="search-wrap">
        <svg class="search-icon" width="15" height="15" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.3-4.3"/></svg>
        <input class="search-input" id="searchInput" placeholder="Cari preset..." autocomplete="off" />
        <button class="clear-btn" id="clearSearch" onclick="clearSearch()">✕</button>
      </div>
      <button class="icon-btn" onclick="navigate('favorites')" title="Favorit">
        <svg width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M20.84 4.61a5.5 5.5 0 0 0-7.78 0L12 5.67l-1.06-1.06a5.5 5.5 0 0 0-7.78 7.78l1.06 1.06L12 21.23l7.78-7.78 1.06-1.06a5.5 5.5 0 0 0 0-7.78z"/></svg>
      </button>
      <button class="icon-btn" onclick="navigate('admin')" title="Admin">
        <svg width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83-2.83l.06-.06A1.65 1.65 0 0 0 4.68 15a1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 2.83-2.83l.06.06A1.65 1.65 0 0 0 9 4.68a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 2.83l-.06.06A1.65 1.65 0 0 0 19.4 9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg>
      </button>
    </div>
  </header>

  <div class="page active" id="homePage">
    <div class="container">
      <div class="stats"><b id="totalCount">0</b> preset</div>
      <div class="cats" id="catBar" aria-label="Navigasi preset">
        <button class="cat active" data-cat="All">Semua</button>
        <button class="cat" data-cat="Trending">Trending</button>
        <button class="cat" data-cat="Latest">Terbaru</button>
        <button class="cat" data-cat="Popular">Populer</button>
        <button class="cat" data-cat="XML">XML</button>
        <button class="cat" data-cat="PRESET5MB">PRESET 5MB</button>
      </div>
      <div id="searchResults" style="display:none">
        <div class="section">
          <div class="section-title">Hasil pencarian</div>
          <div class="grid" id="searchGrid"></div>
          <div class="empty" id="searchEmpty" style="display:none"><h3>Tidak ditemukan</h3></div>
        </div>
      </div>
      <div id="mainSections">
        <div class="section"><div class="section-title">Trending</div><div class="grid" id="gridTrending"></div></div>
        <div class="section"><div class="section-title">Terbaru</div><div class="grid" id="gridLatest"></div></div>
        <div class="section"><div class="section-title">Populer</div><div class="grid" id="gridPopular"></div></div>
        <div class="section">
          <div class="section-title">Semua</div>
          <div class="grid" id="gridAll"></div>
          <div class="load-more" id="loadMoreWrap" style="display:none">
            <button class="btn btn-outline" onclick="loadMore()">Muat lebih banyak</button>
          </div>
        </div>
      </div>
    </div>
  </div>

  <div class="toasts" id="toastContainer"></div>

  <div class="overlay" id="presetModal">
    <div class="modal">
      <h3 id="modalTitle">Upload Preset</h3>
      <input type="hidden" id="editId" />
      <div class="form-group"><label>Nama *</label><input class="form-input" id="fName" /></div>
      <div class="form-group"><label>Kreator *</label><input class="form-input" id="fCreator" /></div>
      <div class="form-group"><label>Deskripsi</label><textarea class="form-input" id="fDesc"></textarea></div>
      <div class="form-group"><label>Link Alight Motion (opsional)</label><input class="form-input" id="fLink" placeholder="https://alightcreative.com/am/share/..." /><div class="form-hint">Bisa diisi nanti</div></div>
      <div class="form-group"><label>Thumbnail URL</label><input class="form-input" id="fThumb" /></div>
      <div class="form-group xml-link-group"><label>XML</label><input class="form-input xml-link-input" id="fXmlUrl" type="url" placeholder="https://drive.google.com/file/d/1eNEBRwIPBbsDAicunPmgCZZlAFzbx7W0/view?usp=drivesdk" /></div>
      <div class="check-row"><input type="checkbox" id="fTrending" /><label for="fTrending">Trending</label></div>
      <div class="check-row"><input type="checkbox" id="fPopular" /><label for="fPopular">Populer</label></div>
      <div class="modal-actions">
        <button class="btn btn-outline" onclick="closeModal()">Batal</button>
        <button class="btn btn-primary" onclick="savePreset()">Simpan</button>

  </div>

  <div class="overlay" id="linkModal">
    <div class="modal">
      <h3>Isi Link Share</h3>
      <input type="hidden" id="linkEditId" />
      <p id="linkModalName" style="color:var(--dim);font-size:12px;margin-bottom:12px"></p>
      <div class="form-group"><label>Link Share Alight Motion *</label><input class="form-input" id="fLinkOnly" placeholder="https://alightcreative.com/am/share/..." /></div>
      <div class="modal-actions">
        <button class="btn btn-outline" onclick="closeLinkModal()">Batal</button>
        <button class="btn btn-primary" onclick="saveLink()">Simpan</button>
      </div>
    </div>
  </div>

  <script>
    const FAV_KEY='ryuze_favs_v1',HISTORY_KEY='ryuze_history_v1',ADMIN_KEY='ryuze_admin_ok',LOCAL_KEY='ryuze_presets_v2',ADMIN_PASS='ryuze';
    const SITE_URL='https://kenzie-preset.vercel.app';
    const DEFAULT_XML_URL='https://drive.google.com/file/d/1eNEBRwIPBbsDAicunPmgCZZlAFzbx7W0/view?usp=drivesdk';
    function getSiteBase(){if((location.protocol==='http:'||location.protocol==='https:')&&location.hostname!=='localhost'&&location.hostname!=='127.0.0.1')return location.origin;return SITE_URL;}
    function webLink(p){if(!p||!p.id)return getSiteBase()+'/#home';return getSiteBase()+'/#preset/'+p.id;}
    const SHARE_RE=/^https?:\/\/(www\.)?alightcreative\.com\/am\/share\/\S+$/i;
    function isShareLink(u){return SHARE_RE.test((u||'').trim());}
    const SHARE_ERR='Harus link share Alight Motion';

    let presets=[],favorites=[],currentCat='All',searchQuery='',allPage=1;
    const PAGE_SIZE=12;let isAdmin=false,currentPage='home',currentId=null,delArm=null,delTimer=null;

    function lsGet(k){try{return localStorage.getItem(k);}catch{return null;}}
    function lsSet(k,v){try{localStorage.setItem(k,v);}catch{}}
    function lsDel(k){try{localStorage.removeItem(k);}catch{}}
    function loadData(){try{presets=JSON.parse(lsGet(LOCAL_KEY)||'[]').map(p=>({...p,category:'XML',xmlUrl:p.xmlUrl||''}));}catch{presets=[];}try{favorites=JSON.parse(lsGet(FAV_KEY)||'[]');}catch{favorites=[];}isAdmin=lsGet(ADMIN_KEY)==='1';}
    function saveData(){lsSet(LOCAL_KEY,JSON.stringify(presets));}
    function saveFavs(){lsSet(FAV_KEY,JSON.stringify(favorites));}
    function nextId(){const n=presets.map(p=>parseInt((p.id||'').replace('RYZ-',''),10)||0);return 'RYZ-'+String((n.length?Math.max(...n):0)+1).padStart(3,'0');}
    function setHash(h){try{history.replaceState(null,'',h);}catch{}}

    function navigate(page,id){
      window.scrollTo(0,0);currentPage=page;currentId=id||null;
      document.querySelectorAll('.page').forEach(p=>p.classList.remove('active'));
      document.querySelectorAll('.nav-item').forEach(n=>n.classList.remove('active'));
      if(page==='home'){document.getElementById('homePage').classList.add('active');setHash('#home');document.querySelector('.nav-item[data-page="home"]')?.classList.add('active');renderHome();}
      else if(page==='detail'&&id){document.getElementById('detailPage').classList.add('active');setHash('#preset/'+id);renderDetail(id);addHistory(id);}
      else if(page==='favorites'){document.getElementById('favPage').classList.add('active');setHash('#favorit');document.querySelector('.nav-item[data-page="favorites"]')?.classList.add('active');renderFavorites();}
      else if(page==='admin'){document.getElementById('adminPage').classList.add('active');setHash('#admin');document.querySelector('.nav-item[data-page="admin"]')?.classList.add('active');if(isAdmin)showAdminPanel();else showAdminLogin();}
    }
    function parseRoute(){
      const h=(location.hash||'#home').slice(1);
      if(h.startsWith('preset/')){const id=h.slice(7).split(/[/?#]/)[0];if(id){navigate('detail',id);return;}}
      if(/^RYZ-\d+/i.test(h)){navigate('detail',h.split(/[/?#]/)[0].toUpperCase());return;}
      if(h==='favorit'||h==='favorites')navigate('favorites');
      else if(h==='admin')navigate('admin');else navigate('home');
    }
    function none(m){return '<div class="empty" style="grid-column:1/-1"><p>'+m+'</p></div>';}
    function getFiltered(){
      let list=[...presets];
      if(currentCat==='XML')list=list.filter(p=>!!p.xmlUrl);else if(currentCat==='PRESET5MB')list=list.filter(p=>!!p.link);else if(currentCat==='Trending')list=list.filter(p=>p.trending);else if(currentCat==='Popular')list=list.filter(p=>p.popular);else if(currentCat==='Latest')list.sort((a,b)=>(b.date||'').localeCompare(a.date||''));
      if(searchQuery){const q=searchQuery.toLowerCase();list=list.filter(p=>(p.name||'').toLowerCase().includes(q)||(p.creator||'').toLowerCase().includes(q)||(p.category||'').toLowerCase().includes(q)||(p.id||'').toLowerCase().includes(q)||(p.description||'').toLowerCase().includes(q));}
      return list;
    }
    function cardHTML(p){
      const isFav=favorites.includes(p.id);
      const thumb=p.thumb?`<img src="${esc(p.thumb)}" alt="" loading="lazy" onerror="this.parentElement.innerHTML='<div class=\\'card-thumb-ph\\'>🎬</div>'"/>`:`<div class="card-thumb-ph">🎬</div>`;
      return `<div class="card"><div class="card-thumb" onclick="navigate('detail','${p.id}')">${thumb}<span class="card-badge">${currentCat==='XML'?'XML':(currentCat==='PRESET5MB'?'PRESET 5MB':(p.link?'PRESET 5MB':'XML'))}</span><button class="card-fav" onclick="event.stopPropagation();toggleFav('${p.id}')">${isFav?'❤️':'🤍'}</button></div><div class="card-body"><span class="card-id" onclick="event.stopPropagation();navigate('detail','${p.id}')">${p.id}</span>${p.link?'':'<span class="card-wait">menunggu</span>'}<div class="card-title" onclick="navigate('detail','${p.id}')">${esc(p.name)}</div><div class="card-meta">${esc(p.creator)}</div><div class="card-actions"><button class="btn-sm" onclick="event.stopPropagation();copyWebLink('${p.id}')">Salin</button>${currentCat==='XML'?(p.xmlUrl?`<a class="btn-sm primary" href="${esc(p.xmlUrl)}" target="_blank" rel="noopener" onclick="event.stopPropagation()">Buka XML</a>`:'<button class="btn-sm primary" disabled>XML</button>'):(p.link?`<a class="btn-sm primary" href="${esc(p.link)}" rel="noopener" onclick="event.stopPropagation()">Impor</a>`:'<button class="btn-sm primary" disabled>Belum ada link</button>')}</div></div></div>`;
    }
    function renderHome(){
      document.getElementById('totalCount').textContent=presets.length;
      if(searchQuery){document.getElementById('searchResults').style.display='block';document.getElementById('mainSections').style.display='none';const list=getFiltered();const g=document.getElementById('searchGrid'),e=document.getElementById('searchEmpty');if(!list.length){g.innerHTML='';e.style.display='block';}else{e.style.display='none';g.innerHTML=list.map(cardHTML).join('');}return;}
      document.getElementById('searchResults').style.display='none';document.getElementById('mainSections').style.display='block';
      const base=[...presets],tr=base.filter(p=>p.trending),po=base.filter(p=>p.popular),la=[...base].sort((a,b)=>(b.date||'').localeCompare(a.date||''));
      const main=document.getElementById('mainSections');
      const sections=[...main.querySelectorAll('.section')];
      sections.forEach(x=>x.style.display='block');
      if(currentCat==='Trending'){sections.forEach((x,i)=>x.style.display=i===0?'block':'none');document.getElementById('gridTrending').innerHTML=tr.map(cardHTML).join('')||none('Belum ada preset trending');}
      else if(currentCat==='Latest'){sections.forEach((x,i)=>x.style.display=i===1?'block':'none');document.getElementById('gridLatest').innerHTML=la.map(cardHTML).join('')||none('Belum ada preset');}
      else if(currentCat==='Popular'){sections.forEach((x,i)=>x.style.display=i===2?'block':'none');document.getElementById('gridPopular').innerHTML=po.map(cardHTML).join('')||none('Belum ada preset populer');}
      else {document.getElementById('gridTrending').innerHTML=tr.length?tr.map(cardHTML).join(''):none('Kosong');document.getElementById('gridLatest').innerHTML=la.slice(0,8).map(cardHTML).join('')||none('Belum ada preset');document.getElementById('gridPopular').innerHTML=po.length?po.map(cardHTML).join(''):none('Kosong');allPage=1;renderAllGrid(getFiltered());}
    }
    function renderAllGrid(list){document.getElementById('gridAll').innerHTML=list.slice(0,allPage*PAGE_SIZE).map(cardHTML).join('')||none('Belum ada preset');document.getElementById('loadMoreWrap').style.display=list.length>allPage*PAGE_SIZE?'flex':'none';}
    function loadMore(){allPage++;renderAllGrid(getFiltered());}
    function renderDetail(id){
      const p=presets.find(x=>x.id===id);const el=document.getElementById('detailContent');
      if(!p){el.innerHTML=`<div class="empty"><h3>Tidak ditemukan</h3><button class="btn btn-primary" style="margin-top:12px" onclick="navigate('home')">Kembali</button></div>`;document.getElementById('similarSection').style.display='none';return;}
      document.getElementById('similarSection').style.display='block';document.title=p.name+' · RYUZE';
      const isFav=favorites.includes(p.id);
      const thumb=p.thumb?`<img src="${esc(p.thumb)}" alt=""/>`:`<div style="width:100%;height:100%;display:grid;place-items:center;font-size:48px;opacity:.2">🎬</div>`;
      el.innerHTML=`<div class="detail-thumb">${thumb}</div><div class="detail-info"><h1>${esc(p.name)}</h1><div class="detail-id" onclick="copyWebLink('${p.id}')">${p.id}</div><div class="detail-meta"><span class="chip"><b>Kreator</b> ${esc(p.creator)}</span>${p.xmlUrl?'<span class="chip"><b>XML</b> Google Drive</span>':''}${p.link?'<span class="chip">PRESET 5MB</span>':''}<span class="chip"><b>Upload</b> ${esc(p.date||'-')}</span></div><div class="link-label">Link web</div><div class="link-box"><code>${esc(webLink(p))}</code><button class="btn-sm" style="flex:none;padding:4px 10px" onclick="copyWebLink('${p.id}')">Salin</button></div>${p.link?`<div class="link-label">Link Alight Motion</div><div class="link-box"><code>${esc(p.link)}</code><button class="btn-sm" style="flex:none;padding:4px 10px" onclick="copyAlightLink('${p.id}')">Salin</button></div>`:'<div class="warn">⏳ Menunggu link share Alight Motion</div>'}<p class="detail-desc">${esc(p.description||'Tidak ada deskripsi.')}</p><div class="detail-actions">${p.link?`<a class="btn btn-primary" href="${esc(p.link)}" rel="noopener">Impor ke Alight Motion</a>`:'<button class="btn btn-primary" disabled>Buka di Alight Motion</button>'}<button class="btn btn-outline" ${p.link?'':'disabled'} onclick="copyAlightLink('${p.id}')">Salin Share</button><button class="btn btn-outline" onclick="copyWebLink('${p.id}')">Salin Web</button>${p.xmlUrl?`<button class="btn btn-outline" onclick="copyXMLLink('${p.id}')">Salin XML</button><a class="btn btn-outline" href="${esc(p.xmlUrl)}" target="_blank" rel="noopener">Buka XML</a>`:''}<button class="btn btn-outline" onclick="sharePreset('${p.id}')">Bagikan</button><button class="btn btn-outline" onclick="toggleFav('${p.id}');renderDetail('${p.id}')">${isFav?'❤️':'🤍'} Favorit</button></div></div>`;
      const sim=presets.filter(x=>x.id!==p.id).slice(0,4);
      document.getElementById('gridSimilar').innerHTML=sim.length?sim.map(cardHTML).join(''):'<p style="color:var(--dim);font-size:12px">Tidak ada</p>';
    }
    function renderFavorites(){const list=presets.filter(p=>favorites.includes(p.id));const g=document.getElementById('gridFav'),e=document.getElementById('favEmpty');if(!list.length){g.innerHTML='';e.style.display='block';}else{e.style.display='none';g.innerHTML=list.map(cardHTML).join('');}}
    function copyText(text,msg){const fb=()=>{try{const ta=document.createElement('textarea');ta.value=text;document.body.appendChild(ta);ta.select();document.execCommand('copy');document.body.removeChild(ta);toast(msg,'ok');}catch{toast('Gagal','err');}};if(navigator.clipboard?.writeText)navigator.clipboard.writeText(text).then(()=>toast(msg,'ok')).catch(fb);else fb();}
    function copyWebLink(id){const p=presets.find(x=>x.id===id);if(!p)return;copyText(webLink(p),'Link web disalin!');}
    function copyAlightLink(id){const p=presets.find(x=>x.id===id);if(!p?.link){toast('Link belum diisi','err');return;}copyText(p.link,'Link share disalin!');}
    function sharePreset(id){const p=presets.find(x=>x.id===id);if(!p)return;const url=webLink(p),text=`${p.name} (${p.id})\n${url}`;if(navigator.share)navigator.share({title:p.name,text,url}).catch(()=>copyText(text,'Disalin!'));else copyText(text,'Disalin!');}
    function toggleFav(id){const i=favorites.indexOf(id);if(i>=0)favorites.splice(i,1);else favorites.push(id);saveFavs();toast(i>=0?'Dihapus dari favorit':'Ditambah ke favorit','ok');if(currentPage==='home')renderHome();else if(currentPage==='favorites')renderFavorites();}
    function addHistory(id){let h=[];try{h=JSON.parse(lsGet(HISTORY_KEY)||'[]');}catch{}h=h.filter(x=>x!==id);h.unshift(id);lsSet(HISTORY_KEY,JSON.stringify(h.slice(0,20)));}

    document.getElementById('searchInput').addEventListener('input',e=>{searchQuery=e.target.value.trim();document.getElementById('clearSearch').classList.toggle('show',!!searchQuery);if(document.getElementById('homePage').classList.contains('active'))renderHome();else navigate('home');});
    function clearSearch(){searchQuery='';document.getElementById('searchInput').value='';document.getElementById('clearSearch').classList.remove('show');renderHome();}
    document.getElementById('catBar').addEventListener('click',e=>{const btn=e.target.closest('.cat');if(!btn)return;document.querySelectorAll('.cat').forEach(b=>b.classList.remove('active'));btn.classList.add('active');currentCat=btn.dataset.cat;renderHome();});

    function showAdminLogin(){document.getElementById('adminLogin').style.display='block';document.getElementById('adminPanel').style.display='none';}
    function showAdminPanel(){document.getElementById('adminLogin').style.display='none';document.getElementById('adminPanel').style.display='block';renderAdminTable();}
    function adminLogin(){if(document.getElementById('adminPass').value===ADMIN_PASS){isAdmin=true;lsSet(ADMIN_KEY,'1');showAdminPanel();toast('Login OK','ok');}else toast('Password salah','err');}
    function adminLogout(){isAdmin=false;lsDel(ADMIN_KEY);showAdminLogin();toast('Logout','ok');}
    function askDelete(id){clearTimeout(delTimer);if(delArm===id){delArm=null;deletePreset(id);return;}delArm=id;renderAdminTable();delTimer=setTimeout(()=>{delArm=null;renderAdminTable();},3000);}
    function renderAdminTable(){document.getElementById('adminTableBody').innerHTML=presets.map(p=>`<tr><td><code style="color:var(--accent)">${p.id}</code></td><td>${esc(p.name)}</td><td>${esc(p.creator)}</td><td>XML · PRESET 5MB</td><td>${p.link?'<span class="status ok">Siap</span>':'<span class="status wait">Wait</span>'}</td><td>${p.trending?'✓':'—'}</td><td>${p.popular?'✓':'—'}</td><td class="actions"><button class="btn-xs ${p.link?'':'fill'}" onclick="openLinkModal('${p.id}')">${p.link?'Ubah':'Isi Link'}</button><button class="btn-xs" onclick="openEditModal('${p.id}')">Edit</button><button class="btn-xs danger" onclick="askDelete('${p.id}')">${delArm===p.id?'Yakin?':'Hapus'}</button></td></tr>`).join('');}
    function openAddModal(){document.getElementById('modalTitle').textContent='Upload Preset';document.getElementById('editId').value='';['fName','fCreator','fDesc','fLink','fThumb'].forEach(id=>document.getElementById(id).value='');document.getElementById('fXmlUrl').value='';document.getElementById('fTrending').checked=false;document.getElementById('fPopular').checked=false;document.getElementById('presetModal').classList.add('show');}
    function openEditModal(id){const p=presets.find(x=>x.id===id);if(!p)return;document.getElementById('modalTitle').textContent='Edit Preset';document.getElementById('editId').value=id;document.getElementById('fName').value=p.name||'';document.getElementById('fCreator').value=p.creator||'';document.getElementById('fDesc').value=p.description||'';document.getElementById('fLink').value=p.link||'';document.getElementById('fThumb').value=p.thumb||'';document.getElementById('fXmlUrl').value=p.xmlUrl||'';document.getElementById('fTrending').checked=!!p.trending;document.getElementById('fPopular').checked=!!p.popular;document.getElementById('presetModal').classList.add('show');}
    function closeModal(){document.getElementById('presetModal').classList.remove('show');}
    function openLinkModal(id){const p=presets.find(x=>x.id===id);if(!p)return;document.getElementById('linkEditId').value=id;document.getElementById('linkModalName').textContent=p.id+' · '+p.name;document.getElementById('fLinkOnly').value=p.link||'';document.getElementById('linkModal').classList.add('show');setTimeout(()=>document.getElementById('fLinkOnly').focus(),50);}
    function closeLinkModal(){document.getElementById('linkModal').classList.remove('show');}
    function saveLink(){const id=document.getElementById('linkEditId').value,val=document.getElementById('fLinkOnly').value.trim();if(!isShareLink(val)){toast(SHARE_ERR,'err');return;}const idx=presets.findIndex(x=>x.id===id);if(idx<0)return;presets[idx].link=val;saveData();closeLinkModal();renderAdminTable();toast('Link tersimpan','ok');}
    function savePreset(){const name=document.getElementById('fName').value.trim(),creator=document.getElementById('fCreator').value.trim();if(!name||!creator){toast('Nama & kreator wajib','err');return;}const linkVal=document.getElementById('fLink').value.trim();if(linkVal&&!isShareLink(linkVal)){toast(SHARE_ERR,'err');return;}const xmlUrl=document.getElementById('fXmlUrl').value.trim();if(xmlUrl&&!/^https?:\/\//i.test(xmlUrl)){toast('Masukkan link XML yang valid','err');return;}const editId=document.getElementById('editId').value;const data={name,creator,category:'XML',description:document.getElementById('fDesc').value.trim(),link:linkVal,thumb:document.getElementById('fThumb').value.trim(),trending:document.getElementById('fTrending').checked,popular:document.getElementById('fPopular').checked,xmlData:'',xmlName:'',xmlUrl,presetSize:'5MB'};if(editId){const idx=presets.findIndex(x=>x.id===editId);if(idx>=0)presets[idx]={...presets[idx],...data};toast('Diperbarui','ok');}else{data.id=nextId();data.date=new Date().toISOString().slice(0,10);presets.unshift(data);toast('Upload: '+data.id+(data.link?'':' (menunggu)'),'ok');}saveData();closeModal();renderAdminTable();}
    function copyPresetXML(id){copyXMLLink(id);}
    function copyXMLLink(id){const p=presets.find(x=>x.id===id);if(!p||!p.xmlUrl){toast('Link XML belum diisi','err');return;}copyText(p.xmlUrl,'Link XML disalin!');}
    function deletePreset(id){presets=presets.filter(p=>p.id!==id);favorites=favorites.filter(f=>f!==id);saveData();saveFavs();renderAdminTable();toast('Dihapus','ok');}
    function esc(s){if(!s)return'';return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');}
    function toast(msg,type){const c=document.getElementById('toastContainer'),t=document.createElement('div');t.className='toast '+(type==='err'?'err':'ok');t.textContent=msg;c.appendChild(t);setTimeout(()=>{t.style.opacity='0';t.style.transition='opacity .3s';setTimeout(()=>t.remove(),300);},2200);}

    document.getElementById('presetModal').addEventListener('click',e=>{if(e.target===e.currentTarget)closeModal();});
    document.getElementById('linkModal').addEventListener('click',e=>{if(e.target===e.currentTarget)closeLinkModal();});
    document.getElementById('fLinkOnly').addEventListener('keydown',e=>{if(e.key==='Enter')saveLink();});
    document.getElementById('adminPass').addEventListener('keydown',e=>{if(e.key==='Enter')adminLogin();});

    loadData();window.addEventListener('hashchange',parseRoute);parseRoute();
  </script>
</body>
</html>
