<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
  <title>KENZIE PRESET LIBRARY</title>
  <meta name="theme-color" content="#f2f2f7" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=JetBrains+Mono:wght@600;700&family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  <style>
    /* =====================================================
       KENZIE PRESET — Liquid Glass redesign
       (fungsi / JavaScript tidak diubah)
       ===================================================== */
    :root {
      color-scheme: light;
      --bg: #e7ecfb; --bg-2: #f6f2ff;
      --ink: #0e1322; --muted: #505b76;
      --g1: rgba(255,255,255,.80); --g2: rgba(255,255,255,.44);
      --edge: rgba(255,255,255,.95);
      --hair: rgba(14,19,34,.10);
      --ctl: rgba(255,255,255,.62); --ctl-edge: rgba(14,19,34,.10);
      --shadow: 0 0 0 1px rgba(14,19,34,.04), 0 14px 34px -14px rgba(52,70,150,.32);
      --accent: #2563eb; --accent-2: #7c3aed; --blue: var(--accent);
      --btn-a: #2f6df0; --btn-b: #6d45ee;
      --btn-glow: rgba(88,72,236,.55);
      --green: #0a7a41; --green-bg: rgba(16,160,90,.15);
      --red: #cf2c3c; --red-bg: rgba(220,50,65,.12);
      --amber: #865600; --amber-bg: rgba(240,170,0,.18);
      --idc: #1d4ed8; --idbg: rgba(37,99,235,.12);
      --sheet: #f8f9ff;
      --scrim: rgba(12,16,40,.38);
      --blob1: #79a6ff; --blob2: #c79dff; --blob3: #6fe2cf; --blob-o: .55;
      --blur: 16px; --sat: 170%; --glow: 0 0 0 0 transparent;
      --ease: cubic-bezier(.2,.8,.2,1);
      --gx: 14px;
      --nav-h: 64px;
      --font: 'Plus Jakarta Sans', 'Inter', -apple-system, BlinkMacSystemFont, 'SF Pro Display', system-ui, sans-serif;
      --mono: 'JetBrains Mono', ui-monospace, SFMono-Regular, Menlo, monospace;
    }
    [data-theme="dark"] {
      color-scheme: dark;
      --bg: #06070e; --bg-2: #0d0f1f;
      --ink: #f3f5fb; --muted: #a9b1c7;
      --g1: rgba(255,255,255,.13); --g2: rgba(255,255,255,.04);
      --edge: rgba(255,255,255,.18);
      --hair: rgba(255,255,255,.10);
      --ctl: rgba(255,255,255,.08); --ctl-edge: rgba(255,255,255,.15);
      --shadow: 0 1px 0 rgba(255,255,255,.12) inset, 0 20px 44px -18px rgba(0,0,0,.75);
      --accent: #6aa3ff; --accent-2: #a98bff;
      --green: #5ee69a; --green-bg: rgba(60,220,140,.14);
      --red: #ff7683; --red-bg: rgba(255,90,105,.14);
      --amber: #ffcf5c; --amber-bg: rgba(255,200,60,.14);
      --idc: #9cc0ff; --idbg: rgba(106,163,255,.16);
      --sheet: #14172a;
      --scrim: rgba(0,0,8,.6);
      --blob1: #2f55d4; --blob2: #6d37d6; --blob3: #0f8f87; --blob-o: .5;
    }
    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after { animation: none !important; transition: none !important; }
    }

    * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
    html { background: var(--bg); scroll-behavior: smooth; -webkit-text-size-adjust: 100%; }
    body {
      min-height: 100vh; min-height: 100dvh;
      background: var(--bg); color: var(--ink);
      font-family: var(--font); font-size: 15px; line-height: 1.5;
      overflow-x: hidden; touch-action: manipulation;
      -webkit-font-smoothing: antialiased;
      transition: background-color .35s, color .35s;
    }
    ::selection { background: rgba(109,69,238,.28); }
    button, input, textarea, select { font: inherit; color: inherit; }
    button { cursor: pointer; }
    a { color: inherit; text-decoration: none; }
    code { font-family: var(--mono); }

    /* ---------- Aurora background ---------- */
    .aurora {
      position: fixed; inset: 0; z-index: 0; overflow: hidden; pointer-events: none;
      background: radial-gradient(120% 80% at 50% -10%, var(--bg-2), var(--bg) 70%);
      transition: background .35s;
    }
    .aurora i {
      position: absolute; width: 70vmax; height: 70vmax; border-radius: 50%;
      opacity: var(--blob-o); will-change: transform;
    }
    .aurora i:nth-child(1) { background: radial-gradient(circle, var(--blob1) 0%, transparent 62%); left: -25vmax; top: -25vmax; animation: drift1 28s ease-in-out infinite alternate; }
    .aurora i:nth-child(2) { background: radial-gradient(circle, var(--blob2) 0%, transparent 62%); right: -30vmax; top: 10vmax; animation: drift2 34s ease-in-out infinite alternate; }
    .aurora i:nth-child(3) { background: radial-gradient(circle, var(--blob3) 0%, transparent 62%); left: -10vmax; bottom: -35vmax; animation: drift3 31s ease-in-out infinite alternate; }
    @keyframes drift1 { to { transform: translate3d(22vmax, 16vmax, 0) scale(1.15); } }
    @keyframes drift2 { to { transform: translate3d(-20vmax, 18vmax, 0) scale(.9); } }
    @keyframes drift3 { to { transform: translate3d(26vmax, -14vmax, 0) scale(1.12); } }

    /* ---------- Layout ---------- */
    .app {
      position: relative; z-index: 1;
      width: min(100%, 1080px); margin: 0 auto;
      padding: calc(10px + env(safe-area-inset-top, 0px)) var(--gx) calc(var(--nav-h) + env(safe-area-inset-bottom, 0px) + 44px);
      min-height: 100vh; min-height: 100dvh;
    }
    .page { display: none; }
    .page.active { display: block; animation: pageIn .45s var(--ease); }
    @keyframes pageIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: none; } }

    /* ---------- Liquid glass surface ---------- */
    .topbar, .card, .stats, .back, .chip, .link-box, .admin-card, .login-box, .bottom-nav, .toast, .warn {
      background: linear-gradient(155deg, var(--g1), var(--g2));
      border: 1px solid var(--edge);
      box-shadow: var(--shadow), var(--glow);
      -webkit-backdrop-filter: blur(var(--blur)) saturate(var(--sat));
      backdrop-filter: blur(var(--blur)) saturate(var(--sat));
      transition: background-color .35s, border-color .35s, box-shadow .35s, transform .4s var(--ease);
    }
    @supports not ((backdrop-filter: blur(1px)) or (-webkit-backdrop-filter: blur(1px))) {
      .topbar, .card, .stats, .back, .chip, .link-box, .admin-card, .login-box, .bottom-nav, .toast { background: var(--sheet); }
    }

    /* ---------- Topbar ---------- */
    .topbar {
      position: sticky; top: calc(8px + env(safe-area-inset-top, 0px)); z-index: 30;
      display: flex; flex-wrap: wrap; align-items: center; gap: 10px;
      padding: 10px; border-radius: 28px; max-width: 100%;
    }
    .brand { order: 1; flex: 1 1 0; min-width: 0; display: flex; align-items: center; gap: 11px; cursor: pointer; }
    .brandmark {
      width: 44px; height: 44px; flex: 0 0 44px; border-radius: 50%; overflow: hidden;
      display: grid; place-items: center;
      background: linear-gradient(145deg, var(--btn-a), var(--btn-b)); color: #fff;
      font-weight: 800; font-size: 15px; letter-spacing: .02em;
      box-shadow: inset 0 1px 0 rgba(255,255,255,.4), 0 6px 16px -6px var(--btn-glow);
    }
    .brandmark img { width: 100%; height: 100%; object-fit: cover; display: block; }
    .brandtext { display: flex; flex-direction: column; justify-content: center; gap: 3px; font-weight: 800; font-size: 15px; line-height: 1; letter-spacing: -.01em; }
    .brandtext span { display: block; margin: 0; font-size: 9.5px; font-weight: 700; letter-spacing: .28em; color: var(--muted); }

    .icon-btn {
      order: 2; flex: 0 0 44px; width: 44px; height: 44px; border-radius: 50%;
      display: grid; place-items: center; font-size: 18px; line-height: 1;
      color: var(--ink); background: var(--ctl); border: 1px solid var(--ctl-edge);
      transition: transform .3s var(--ease), background-color .3s;
    }
    .icon-btn svg { width: 20px; height: 20px; display: block; }
    .icon-btn:active { transform: scale(.92); }

    .search-wrap { order: 3; flex: 1 1 100%; position: relative; max-width: none; }
    .search-input {
      width: 100%; height: 46px; padding: 0 42px 0 44px; outline: none;
      border-radius: 999px; font-size: 14.5px;
      background: var(--ctl); border: 1px solid var(--ctl-edge); color: var(--ink);
      transition: border-color .3s, box-shadow .3s, background-color .3s;
    }
    .search-input::placeholder { color: var(--muted); opacity: 1; }
    .search-input:focus { border-color: var(--accent); box-shadow: 0 0 0 4px color-mix(in srgb, var(--accent) 22%, transparent); }
    .search-icon { position: absolute; left: 16px; top: 50%; transform: translateY(-50%); color: var(--muted); pointer-events: none; }
    .clear-btn {
      position: absolute; right: 8px; top: 50%; transform: translateY(-50%);
      width: 30px; height: 30px; border: none; border-radius: 50%;
      background: var(--ctl); color: var(--muted); font-size: 12px;
      display: none; place-items: center;
    }
    .clear-btn.show { display: grid; }

    @media (min-width: 720px) {
      .topbar { flex-wrap: nowrap; border-radius: 999px; padding: 8px 10px 8px 8px; }
      .brand { flex: 0 0 auto; }
      .search-wrap { order: 2; flex: 1 1 auto; max-width: 440px; margin: 0 auto; }
      .icon-btn { order: 3; }
    }

    /* ---------- Stats + categories ---------- */
    .stats {
      display: inline-flex; align-items: center; gap: 8px;
      margin: 18px 0 14px; padding: 8px 15px 8px 13px; border-radius: 999px;
      font-size: 12.5px; font-weight: 600; color: var(--muted);
    }
    .stats::before {
      content: ""; width: 8px; height: 8px; border-radius: 50%; background: var(--green);
      box-shadow: 0 0 0 0 var(--green); animation: ping 2.4s ease-out infinite;
    }
    @keyframes ping { 0% { box-shadow: 0 0 0 0 color-mix(in srgb, var(--green) 60%, transparent); } 80%, 100% { box-shadow: 0 0 0 8px transparent; } }
    .stats b { color: var(--ink); font-weight: 800; }

    .cats {
      display: flex; flex-wrap: nowrap; gap: 8px; margin: 0 calc(var(--gx) * -1) 22px; padding: 4px var(--gx);
      overflow-x: auto; scrollbar-width: none; -webkit-overflow-scrolling: touch;
    }
    .cats::-webkit-scrollbar { display: none; }
    .cat {
      flex: 0 0 auto; display: inline-flex; align-items: center; justify-content: center;
      min-height: 40px; padding: 0 17px; border-radius: 999px; white-space: nowrap;
      font-size: 13px; font-weight: 700; line-height: 1; color: var(--muted);
      background: var(--ctl); border: 1px solid var(--ctl-edge);
      transition: transform .3s var(--ease), background .3s, color .3s, box-shadow .3s;
    }
    .cat:active { transform: scale(.95); }
    .cat.active {
      color: #fff; border-color: transparent;
      background: linear-gradient(135deg, var(--btn-a), var(--btn-b)) border-box;
      box-shadow: inset 0 1px 0 rgba(255,255,255,.38), 0 8px 20px -8px var(--btn-glow);
    }

    /* ---------- Sections / grid ---------- */
    .section { margin-bottom: 32px; }
    .section-title {
      display: flex; align-items: center; gap: 10px;
      font-size: 22px; font-weight: 800; letter-spacing: -.02em; line-height: 1.2; margin-bottom: 14px;
    }
    .section-title::before { content: ""; width: 5px; height: 22px; border-radius: 4px; background: linear-gradient(var(--btn-a), var(--btn-b)); flex: 0 0 5px; }
    .grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px; }
    @media (min-width: 640px) { .grid { grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 16px; } }
    @media (min-width: 900px) { .grid { grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 18px; } }

    /* ---------- Card ---------- */
    .card {
      position: relative; display: flex; flex-direction: column; overflow: hidden;
      border-radius: 24px; min-width: 0;
    }
    .card::after {
      content: ""; position: absolute; inset: 0; pointer-events: none; z-index: 3;
      background: linear-gradient(115deg, transparent 38%, rgba(255,255,255,.30) 50%, transparent 62%);
      transform: translateX(-130%); transition: transform .9s var(--ease);
    }
    @media (hover: hover) {
      .card:hover { transform: translateY(-3px); }
      .card:hover::after { transform: translateX(130%); }
    }
    .card-thumb {
      position: relative; aspect-ratio: 16/10; margin: 6px 6px 0; border-radius: 19px; overflow: hidden; cursor: pointer;
      background: linear-gradient(135deg, color-mix(in srgb, var(--accent) 22%, transparent), color-mix(in srgb, var(--accent-2) 22%, transparent));
    }
    .card-thumb::after { content: ""; position: absolute; inset: 0; pointer-events: none; background: linear-gradient(to top, rgba(0,0,0,.28), transparent 45%); }
    .card-thumb { color: #fff; }
    .card-thumb img { width: 100%; height: 100%; object-fit: cover; display: block; }
    .card-badge {
      position: absolute; top: 8px; left: 8px; z-index: 2;
      padding: 4px 9px; border-radius: 999px; font-size: 10.5px; font-weight: 800; letter-spacing: .02em; line-height: 1.2; color: #fff;
      background: rgba(10,12,24,.45); border: 1px solid rgba(255,255,255,.22);
      -webkit-backdrop-filter: blur(10px); backdrop-filter: blur(10px);
    }
    .card-fav {
      position: absolute; top: 6px; right: 6px; z-index: 2;
      width: 34px; height: 34px; border-radius: 50%; font-size: 15px; line-height: 1;
      display: grid; place-items: center; color: #fff;
      background: rgba(10,12,24,.45); border: 1px solid rgba(255,255,255,.22);
      -webkit-backdrop-filter: blur(10px); backdrop-filter: blur(10px);
      transition: transform .3s var(--ease);
    }
    .card-fav:active { transform: scale(.85); }
    .card-body { flex: 1; display: flex; flex-direction: column; align-items: flex-start; padding: 12px 12px 12px; }
    .card-id, .detail-id, .admin-card-id {
      display: inline-flex; align-items: center; font-family: var(--mono); font-weight: 700; letter-spacing: .02em;
      color: var(--idc); background: var(--idbg); line-height: 1;
    }
    .card-id { font-size: 10.5px; padding: 5px 8px; border-radius: 8px; }
    .card-title {
      width: 100%; margin: 8px 0 3px; font-size: 14.5px; font-weight: 800; line-height: 1.25; letter-spacing: -.01em; cursor: pointer;
      overflow-wrap: anywhere; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden;
    }
    .card-meta { width: 100%; margin-bottom: 12px; font-size: 12px; font-weight: 500; color: var(--muted); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .card-actions { width: 100%; display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-top: auto; }

    /* ---------- Buttons ---------- */
    .btn, .btn-sm, .btn-xs {
      position: relative; overflow: hidden; isolation: isolate;
      display: inline-flex; align-items: center; justify-content: center; gap: 6px;
      text-align: center; white-space: nowrap; line-height: 1; font-weight: 700;
      color: var(--ink); background: var(--ctl); border: 1px solid var(--ctl-edge);
      transition: transform .3s var(--ease), box-shadow .3s, background-color .3s, filter .3s;
    }
    .btn { min-height: 46px; padding: 0 20px; border-radius: 999px; font-size: 14px; }
    .btn-sm { min-height: 40px; padding: 0 10px; border-radius: 999px; font-size: 12.5px; width: 100%; }
    .btn-xs { min-height: 42px; padding: 0 10px; border-radius: 999px; font-size: 12.5px; width: 100%; }
    .btn:active, .btn-sm:active, .btn-xs:active { transform: scale(.96); }
    @media (hover: hover) { .btn:hover, .btn-sm:hover, .btn-xs:hover { transform: translateY(-1px) scale(1.02); } }

    .btn-primary, .btn-sm.primary, .btn-xs.fill {
      color: #fff; border-color: transparent; background-origin: border-box;
      background: linear-gradient(135deg, var(--btn-a), var(--btn-b)) border-box;
      box-shadow: inset 0 1px 0 rgba(255,255,255,.4), 0 8px 20px -9px var(--btn-glow);
    }
    .btn-primary::after, .btn-sm.primary::after, .btn-xs.fill::after {
      content: ""; position: absolute; inset: 0; z-index: -1; pointer-events: none;
      background: linear-gradient(110deg, transparent 35%, rgba(255,255,255,.38) 50%, transparent 65%);
      transform: translateX(-130%); transition: transform .8s var(--ease);
    }
    @media (hover: hover) { .btn-primary:hover::after, .btn-sm.primary:hover::after, .btn-xs.fill:hover::after { transform: translateX(130%); } }
    .btn-xs.danger { color: var(--red); background: var(--red-bg); border-color: transparent; }
    button:disabled, .btn:disabled, .btn-sm:disabled { opacity: .5; cursor: not-allowed; transform: none !important; }

    /* ---------- Detail ---------- */
    .back {
      display: inline-flex; align-items: center; gap: 6px; min-height: 42px; padding: 0 16px 0 12px;
      border-radius: 999px; font-size: 13.5px; font-weight: 700; margin-bottom: 14px; cursor: pointer;
    }
    .detail-thumb {
      border-radius: 24px; overflow: hidden; aspect-ratio: 16/10; margin-bottom: 16px;
      background: linear-gradient(135deg, color-mix(in srgb, var(--accent) 18%, transparent), color-mix(in srgb, var(--accent-2) 18%, transparent));
      border: 1px solid var(--edge); box-shadow: var(--shadow);
    }
    .detail-thumb img { width: 100%; height: 100%; object-fit: cover; display: block; }
    .detail-info { padding: 0 2px; }
    .detail-id { font-size: 12px; padding: 6px 12px; border-radius: 999px; cursor: pointer; margin-bottom: 10px; }
    .detail-info h1 { font-size: clamp(24px, 5vw, 34px); font-weight: 800; letter-spacing: -.02em; line-height: 1.15; margin: 8px 0 10px; }
    .detail-meta { display: flex; flex-wrap: wrap; gap: 6px; margin: 10px 0; }
    .chip {
      display: inline-flex; align-items: center; gap: 4px;
      padding: 6px 12px; border-radius: 999px; font-size: 12px; font-weight: 600; color: var(--muted);
    }
    .chip b { color: var(--ink); font-weight: 700; }
    .detail-desc { color: var(--muted); font-size: 14px; line-height: 1.55; margin: 10px 0 14px; }
    .link-box {
      display: flex; flex-direction: column; gap: 8px;
      padding: 12px; border-radius: 18px; margin-bottom: 10px;
    }
    .link-box code { font-size: 12.5px; color: var(--accent); word-break: break-all; line-height: 1.4; }
    .link-actions { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
    .detail-actions { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 14px; }
    .warn { padding: 12px 14px; border-radius: 14px; font-size: 13px; color: var(--amber); margin-bottom: 10px; }

    /* ---------- Admin ---------- */
    .login-box { max-width: 340px; margin: 40px auto; padding: 28px 20px; border-radius: 24px; text-align: center; }
    .login-box h2 { font-size: 20px; font-weight: 800; margin-bottom: 16px; }
    .form-input {
      width: 100%; height: 46px; padding: 0 14px; border-radius: 14px; outline: none;
      background: var(--ctl); border: 1px solid var(--ctl-edge); font-size: 14px; margin-bottom: 10px;
    }
    .form-input:focus { border-color: var(--accent); }
    textarea.form-input { height: auto; padding: 10px 14px; resize: vertical; min-height: 70px; }
    .admin-header { margin-bottom: 14px; }
    .admin-header h2 { font-size: 22px; font-weight: 800; margin-bottom: 12px; }
    .admin-btns { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-bottom: 14px; }
    .admin-btns .btn { min-height: 44px; }
    .admin-list { display: flex; flex-direction: column; gap: 10px; }
    .admin-card { border-radius: 20px; padding: 14px; }
    .admin-card-top { display: flex; justify-content: space-between; align-items: center; margin-bottom: 6px; }
    .admin-card-id { font-size: 11px; padding: 4px 10px; border-radius: 999px; }
    .admin-card-name { font-size: 16px; font-weight: 800; margin-bottom: 4px; word-break: break-word; }
    .admin-card-meta { font-size: 12px; color: var(--muted); margin-bottom: 10px; }
    .admin-card-actions { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 8px; }
    .status { font-size: 11px; font-weight: 700; padding: 4px 10px; border-radius: 999px; }
    .status.ok { background: var(--green-bg); color: var(--green); }
    .status.wait { background: var(--amber-bg); color: var(--amber); }

    /* ---------- Modal ---------- */
    .overlay {
      position: fixed; inset: 0; z-index: 100; background: var(--scrim);
      display: none; align-items: flex-end; justify-content: center;
      -webkit-backdrop-filter: blur(6px); backdrop-filter: blur(6px);
    }
    .overlay.show { display: flex; }
    body.modal-open { overflow: hidden; }
    .modal {
      width: 100%; max-width: 480px; max-height: 90dvh; overflow-y: auto;
      background: var(--sheet); border-radius: 24px 24px 0 0; padding: 18px 16px 24px;
      -webkit-overflow-scrolling: touch;
    }
    .modal h3 { font-size: 18px; font-weight: 800; margin-bottom: 14px; position: sticky; top: 0; background: var(--sheet); padding-bottom: 8px; }
    .form-group { margin-bottom: 12px; }
    .form-group label { display: block; font-size: 12px; font-weight: 600; color: var(--muted); margin-bottom: 4px; }
    .check-row { display: flex; align-items: center; gap: 8px; margin-bottom: 8px; font-size: 14px; }
    .modal-actions { display: flex; gap: 8px; justify-content: flex-end; margin-top: 14px; }

    /* ---------- Bottom nav ---------- */
    .bottom-nav {
      position: fixed; bottom: 0; left: 0; right: 0; z-index: 40;
      display: flex; justify-content: space-around; align-items: center;
      height: calc(var(--nav-h) + env(safe-area-inset-bottom, 0px));
      padding-bottom: env(safe-area-inset-bottom, 0px);
      border-radius: 24px 24px 0 0; border-bottom: none;
    }
    .nav-item {
      display: flex; flex-direction: column; align-items: center; gap: 2px;
      font-size: 10px; font-weight: 600; color: var(--muted); background: none; border: none;
      padding: 6px 12px; transition: color .3s;
    }
    .nav-item svg { width: 22px; height: 22px; }
    .nav-item.active { color: var(--accent); }
    @media (min-width: 700px) { .bottom-nav { display: none; } .app { padding-bottom: 24px; } }

    /* ---------- Toast ---------- */
    .toasts { position: fixed; bottom: calc(var(--nav-h) + 16px); left: 50%; transform: translateX(-50%); z-index: 200; display: flex; flex-direction: column; gap: 6px; pointer-events: none; }
    .toast { padding: 10px 16px; border-radius: 14px; font-size: 13px; font-weight: 600; animation: toastIn .3s var(--ease); }
    .toast.ok { color: var(--green); }
    .toast.err { color: var(--red); }
    @keyframes toastIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: none; } }

    /* ---------- Misc ---------- */
    .empty { text-align: center; color: var(--muted); padding: 40px 20px; }
    .load-more { display: block; margin: 16px auto; }
    .glass-btn { background: var(--ctl) !important; }
  </style>
</head>
<body>

  <nav class="bottom-nav">

      <svg fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><polyline points="9 22 9 12 15 12 15 22"/></svg>Home

      <svg fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M20.84 4.61a5.5 5.5 0 0 0-7.78 0L12 5.67l-1.06-1.06a5.5 5.5 0 0 0-7.78 7.78l1.06 1.06L12 21.23l7.78-7.78 1.06-1.06a5.5 5.5 0 0 0 0-7.78z"/></svg>Favorit

      <svg fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg>Admin

          <button type="button" class="btn btn-outline" style="font-size:12px;flex:1" onclick="document.getElementById('fThumb').removeAttribute('capture');document.getElementById('fThumb').click()">Galeri</button>
          <button type="button" class="btn btn-outline" style="font-size:12px;flex:1" onclick="document.getElementById('fThumb').setAttribute('capture','environment');document.getElementById('fThumb').click()">Kamera</button>

        <div id="thumbPreview" style="width:100%;aspect-ratio:16/10;background:var(--ctl);border-radius:14px;display:grid;place-items:center;overflow:hidden;font-size:28px;opacity:.4">🎬</div>

        <button type="button" class="btn btn-outline" style="font-size:12px;margin-top:6px;width:100%" onclick="document.getElementById('fVideoFile').click()">Atau pilih video dari galeri</button>
        <div id="videoPreview" style="margin-top:8px;font-size:11px;color:var(--muted)"></div>

      <div class="check-row"><input type="checkbox" id="fTrending" /><label for="fTrending">Trending</label></div>

  <div class="overlay" id="linkModal">
    <div class="modal">
      <h3>Isi Link Share</h3>
      <input type="hidden" id="linkEditId" />
      <p id="linkModalName" style="color:var(--muted);font-size:12px;margin-bottom:10px"></p>
      <div class="form-group"><label>Link Alight Motion *</label><input class="form-input" id="fLinkOnly" placeholder="https://alightcreative.com/am/share/..." /></div>
      <div class="modal-actions">
        <button class="btn btn-outline" onclick="closeLinkModal()">Batal</button>
        <button class="btn btn-primary" onclick="saveLink()">Simpan</button>
      </div>

  </div>

  <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-database-compat.js"></script>
  <script>
    const FAV_KEY = 'kenzie_favs_v1', ADMIN_KEY = 'kenzie_admin_ok', LOCAL_KEY = 'kenzie_presets_v2', ADMIN_PASS = 'kenzie', MODE_KEY = 'kenzie_mode';
    const SITE_URL = 'https://kenzie-preset.vercel.app';
    const firebaseConfig = {
      apiKey: "AIzaSyDuRmnuZ0XMqwdh7X4ITutmwTgA3YL-5bc",
      authDomain: "kenzie-preset.firebaseapp.com",
      databaseURL: "https://kenzie-preset-default-rtdb.firebaseio.com",
      projectId: "kenzie-preset",
      storageBucket: "kenzie-preset.firebasestorage.app",
      messagingSenderId: "225447135498",
      appId: "1:225447135498:web:ce6515b38b10ea602e92f3",
      measurementId: "G-NFC225TYLB"
    };
    let db = null;
    try {
      if (firebaseConfig.apiKey && !firebaseConfig.apiKey.startsWith('ISI_')) {
        firebase.initializeApp(firebaseConfig);
        db = firebase.database();
      }
    } catch (e) { console.warn('Firebase init', e); }

    function lsGet(k) { try { return localStorage.getItem(k); } catch { return null; } }
    function lsSet(k, v) { try { localStorage.setItem(k, v); } catch {} }
    function lsDel(k) { try { localStorage.removeItem(k); } catch {} }

    function getSiteBase() {
      if ((location.protocol === 'http:' || location.protocol === 'https:') && !['localhost','127.0.0.1'].includes(location.hostname)) return location.origin;
      return SITE_URL;
    }
    function webLink(p) { return p?.id ? getSiteBase() + '/#preset/' + p.id : getSiteBase() + '/#home'; }
    const SHARE_RE = /^https?:\/\/(www\.)?alightcreative\.com\/am\/share\/\S+$/i;
    function isShareLink(u) { return SHARE_RE.test((u||'').trim()); }
    function isTikTok(u) { return /^https?:\/\/(www\.)?(vm\.)?tiktok\.com\/\S+$/i.test((u||'').trim()); }

    let presets = [], favorites = [], currentCat = 'All', searchQuery = '', allPage = 1, isAdmin = false, currentPage = 'home', delArm = null, delTimer = null, loaded = false, siteMode = 'public';
    const PAGE_SIZE = 12;

    function nextId() {
      const nums = presets.map(p => { const m = (p.id||'').match(/RYZ-(\d+)/); return m ? parseInt(m[1],10) : 0; });
      const max = nums.length ? Math.max(...nums) : 0;
      return 'RYZ-' + String(max + 1).padStart(3, '0');
    }

    // ===== TRACKING =====
    function getVisitorId() {
      let id = lsGet('kenzie_vid');
      if (!id) { id = 'v_' + Date.now().toString(36) + Math.random().toString(36).slice(2,6); lsSet('kenzie_vid', id); }
      return id;
    }
    function logEvent(type, extra) {
      if (!db) return;
      const entry = {
        type,
        time: new Date().toISOString(),
        vid: getVisitorId(),
        ua: navigator.userAgent.slice(0, 120),
        page: location.hash || '#home',
        ...extra
      };
      db.ref('logs').push(entry).catch(()=>{});
    }
    setTimeout(() => logEvent('visit'), 500);

    const AVATAR_KEY = 'kenzie_avatar';
    function applyAvatar(src) {
      const el = document.getElementById('brandAvatar');
      if (!el) return;
      if (src) el.innerHTML = '<img src="' + src + '" alt=""/>';
      else el.textContent = 'RZ';
    }
    function uploadAvatar(input) {
      const file = input.files && input.files[0];
      if (!file) return;
      const reader = new FileReader();
      reader.onload = function(e) {
        const img = new Image();
        img.onload = function() {
          const c = document.createElement('canvas');
          c.width = 200; c.height = 200;
          c.getContext('2d').drawImage(img, 0, 0, 200, 200);
          const data = c.toDataURL('image/jpeg', 0.8);
          lsSet(AVATAR_KEY, data);
          applyAvatar(data);
          if (db) db.ref('settings/avatar').set(data).catch(()=>{});
          toast('Foto profil diperbarui', 'ok');
        };
        img.src = e.target.result;
      };
      reader.readAsDataURL(file);
    }
    async function loadAvatar() {
      let src = lsGet(AVATAR_KEY);
      if (db) {
        try {
          const snap = await db.ref('settings/avatar').once('value');
          if (snap.val()) { src = snap.val(); lsSet(AVATAR_KEY, src); }
        } catch(e) {}
      }
      if (!src) {
        try {
          const r = await fetch('https://kenzie-preset-default-rtdb.firebaseio.com/settings/avatar.json');
          if (r.ok) { const v = await r.json(); if (v) { src = v; lsSet(AVATAR_KEY, src); } }
        } catch(e) {}
      }
      applyAvatar(src);
    }

    async function loadData() {
      isAdmin = lsGet(ADMIN_KEY) === '1';
      siteMode = lsGet(MODE_KEY) || 'public';
      try { favorites = JSON.parse(lsGet(FAV_KEY) || '[]'); } catch { favorites = []; }
      let collected = [];
      const addAll = (arr) => {
        if (!Array.isArray(arr)) return;
        for (const p of arr) {
          if (p && p.id && p.name && !collected.some(x => x.id === p.id)) collected.push(p);
        }
      };
      try {
        const r = await fetch('https://kenzie-preset-default-rtdb.firebaseio.com/presets.json');
        if (r.ok) {
          const val = await r.json();
          if (Array.isArray(val)) addAll(val);
          else if (val && typeof val === 'object') addAll(Object.values(val));
        }
      } catch (e) { console.warn('REST', e); }
      if (db) {
        try {
          const snap = await db.ref('presets').once('value');
          const val = snap.val();
          if (Array.isArray(val)) addAll(val);
          else if (val && typeof val === 'object') addAll(Object.values(val));
        } catch (e) { console.warn('SDK', e); }
      }
      try { addAll(JSON.parse(lsGet(LOCAL_KEY) || '[]')); } catch {}
      presets = collected;
      if (presets.length) lsSet(LOCAL_KEY, JSON.stringify(presets));
      loaded = true;
    }

    function saveData() { 
      lsSet(LOCAL_KEY, JSON.stringify(presets)); 
      publishPresets();
    }
    async function publishPresets() {
      if (!Array.isArray(presets)) { toast('Tidak ada preset', 'err'); return; }
      toast('Menyimpan...', 'ok');
      try {
        if (db) {
          await db.ref('presets').set(presets);
          toast('Berhasil! Tersimpan di Firebase', 'ok'); renderHome();
          lsSet(LOCAL_KEY, JSON.stringify(presets));
        }
      } catch (e) { toast('Gagal: ' + e.message, 'err'); }
    }

    function getFiltered() {
      let list = [...presets];
      if (currentCat === 'XML') list = list.filter(p => p.xmlUrl);
      else if (currentCat === 'PRESET5MB') list = list.filter(p => p.link);
      else if (currentCat === 'Trending') list = list.filter(p => p.trending);
      else if (currentCat === 'Popular') list = list.filter(p => p.popular);
      if (searchQuery) {
        const q = searchQuery.toLowerCase();
        list = list.filter(p => (p.name||'').toLowerCase().includes(q) || (p.creator||'').toLowerCase().includes(q) || (p.id||'').toLowerCase().includes(q));
      }
      return list;
    }

    function cardHTML(p) {
      const isFav = favorites.includes(p.id);
      const thumb = p.thumb
        ? '<img src="' + esc(p.thumb) + '" alt="" style="width:100%;height:100%;object-fit:cover"/>'
        : '<div style="width:100%;height:100%;display:grid;place-items:center;font-size:28px;opacity:.35">🎬</div>';
      const play = p.video
        ? '<div style="position:absolute;inset:0;display:grid;place-items:center;background:rgba(0,0,0,.25);font-size:22px;pointer-events:none">▶</div>'
        : '';
      const badge = currentCat === 'XML' ? 'XML' : (p.link ? '5MB' : 'XML');
      const main = currentCat === 'XML'
        ? (p.xmlUrl ? '<a class="btn-sm primary" href="' + esc(p.xmlUrl) + '" target="_blank" onclick="event.stopPropagation()">Buka XML</a>' : '<button class="btn-sm primary" disabled>XML</button>')
        : (p.link ? '<a class="btn-sm primary" href="' + esc(p.link) + '" onclick="event.stopPropagation()">Impor</a>' : '<button class="btn-sm primary" disabled>Belum</button>');
      return '<div class="card"><div class="card-thumb" onclick="navigate(\'detail\',\'' + p.id + '\')">' + thumb + play + '<span class="card-badge">' + badge + '</span><button class="card-fav" onclick="event.stopPropagation();toggleFav(\'' + p.id + '\')">' + (isFav ? '❤️' : '🤍') + '</button></div><div class="card-body"><span class="card-id">' + p.id + '</span><div class="card-title" onclick="navigate(\'detail\',\'' + p.id + '\')">' + esc(p.name) + '</div><div class="card-meta">' + esc(p.creator) + '</div><div class="card-actions">' + main + '<button class="btn-sm" onclick="event.stopPropagation();copyWebLink(\'' + p.id + '\')">Salin</button></div></div></div>';
    }

    function renderHome() {
      document.getElementById('totalCount').textContent = presets.length;
      document.getElementById('readyCount').textContent = presets.filter(p=>p.link).length;
      const titles = { All:'Semua preset', Trending:'Trending', Popular:'Populer', XML:'Preset XML', PRESET5MB:'Preset 5MB' };
      const list = getFiltered();
      document.getElementById('listTitle').textContent = searchQuery ? 'Hasil: "' + searchQuery + '"' : (titles[currentCat] || 'Semua preset');
      document.getElementById('gridAll').innerHTML = list.slice(0, allPage*PAGE_SIZE).map(cardHTML).join('') || '<div class="empty">Belum ada preset</div>';
      const btn = document.getElementById('loadMoreBtn');
      if (btn) btn.style.display = list.length > allPage*PAGE_SIZE ? 'block' : 'none';
    }
    function loadMore() { allPage++; renderHome(); }

    function renderDetail(id) {
      const p = presets.find(x => x.id === id);
      if (!p) { document.getElementById('detailContent').innerHTML = '<div class="empty">Preset tidak ditemukan</div>'; return; }
      const isFav = favorites.includes(p.id);
      const thumb = p.thumb ? `<img src="${esc(p.thumb)}" alt=""/>` : `<div style="width:100%;height:100%;display:grid;place-items:center;font-size:48px;opacity:.3">🎬</div>`;
      const el = document.getElementById('detailContent');
      el.innerHTML = `<div class="detail-thumb">${thumb}</div><div class="detail-info"><span class="detail-id" onclick="copyWebLink('${p.id}')">${p.id}</span><h1>${esc(p.name)}</h1><div class="detail-meta"><span class="chip"><b>Kreator</b> ${esc(p.creator)}</span><span class="chip"><b>Upload</b> ${esc(p.date||'-')}</span>${p.trending?'<span class="chip">Trending</span>':''}${p.popular?'<span class="chip">Populer</span>':''}</div>${p.description?`<p class="detail-desc">${esc(p.description)}</p>`:''}${p.link?`<div class="link-box"><code>${esc(p.link)}</code><div class="link-actions"><a class="btn-sm primary" href="${esc(p.link)}" target="_blank">Open Link</a><button class="btn-sm" onclick="copyAlightLink('${p.id}')">Salin</button></div></div>`:`<div class="warn">⏳ Menunggu link Alight Motion</div>`}${p.demo?`<div class="link-box"><code>${esc(p.demo)}</code><div class="link-actions"><a class="btn-sm primary" href="${esc(p.demo)}" target="_blank">Open Link</a><button class="btn-sm" onclick="copyDemoLink('${p.id}')">Salin</button></div></div>`:''}${p.xmlUrl?`<div class="link-box"><code>${esc(p.xmlUrl)}</code><div class="link-actions"><a class="btn-sm primary" href="${esc(p.xmlUrl)}" target="_blank">Open Link</a><button class="btn-sm" onclick="copyXMLLink('${p.id}')">Salin</button></div></div>`:''}${p.video && !p.video.startsWith('data:')?`<div class="link-box"><code>${esc(p.video)}</code><div class="link-actions"><a class="btn-sm primary" href="${esc(p.video)}" target="_blank">Open Link</a></div></div>`:''}<div class="detail-actions">${p.link?`<a class="btn btn-primary" href="${esc(p.link)}">Impor</a>`:'<button class="btn btn-primary" disabled>Impor</button>'}<button class="btn btn-outline" onclick="copyWebLink('${p.id}')">Salin Web</button><button class="btn btn-outline" onclick="sharePreset('${p.id}')">Bagikan</button><button class="btn btn-outline" onclick="toggleFav('${p.id}');renderDetail('${p.id}')">${isFav?'❤️':'🤍'}</button></div></div>`;
      document.getElementById('gridSimilar').innerHTML = presets.filter(x=>x.id!==p.id).slice(0,4).map(cardHTML).join('') || '<p style="color:var(--muted)">Tidak ada</p>';
    }

    function renderFavorites() {
      const list = presets.filter(p=>favorites.includes(p.id));
      const g = document.getElementById('gridFav'), e = document.getElementById('favEmpty');
      if (!list.length) { g.innerHTML=''; e.style.display='block'; } else { e.style.display='none'; g.innerHTML=list.map(cardHTML).join(''); }
    }

    function navigate(page, id) {
      if (siteMode === 'private' && !isAdmin && page !== 'admin') {
        window.scrollTo(0,0); currentPage = 'admin';
        document.querySelectorAll('.page').forEach(p => p.classList.remove('active'));
        document.getElementById('adminPage').classList.add('active');
        setHash('#admin');
        document.querySelectorAll('.nav-item').forEach(n => n.classList.remove('active'));
        document.querySelector('.nav-item[data-page="admin"]')?.classList.add('active');
        showAdminLogin();
        return;
      }
      window.scrollTo(0,0); currentPage = page;
      document.querySelectorAll('.page').forEach(p => p.classList.remove('active'));
      document.querySelectorAll('.nav-item').forEach(n => n.classList.remove('active'));
      if (page === 'home') {
        document.getElementById('homePage').classList.add('active');
        setHash('#home'); document.querySelector('.nav-item[data-page="home"]')?.classList.add('active');
        renderHome();
      } else if (page === 'detail' && id) {
        document.getElementById('detailPage').classList.add('active');
        setHash('#preset/' + id); renderDetail(id);
      } else if (page === 'favorites') {
        document.getElementById('favPage').classList.add('active');
        setHash('#favorit'); document.querySelector('.nav-item[data-page="favorites"]')?.classList.add('active');
        renderFavorites();
      } else if (page === 'admin') {
        document.getElementById('adminPage').classList.add('active');
        setHash('#admin'); document.querySelector('.nav-item[data-page="admin"]')?.classList.add('active');
        if (isAdmin) showAdminPanel(); else showAdminLogin();
      }
    }
    function setHash(h) { if (location.hash !== h) history.replaceState(null, '', h); }
    function parseRoute() {
      const h = (location.hash||'#home').slice(1);
      if (h.startsWith('preset/')) { const id = h.slice(7).split(/[/?#]/)[0]; if (id) { navigate('detail', id); return; } }
      if (/^RYZ-\d+/i.test(h)) { navigate('detail', h.split(/[/?#]/)[0].toUpperCase()); return; }
      if (h === 'favorit' || h === 'favorites') navigate('favorites');
      else if (h === 'admin') navigate('admin');
      else navigate('home');
    }

    function copyText(text, msg) {
      const fb = () => { try { const ta=document.createElement('textarea'); ta.value=text; document.body.appendChild(ta); ta.select(); document.execCommand('copy'); document.body.removeChild(ta); toast(msg,'ok'); } catch { toast('Gagal','err'); } };
      if (navigator.clipboard?.writeText) navigator.clipboard.writeText(text).then(()=>toast(msg,'ok')).catch(fb); else fb();
    }
    function copyWebLink(id) { const p=presets.find(x=>x.id===id); if(p) copyText(webLink(p),'Link web disalin!'); }
    function copyAlightLink(id) { const p=presets.find(x=>x.id===id); if(p?.link) copyText(p.link,'Link disalin!'); else toast('Belum diisi','err'); }
    function copyDemoLink(id) { const p=presets.find(x=>x.id===id); if(p?.demo) copyText(p.demo,'TikTok disalin!'); }
    function copyXMLLink(id) { const p=presets.find(x=>x.id===id); if(p?.xmlUrl) copyText(p.xmlUrl,'XML disalin!'); }
    function sharePreset(id) { const p=presets.find(x=>x.id===id); if(!p) return; const url=webLink(p), text=`${p.name} (${p.id})\n${url}`; if(navigator.share) navigator.share({title:p.name,text,url}).catch(()=>copyText(text,'Disalin!')); else copyText(text,'Disalin!'); }
    function toggleFav(id) { const i=favorites.indexOf(id); if(i>=0) favorites.splice(i,1); else favorites.push(id); saveFavs(); toast(i>=0?'Dihapus':'Ditambah favorit','ok'); if(currentPage==='home') renderHome(); else if(currentPage==='favorites') renderFavorites(); }
    function saveFavs() { lsSet(FAV_KEY, JSON.stringify(favorites)); }

    document.getElementById('searchInput').addEventListener('input', e => {
      searchQuery = e.target.value.trim();
      document.getElementById('clearSearch').classList.toggle('show', !!searchQuery);
      if (document.getElementById('homePage').classList.contains('active')) renderHome(); else navigate('home');
    });
    function clearSearch() { searchQuery=''; document.getElementById('searchInput').value=''; document.getElementById('clearSearch').classList.remove('show'); renderHome(); }
    document.getElementById('catBar').addEventListener('click', e => {
      const btn = e.target.closest('.cat'); if(!btn) return;
      document.querySelectorAll('.cat').forEach(b=>b.classList.remove('active')); btn.classList.add('active');
      currentCat = btn.dataset.cat; allPage=1; renderHome();
    });

    function showAdminLogin() { document.getElementById('adminLogin').style.display='block'; document.getElementById('adminPanel').style.display='none'; }
    function showAdminPanel() { 
      document.getElementById('adminLogin').style.display='none'; 
      document.getElementById('adminPanel').style.display='block'; 
      updateModeButton();
      renderAdminTable(); 
    }
    function updateModeButton() {
      const btn = document.getElementById('modeToggleBtn');
      if (btn) {
        btn.textContent = siteMode === 'private' ? 'Private' : 'Public';
        btn.style.background = siteMode === 'private' ? 'var(--red)' : '';
        btn.style.color = siteMode === 'private' ? '#fff' : '';
      }
    }
    function toggleSiteMode() {
      siteMode = siteMode === 'public' ? 'private' : 'public';
      lsSet(MODE_KEY, siteMode);
      updateModeButton();
      toast(siteMode === 'private' ? 'Mode Private aktif' : 'Mode Public aktif', 'ok');
    }
    function adminLogin() { if(document.getElementById('adminPass').value===ADMIN_PASS){ isAdmin=true; lsSet(ADMIN_KEY,'1'); showAdminPanel(); toast('Login OK','ok'); logEvent('admin_login'); } else toast('Password salah','err'); }
    function adminLogout() { isAdmin=false; lsDel(ADMIN_KEY); showAdminLogin(); toast('Logout','ok'); logEvent('admin_logout'); }
    function askDelete(id) { clearTimeout(delTimer); if(delArm===id){ delArm=null; deletePreset(id); return; } delArm=id; renderAdminTable(); delTimer=setTimeout(()=>{delArm=null;renderAdminTable();},3000); }
    function renderAdminTable() {
      const el = document.getElementById('adminTableBody');
      if (!presets.length) { el.innerHTML = '<p style="text-align:center;color:var(--muted);padding:20px">Belum ada preset</p>'; return; }
      el.innerHTML = presets.map(p => {
        const tipe = [p.xmlUrl?'XML':'', p.link?'Alight':''].filter(Boolean).join(' + ') || '—';
        const status = p.link ? '<span class="status ok">Siap</span>' : '<span class="status wait">Wait</span>';
        const flags = (p.trending?' · Trending':'') + (p.popular?' · Populer':'');
        return '<div class="admin-card">' +
          '<div class="admin-card-top"><span class="admin-card-id">' + p.id + '</span>' + status + '</div>' +
          '<div class="admin-card-name">' + esc(p.name) + '</div>' +
          '<div class="admin-card-meta">' + esc(p.creator) + ' · ' + tipe + flags + '</div>' +
          '<div class="admin-card-actions">' +
            '<button class="btn-xs ' + (p.link?'':'fill') + '" onclick="openLinkModal(\'' + p.id + '\')">' + (p.link?'Ubah Link':'Isi Link') + '</button>' +
            '<button class="btn-xs" onclick="openEditModal(\'' + p.id + '\')">Edit</button>' +
            '<button class="btn-xs danger" onclick="askDelete(\'' + p.id + '\')">' + (delArm===p.id?'Yakin?':'Hapus') + '</button>' +
          '</div></div>';
      }).join('');
    }

    function handleVideoFile(input) {
      const file = input.files && input.files[0];
      if (!file) return;
      if (file.size > 2 * 1024 * 1024) {
        toast('Video terlalu besar. Pakai link saja', 'err');
        input.value = '';
        return;
      }
      const reader = new FileReader();
      reader.onload = function(e) {
        document.getElementById('fVideo').value = e.target.result;
        document.getElementById('videoPreview').textContent = 'Video siap: ' + file.name;
      };
      reader.readAsDataURL(file);
    }
    function previewThumb(input) {
      const file = input.files && input.files[0];
      if (!file) return;
      const reader = new FileReader();
      reader.onload = function(e) {
        const img = new Image();
        img.onload = function() {
          const canvas = document.createElement('canvas');
          const max = 600;
          let w = img.width, h = img.height;
          if (w > max || h > max) {
            if (w > h) { h = Math.round(h * max / w); w = max; }
            else { w = Math.round(w * max / h); h = max; }
          }
          canvas.width = w; canvas.height = h;
          canvas.getContext('2d').drawImage(img, 0, 0, w, h);
          const data = canvas.toDataURL('image/jpeg', 0.7);
          document.getElementById('fThumbData').value = data;
          document.getElementById('thumbPreview').innerHTML = '<img src="' + data + '" style="width:100%;height:100%;object-fit:cover"/>';
        };
        img.src = e.target.result;
      };
      reader.readAsDataURL(file);
    }
    function openAddModal() { document.getElementById('modalTitle').textContent='Upload Preset'; document.getElementById('editId').value=''; ['fName','fCreator','fDesc','fLink','fDemo','fXmlUrl'].forEach(id=>document.getElementById(id).value=''); document.getElementById('fTrending').checked=false; document.getElementById('fPopular').checked=false; document.getElementById('fThumbData').value=''; document.getElementById('thumbPreview').innerHTML='🎬'; document.getElementById('fThumb').value=''; document.getElementById('fVideo').value=''; document.getElementById('videoPreview').textContent=''; document.getElementById('fVideoFile').value=''; document.getElementById('presetModal').classList.add('show'); document.body.classList.add('modal-open'); }
    function openEditModal(id) { const p=presets.find(x=>x.id===id); if(!p) return; document.getElementById('modalTitle').textContent='Edit'; document.getElementById('editId').value=id; document.getElementById('fName').value=p.name||''; document.getElementById('fCreator').value=p.creator||''; document.getElementById('fDesc').value=p.description||''; document.getElementById('fLink').value=p.link||''; document.getElementById('fDemo').value=p.demo||''; document.getElementById('fXmlUrl').value=p.xmlUrl||''; document.getElementById('fTrending').checked=!!p.trending; document.getElementById('fPopular').checked=!!p.popular; document.getElementById('fThumbData').value=p.thumb||''; document.getElementById('thumbPreview').innerHTML=p.thumb?'<img src="'+p.thumb+'" style="width:100%;height:100%;object-fit:cover"/>':'🎬'; document.getElementById('fThumb').value=''; document.getElementById('fVideo').value=''; document.getElementById('videoPreview').textContent=''; document.getElementById('fVideoFile').value=''; document.getElementById('presetModal').classList.add('show'); document.body.classList.add('modal-open'); }
    function closeModal() { document.getElementById('presetModal').classList.remove('show'); document.body.classList.remove('modal-open'); }
    function openLinkModal(id) { const p=presets.find(x=>x.id===id); if(!p) return; document.getElementById('linkEditId').value=id; document.getElementById('linkModalName').textContent=p.id+' · '+p.name; document.getElementById('fLinkOnly').value=p.link||''; document.getElementById('linkModal').classList.add('show'); document.body.classList.add('modal-open'); setTimeout(()=>document.getElementById('fLinkOnly').focus(),50); }
    function closeLinkModal() { document.getElementById('linkModal').classList.remove('show'); document.body.classList.remove('modal-open'); }
    function saveLink() { const id=document.getElementById('linkEditId').value, val=document.getElementById('fLinkOnly').value.trim(); if(!isShareLink(val)){ toast('Link Alight Motion tidak valid','err'); return; } const idx=presets.findIndex(x=>x.id===id); if(idx<0) return; presets[idx].link=val; saveData(); closeLinkModal(); renderAdminTable(); toast('Link tersimpan','ok'); }
    function savePreset() {
      const name=document.getElementById('fName').value.trim(), creator=document.getElementById('fCreator').value.trim();
      if(!name||!creator){ toast('Nama & kreator wajib','err'); return; }
      const linkVal=document.getElementById('fLink').value.trim(); if(linkVal&&!isShareLink(linkVal)){ toast('Link Alight tidak valid','err'); return; }
      const demoVal=document.getElementById('fDemo').value.trim(); if(demoVal&&!isTikTok(demoVal)){ toast('Link TikTok tidak valid','err'); return; }
      const xmlUrl=document.getElementById('fXmlUrl').value.trim(); if(xmlUrl&&!/^https?:\/\//i.test(xmlUrl)){ toast('Link XML tidak valid','err'); return; }
      const editId=document.getElementById('editId').value;
      const data={name,creator,description:document.getElementById('fDesc').value.trim(),link:linkVal,demo:demoVal,xmlUrl,trending:document.getElementById('fTrending').checked,popular:document.getElementById('fPopular').checked,thumb:document.getElementById('fThumbData').value,video:document.getElementById('fVideo').value.trim()};
      if(editId){ const idx=presets.findIndex(x=>x.id===editId); if(idx>=0) presets[idx]={...presets[idx],...data}; toast('Diperbarui','ok'); }
      else { data.id=nextId(); data.date=new Date().toISOString().slice(0,10); presets.unshift(data); toast('Upload: '+data.id,'ok'); }
      saveData(); closeModal(); renderAdminTable(); renderHome();
    }
    function deletePreset(id) { presets=presets.filter(p=>p.id!==id); favorites=favorites.filter(f=>f!==id); saveData(); saveFavs(); renderAdminTable(); toast('Dihapus','ok'); }
    function esc(s){ if(!s) return ''; return String(s).replace(/&/g,'&').replace(/</g,'<').replace(/>/g,'>').replace(/"/g,'"'); }
    function toast(msg,type){ const c=document.getElementById('toastContainer'), t=document.createElement('div'); t.className='toast '+(type==='err'?'err':'ok'); t.textContent=msg; c.appendChild(t); setTimeout(()=>{t.style.opacity='0';t.style.transition='opacity .3s';setTimeout(()=>t.remove(),300);},2000); }

    // Theme toggle
    const themeKey = 'kenzie_theme';
    const root = document.documentElement;
    const themeBtn = document.getElementById('themeToggle');
    function applyTheme(t) {
      if (t === 'dark') { root.dataset.theme = 'dark'; themeBtn.textContent = '☾'; document.querySelector('meta[name="theme-color"]').content = '#06070e'; }
      else { delete root.dataset.theme; themeBtn.textContent = '☀'; document.querySelector('meta[name="theme-color"]').content = '#e7ecfb'; }
      lsSet(themeKey, t);
    }
    themeBtn.onclick = () => applyTheme(root.dataset.theme === 'dark' ? 'light' : 'dark');
    const saved = lsGet(themeKey);
    if (saved === 'dark' || (!saved && matchMedia('(prefers-color-scheme: dark)').matches)) applyTheme('dark');
    else applyTheme('light');

    document.getElementById('presetModal').addEventListener('click', e => { if(e.target===e.currentTarget) closeModal(); });
    document.getElementById('linkModal').addEventListener('click', e => { if(e.target===e.currentTarget) closeLinkModal(); });
    document.getElementById('fLinkOnly').addEventListener('keydown', e => { if(e.key==='Enter') saveLink(); });
    document.getElementById('adminPass').addEventListener('keydown', e => { if(e.key==='Enter') adminLogin(); });

    let lastTouchEnd = 0;
    document.addEventListener('touchend', function(e) {
      const now = Date.now();
      if (now - lastTouchEnd <= 300) e.preventDefault();
      lastTouchEnd = now;
    }, { passive: false });

    loadData().then(() => { parseRoute(); loadAvatar(); });

    // Effect intensity
    const FX_KEY = 'kenzie_fx';
    const fxLevels = ['low', 'med', 'hard'];
    const fxLabels = { low: 'Low', med: 'Medium', hard: 'Hard' };
    let fxIndex = 0;
    function applyEffect(level) {
      document.body.classList.remove('fx-low', 'fx-med', 'fx-hard');
      document.body.classList.add('fx-' + level);
      const btn = document.getElementById('fxBtn');
      if (btn) btn.textContent = 'Efek: ' + fxLabels[level];
      try { localStorage.setItem(FX_KEY, level); } catch {}
    }
    function cycleEffect() {
      fxIndex = (fxIndex + 1) % 3;
      applyEffect(fxLevels[fxIndex]);
      const level = fxLevels[fxIndex];
      const msgs = { low: 'Efek Low — halus', med: 'Efek Medium — kuat', hard: 'Efek HARD — brutal!' };
      toast(msgs[level], 'ok');
      if (level === 'hard') {
        document.body.style.transition = 'filter 0.2s';
        document.body.style.filter = 'brightness(1.15)';
        setTimeout(() => { document.body.style.filter = ''; }, 200);
      }
    }
    try {
      const savedFx = localStorage.getItem(FX_KEY);
      if (savedFx && fxLevels.includes(savedFx)) { fxIndex = fxLevels.indexOf(savedFx); applyEffect(savedFx); }
      else applyEffect('low');
    } catch { applyEffect('low'); }

    window.addEventListener('hashchange', parseRoute);
  </script>
</body>
</html>
