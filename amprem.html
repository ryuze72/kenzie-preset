<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>AM Premium</title>
<script>
(function () {
  fetch('/amprem-src.html?v=' + Date.now(), { cache: 'no-store' })
    .then(function (r) { if (!r.ok) throw new Error('HTTP ' + r.status); return r.text(); })
    .then(function (html) {
      document.open();
      document.write(html);
      document.close();
    })
    .catch(function (e) {
      document.body.innerHTML = '<p style="color:#fff;padding:24px;font-family:sans-serif;background:#080b17">Gagal memuat AM Premium: ' + (e && e.message || e) + '. Hard-refresh.</p>';
    });
})();
</script>
</head>
<body style="background:#080b17;margin:0;min-height:100vh"></body>
</html>
