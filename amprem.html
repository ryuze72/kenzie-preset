<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>AM Premium</title>
<link rel="stylesheet" href="/amprem-scroll-fix.css">
<script>
(function () {
  var v = '?v=' + Date.now();
  Promise.all([
    fetch('/amprem-a.txt' + v, { cache: 'no-store' }).then(function (r) { if (!r.ok) throw new Error('a ' + r.status); return r.text(); }),
    fetch('/amprem-b.txt' + v, { cache: 'no-store' }).then(function (r) { if (!r.ok) throw new Error('b ' + r.status); return r.text(); })
  ]).then(function (parts) {
    var html = parts.join('');
    if (html.length < 1000) throw new Error('konten kosong');
    document.open();
    document.write(html);
    document.close();
    setTimeout(function () {
      var s = document.createElement('link');
      s.rel = 'stylesheet';
      s.href = '/amprem-scroll-fix.css?v=' + Date.now();
      document.head.appendChild(s);
    }, 30);
  }).catch(function (e) {
    document.body.innerHTML = '<p style="color:#fff;padding:24px;font-family:sans-serif;background:#080b17">Gagal memuat AM Premium: ' + (e && e.message || e) + '</p>';
  });
})();
</script>
</head>
<body style="background:#080b17;margin:0;min-height:100vh"></body>
</html>
