<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>AM Premium</title>
<style>
:root { --bg:#0a0a12; --card:#12141f; --ink:#f5f5f7; --muted:#9ca3af; --blue:#3b82f6; --purple:#a855f7; --pink:#ec4899; --green:#22c55e; --red:#ef4444; }
* { box-sizing:border-box; margin:0; padding:0; }
body { font-family:-apple-system,BlinkMacSystemFont,sans-serif; background:var(--bg); color:var(--ink); min-height:100dvh; }
.header { padding:16px; display:flex; align-items:center; gap:12px; }
.logo { width:44px; height:44px; border-radius:50%; background:linear-gradient(145deg,#fff,#e5e5ea); color:#111; display:grid; place-items:center; font-weight:800; font-size:18px; }
.tabs { display:flex; gap:6px; flex:1; overflow-x:auto; }
.tab { padding:8px 14px; border-radius:999px; border:1px solid rgba(255,255,255,.1); background:rgba(255,255,255,.06); color:var(--muted); font-size:12px; font-weight:600; white-space:nowrap; }
.tab.active { background:linear-gradient(135deg,#3b82f6,#a855f7); color:#fff; border-color:transparent; }
.stats { padding:0 16px 12px; font-size:12px; color:var(--muted); display:flex; gap:16px; }
.stats span { display:flex; align-items:center; gap:4px; }
.dot { width:6px; height:6px; border-radius:50%; }
.dot.green { background:var(--green); }
.desc { padding:0 16px 16px; font-size:13px; color:var(--muted); line-height:1.5; }
.card { margin:0 16px; background:linear-gradient(160deg,#1a1c2e,#12141f); border-radius:24px; padding:20px; border:1px solid rgba(255,255,255,.08); }
.card-title { display:flex; align-items:center; gap:8px; font-size:18px; font-weight:700; margin-bottom:6px; }
.card-title::before { content:""; width:10px; height:10px; border-radius:50%; background:linear-gradient(135deg,#3b82f6,#a855f7); }
.card-sub { font-size:13px; color:var(--muted); margin-bottom:16px; }
.label { font-size:11px; font-weight:700; color:var(--muted); letter-spacing:.05em; margin-bottom:6px; display:flex; align-items:center; gap:6px; }
.label::before { content:""; width:6px; height:6px; border-radius:50%; background:var(--blue); }
input, textarea { width:100%; padding:14px; border-radius:16px; border:1px solid rgba(255,255,255,.1); background:rgba(0,0,0,.3); color:var(--ink); font-size:14px; outline:none; margin-bottom:12px; }
textarea { min-height:100px; resize:none; }
input:focus, textarea:focus { border-color:var(--blue); }
.btn { width:100%; height:50px; border:none; border-radius:999px; font-weight:700; font-size:15px; cursor:pointer; margin-bottom:10px; }
.btn-send { background:linear-gradient(135deg,#3b82f6,#06b6d4); color:#fff; }
.btn-verify { background:linear-gradient(135deg,#a855f7,#ec4899); color:#fff; }
.btn:disabled { opacity:.5; }
.legend { display:flex; gap:10px; margin-top:8px; }
.legend span { font-size:11px; padding:6px 12px; border-radius:999px; background:rgba(255,255,255,.06); display:flex; align-items:center; gap:6px; }
.msg { margin-top:12px; padding:12px; border-radius:12px; font-size:13px; text-align:center; display:none; }
.msg.ok { display:block; background:rgba(34,197,94,.15); color:var(--green); }
.msg.err { display:block; background:rgba(239,68,68,.15); color:var(--red); }
</style>
</head>
<body>
<div class="header">
  <div class="logo">R</div>
  <div class="tabs">
    <button class="tab active">AM PREMIUM</button>
    <button class="tab">Temp Mail</button>
    <button class="tab">Saved</button>
    <button class="tab">Guide</button>
  </div>
</div>
<div class="stats">
  <span><span class="dot green"></span> <b id="visitors">0</b> visitors</span>
  <span><span class="dot green"></span> <b id="verified">0</b> verified</span>
</div>
<p class="desc">Masukkan email, kirim magic link, lalu verifikasi dari link yang kamu terima.</p>
<div class="card">
  <div class="card-title">Verify your account</div>
  <p class="card-sub">Gunakan email yang kamu miliki atau berhak kamu akses.</p>
  <div class="label">ACCOUNT EMAIL</div>
  <input id="email" type="email" placeholder="you@example.com" />
  <button class="btn btn-send" id="btnSend" onclick="sendLink()">Send magic link →</button>
  <div class="label">VERIFICATION LINK</div>
  <textarea id="link" placeholder="Paste verification link di sini..."></textarea>
  <button class="btn btn-verify" id="btnVerif" onclick="verifyLink()">Verify account →</button>
  <div class="legend">
    <span style="color:var(--red)">● Merah = Error</span>
    <span style="color:var(--green)">● Hijau = Berhasil</span>
  </div>
  <div class="msg" id="msg"></div>
</div>
<script>
const API = 'https://v2.api-varhad.my.id/tools/amprem/verif';
let visitors = 0, verified = 0;
function showMsg(text, type) {
  const el = document.getElementById('msg');
  el.textContent = text;
  el.className = 'msg' + (type ? ' ' + type : '');
}
async function sendLink() {
  const email = document.getElementById('email').value.trim();
  if (!email || !email.includes('@')) { showMsg('Email tidak valid', 'err'); return; }
  const btn = document.getElementById('btnSend');
  btn.disabled = true; btn.textContent = 'Mengirim...';
  try {
    const r = await fetch(API + '/email?email=' + encodeURIComponent(email));
    const d = await r.json();
    if (d.status && d.result?.success) {
      showMsg(d.result.message || 'Link dikirim! Cek inbox/spam.', 'ok');
      visitors++; document.getElementById('visitors').textContent = visitors;
    } else {
      showMsg(d.message || 'Gagal mengirim', 'err');
    }
  } catch(e) { showMsg('Error: ' + e.message, 'err'); }
  btn.disabled = false; btn.textContent = 'Send magic link →';
}
async function verifyLink() {
  const email = document.getElementById('email').value.trim();
  const link = document.getElementById('link').value.trim();
  if (!email) { showMsg('Isi email dulu', 'err'); return; }
  if (!link) { showMsg('Tempel link dulu', 'err'); return; }
  const btn = document.getElementById('btnVerif');
  btn.disabled = true; btn.textContent = 'Memverifikasi...';
  try {
    const r = await fetch(API + '/link?email=' + encodeURIComponent(email) + '&link=' + encodeURIComponent(link));
    const d = await r.json();
    if (d.status) {
      showMsg(d.result?.message || d.message || 'Berhasil!', 'ok');
      verified++; document.getElementById('verified').textContent = verified;
    } else {
      showMsg(d.message || 'Gagal verifikasi', 'err');
    }
  } catch(e) { showMsg('Error: ' + e.message, 'err'); }
  btn.disabled = false; btn.textContent = 'Verify account →';
}
</script>
</body>
</html>
