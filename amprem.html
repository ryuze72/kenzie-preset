<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>AM Prem Verif</title>
<style>
:root { --bg:#06070e; --surface:#14172a; --ink:#f3f5fb; --muted:#a9b1c7; --accent:#6aa3ff; --green:#5ee69a; --red:#ff7683; }
* { box-sizing:border-box; margin:0; padding:0; }
body { font-family:-apple-system,BlinkMacSystemFont,sans-serif; background:var(--bg); color:var(--ink); min-height:100dvh; display:flex; align-items:center; justify-content:center; padding:16px; }
.box { width:100%; max-width:380px; background:var(--surface); border-radius:24px; padding:28px 20px; border:1px solid rgba(255,255,255,.1); }
h1 { font-size:20px; font-weight:800; text-align:center; margin-bottom:6px; }
.sub { text-align:center; color:var(--muted); font-size:13px; margin-bottom:20px; }
label { display:block; font-size:12px; font-weight:600; color:var(--muted); margin-bottom:4px; }
input { width:100%; height:46px; padding:0 14px; border-radius:14px; border:1px solid rgba(255,255,255,.1); background:rgba(255,255,255,.06); color:var(--ink); font-size:14px; outline:none; margin-bottom:12px; }
input:focus { border-color:var(--accent); }
.btn { width:100%; height:46px; border:none; border-radius:999px; background:linear-gradient(135deg,#2f6df0,#6d45ee); color:#fff; font-weight:700; font-size:14px; cursor:pointer; margin-top:4px; }
.btn:disabled { opacity:.5; }
.msg { margin-top:14px; padding:12px; border-radius:12px; font-size:13px; text-align:center; display:none; }
.msg.ok { display:block; background:rgba(94,230,154,.12); color:var(--green); }
.msg.err { display:block; background:rgba(255,118,131,.12); color:var(--red); }
.step { display:none; }
.step.active { display:block; }
</style>
</head>
<body>
<div class="box">
  <h1>AM Prem</h1>
  <p class="sub">Verifikasi Alight Motion Premium</p>
  <div class="step active" id="step1">
    <label>Email</label>
    <input id="email" type="email" placeholder="email@example.com" />
    <button class="btn" id="btnSend" onclick="sendLink()">Kirim Link</button>
  </div>
  <div class="step" id="step2">
    <label>Link verifikasi (dari email)</label>
    <input id="link" placeholder="Tempel link dari email" />
    <button class="btn" id="btnVerif" onclick="verifyLink()">Verifikasi</button>
    <button class="btn" style="background:transparent;border:1px solid rgba(255,255,255,.15);margin-top:8px" onclick="goStep(1)">Ganti Email</button>
  </div>
  <div class="msg" id="msg"></div>
</div>
<script>
const API = 'https://v2.api-varhad.my.id/tools/amprem/verif';
let currentEmail = '';
function goStep(n) {
  document.querySelectorAll('.step').forEach(s => s.classList.remove('active'));
  document.getElementById('step'+n).classList.add('active');
  showMsg('');
}
function showMsg(text, type) {
  const el = document.getElementById('msg');
  el.textContent = text;
  el.className = 'msg' + (type ? ' ' + type : '');
}
async function sendLink() {
  const email = document.getElementById('email').value.trim();
  if (!email || !email.includes('@')) { showMsg('Email tidak valid', 'err'); return; }
  const btn = document.getElementById('btnSend');
  btn.disabled = true; btn.textContent = 'Mengirim...';
  try {
    const r = await fetch(API + '/email?email=' + encodeURIComponent(email));
    const d = await r.json();
    if (d.status && d.result?.success) {
      currentEmail = email;
      showMsg(d.result.message || 'Link dikirim! Cek inbox/spam.', 'ok');
      goStep(2);
    } else {
      showMsg(d.message || 'Gagal mengirim', 'err');
    }
  } catch(e) { showMsg('Error: ' + e.message, 'err'); }
  btn.disabled = false; btn.textContent = 'Kirim Link';
}
async function verifyLink() {
  const link = document.getElementById('link').value.trim();
  if (!link) { showMsg('Tempel link dulu', 'err'); return; }
  const btn = document.getElementById('btnVerif');
  btn.disabled = true; btn.textContent = 'Memverifikasi...';
  try {
    const r = await fetch(API + '/link?email=' + encodeURIComponent(currentEmail) + '&link=' + encodeURIComponent(link));
    const d = await r.json();
    if (d.status) {
      showMsg(d.result?.message || d.message || 'Berhasil!', 'ok');
    } else {
      showMsg(d.message || 'Gagal verifikasi', 'err');
    }
  } catch(e) { showMsg('Error: ' + e.message, 'err'); }
  btn.disabled = false; btn.textContent = 'Verifikasi';
}
</script>
</body>
</html>
